plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wowmobile.client'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wowmobile.client'
        minSdk 33
        targetSdk 35
        versionCode 1
        versionName "0.1"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"

                arguments \
                    "-DANDROID_STL=c++_shared", \
                    "-DOPENSSL_INCLUDE_DIR=${System.getenv('OPENSSL_INCLUDE_DIR') ?: ''}", \
                    "-DOPENSSL_CRYPTO_LIBRARY=${System.getenv('OPENSSL_CRYPTO_LIBRARY') ?: ''}", \
                    "-DOPENSSL_SSL_LIBRARY=${System.getenv('OPENSSL_SSL_LIBRARY') ?: ''}", \
                    "-DGLM_INCLUDE_DIR=${System.getenv('GLM_INCLUDE_DIR') ?: ''}"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/CMakeLists.txt")
            version "3.31.6"
        }
    }

    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
