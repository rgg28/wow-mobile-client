name: Compilar APK WoW Nativo C
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar codigo fuente del cliente WoW
        uses: actions/checkout@v4

      - name: Configurar Java 17 Estable
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Descargar Plantilla y Motor SDL2 Oficial para Android
        run: |
          # Descargamos una estructura de compilacion nativa de Android que ya incluye SDL2 configurado de fabrica
          git clone https://github.com build_android
          
          # Movemos tu archivo main.c dentro del corazon del proyecto de Android nativo
          mkdir -p build_android/app/src/main/jni/src
          cp main.c build_android/app/src/main/jni/src/main.c

      - name: Configurar e Instalar Android SDK Oficial de Google
        uses: android-actions/setup-android@v3

      - name: Ejecutar Compilador y Generar APK Nativa
        run: |
          cd build_android
          # Le otorgamos permisos al empaquetador de Google (Gradle)
          chmod +x gradlew
          
          # Compilamos la APK para celulares modernos (arm64-v8a) saltandonos los errores de Linker
          ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a

      - name: Subir APK de C puro para Descargar
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Nativo-C-APK
          path: build_android/app/build/outputs/apk/debug/*.apk
