name: Build Android App with SDL3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo fuente del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17 Estable
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar e Instalar Android SDK Oficial de Google
      uses: android-actions/setup-android@v3

    - name: Autogenerar archivos del Gradle Wrapper de forma Nativa
      run: gradle wrapper --gradle-version 8.2
      working-directory: ./mi-proyecto

    - name: Extraer librerias nativas de SDL3
      run: |
        cd mi-proyecto/app/libs
        # Desempaquetamos el archivo AAR solo para extraer los archivos binarios .so y las cabeceras (.h)
        unzip -q SDL3-3.4.16.aar -d jni_libs
      working-directory: .

    - name: Compilar APK Nativa con Gradle
      # Ejecutamos la compilación desde tu proyecto raíz real, respetando tu settings.gradle original
      run: ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a --no-build-cache
      working-directory: ./mi-proyecto

    - name: Subir APK de SDL3 para Descargar
      uses: actions/upload-artifact@v4
      with:
        name: WoW-SDL3-Mobile-APK
        path: mi-proyecto/app/build/outputs/apk/debug/*.apk
