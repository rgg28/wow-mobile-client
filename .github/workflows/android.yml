name: Compilar APK WoW Movil
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17 Estable
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar e Instalar Android SDK Oficial de Google
        uses: android-actions/setup-android@v3

      - name: Instalar Dependencias del Sistema y Compilador
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libbz2-dev libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.37 virtualenv

      - name: Vincular SDK y Compilar APK Nativa
        run: |
          # Creamos las carpetas iniciales que busca Buildozer
          mkdir -p ~/.buildozer/android/platform
          
          # Creamos un enlace espejo directo hacia el SDK oficial que instalo GitHub arriba
          ln -s $ANDROID_HOME ~/.buildozer/android/platform/android-sdk
          
          # Forzamos la ejecucion indicandole las rutas nativas del sistema
          export PATH=$PATH:~/.local/bin
          buildozer android debug
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
