name: Compilar APK WoW Movil
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Compilar APK con Inyeccion Automatizada de Root
        run: |
          # Creamos la carpeta local para que Docker no tenga problemas de permisos
          mkdir -p .buildozer
          
          # Ejecutamos el contenedor inyectando la respuesta 'y' de forma nativa
          echo "y" | docker run --rm \
            -v "${{ github.workspace }}":/home/user/app \
            -v "${{ github.workspace }}/.buildozer":/home/user/.buildozer \
            -w /home/user/app \
            -i \
            kivy/buildozer:latest android debug
