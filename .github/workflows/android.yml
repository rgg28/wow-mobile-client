name: Build Android App with SDL3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo fuente del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17 Estable
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Autogenerar archivos del Gradle Wrapper de forma Nativa
      run: gradle wrapper --gradle-version 8.2
      working-directory: ./mi-proyecto

    - name: Forzar Creacion de AndroidManifest con Caracteres Puros
      # Usamos comandos nativos de Linux para estampar los dos puntos (:) con precision milimetrica
      run: |
        mkdir -p app/src/main
        echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/AndroidManifest.xml
        echo '<manifest xmlns:android="http://android.com">' >> app/src/main/AndroidManifest.xml
        echo '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' >> app/src/main/AndroidManifest.xml
        echo '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' >> app/src/main/AndroidManifest.xml
        echo '    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' >> app/src/main/AndroidManifest.xml
        echo '    <application android:allowBackup="true" android:label="WoW Mobile C" android:theme="@style/Theme.AppCompat.NoActionBar">' >> app/src/main/AndroidManifest.xml
        echo '        <activity android:name="org.libsdl.app.SDLActivity" android:exported="true" android:configChanges="orientation|keyboardHidden|screenSize" android:screenOrientation="landscape">' >> app/src/main/AndroidManifest.xml
        echo '            <intent-filter>' >> app/src/main/AndroidManifest.xml
        echo '                <action android:name="android.intent.action.MAIN" />' >> app/src/main/AndroidManifest.xml
        echo '                <category android:name="android.intent.category.LAUNCHER" />' >> app/src/main/AndroidManifest.xml
        echo '            </intent-filter>' >> app/src/main/AndroidManifest.xml
        echo '        </activity>' >> app/src/main/AndroidManifest.xml
        echo '    </application>' >> app/src/main/AndroidManifest.xml
        echo '</manifest>' >> app/src/main/AndroidManifest.xml
        
        # Verificacion de seguridad en la consola
        cat app/src/main/AndroidManifest.xml
      working-directory: ./mi-proyecto

    - name: Otorgar permisos de ejecucion al script gradlew
      run: chmod +x ./gradlew
      working-directory: ./mi-proyecto

    - name: Compilar APK Final Destrabada
      run: ./gradlew assembleDebug --no-build-cache
      working-directory: ./mi-proyecto

    - name: Subir APK de SDL3 para Descargar
      uses: actions/upload-artifact@v4
      with:
        name: WoW-SDL3-Mobile-APK
        path: mi-proyecto/app/build/outputs/apk/debug/*.apk
