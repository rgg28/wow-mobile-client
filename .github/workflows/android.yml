name: Compilar APK WoW Movil
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Compilar APK usando el contenedor oficial de Kivy
        uses: docker://kivy/buildozer:latest
        with:
          args: android debug
