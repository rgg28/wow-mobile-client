name: Compilar APK WoW Movil
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17 Estable
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python 3.11 de Produccion
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias del Sistema y Compilador
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libbz2-dev libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.37 virtualenv

      - name: Compilar APK Vinculando el SDK del Servidor
        run: |
          # Creamos la estructura oculta inicial que busca Buildozer
          mkdir -p ~/.buildozer/android/platform
          
          # Vinculamos mediante un enlace espejo el SDK oficial preinstalado de GitHub
          ln -s $ANDROID_HOME ~/.buildozer/android/platform/android-sdk
          
          # Lanzamos la compilación nativa directa
          buildozer android debug
        env:
          # Forzamos las variables globales para que reconozca los binarios del servidor
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Subir APK terminada para Descargar
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Client-Pro-APK
          path: bin/*.apk
