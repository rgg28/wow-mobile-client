name: Build Android App with SDL3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo fuente del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17 Estable
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar e Instalar Android SDK Oficial de Google
      uses: android-actions/setup-android@v3

    - name: Autogenerar archivos del Gradle Wrapper de forma Nativa
      run: gradle wrapper --gradle-version 8.2
      working-directory: ./mi-proyecto

    - name: Fabricar AndroidManifest Binario Perfecto sin Errores
      # Este comando escribe el archivo directamente en el disco duro del servidor con formato LF puro de Linux
      run: |
        mkdir -p app/src/main
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com">
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
            <application
                android:allowBackup="true"
                android:label="WoW Mobile C"
                android:theme="@style/Theme.AppCompat.NoActionBar">
                <activity
                    android:name="org.libsdl.app.SDLActivity"
                    android:exported="true"
                    android:configChanges="orientation|keyboardHidden|screenSize"
                    android:screenOrientation="landscape">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
      working-directory: ./mi-proyecto

    - name: Otorgar permisos de ejecucion al script gradlew
      run: chmod +x ./gradlew
      working-directory: ./mi-proyecto

    - name: Compilar APK Final Destrabada
      run: ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a --no-build-cache
      working-directory: ./mi-proyecto

    - name: Subir APK de SDL3 para Descargar
      uses: actions/upload-artifact@v4
      with:
        name: WoW-SDL3-Mobile-APK
        path: mi-proyecto/app/build/outputs/apk/debug/*.apk
