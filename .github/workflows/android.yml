name: Build Android App with SDL3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo fuente del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17 Estable
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar e Instalar Android SDK Oficial de Google
      uses: android-actions/setup-android@v3

    - name: Autogenerar archivos del Gradle Wrapper de forma Nativa
      run: gradle wrapper --gradle-version 8.2
      working-directory: ./mi-proyecto

    - name: Reparar Sintaxis del Manifiesto de Fuerza en Linux
      # Este paso corrige cualquier comilla rota, espacios de nombres o falta de dos puntos introducidos por editores externos
      run: |
        sed -i 's/android name=/android:name=/g' app/src/main/AndroidManifest.xml
        sed -i 's/action name=/action:name=/g' app/src/main/AndroidManifest.xml
        sed -i 's/category name=/category:name=/g' app/src/main/AndroidManifest.xml
        
        # Verificacion visual obligatoria en la consola
        cat app/src/main/AndroidManifest.xml
      working-directory: ./mi-proyecto

    - name: Otorgar permisos de ejecucion al script gradlew
      run: chmod +x ./gradlew
      working-directory: ./mi-proyecto

    - name: Compilar APK Final Destrabada
      run: ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a --no-build-cache
      working-directory: ./mi-proyecto

    - name: Subir APK de SDL3 para Descargar
      uses: actions/upload-artifact@v4
      with:
        name: WoW-SDL3-Mobile-APK
        path: mi-proyecto/app/build/outputs/apk/debug/*.apk
