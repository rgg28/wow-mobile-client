name: Compilar APK WoW Movil
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17 Estable
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python 3.11 de Produccion
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias del Sistema y Compilador
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libbz2-dev libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.37 virtualenv

      - name: Pre-Aprobar Herramientas de Android de forma Masiva
        run: |
          # 1. Creamos las rutas obligatorias que busca Buildozer
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          
          # 2. Descargamos de forma segura las herramientas de linea de comandos oficiales
          mkdir -p ~/.buildozer/android/packages
          wget -q https://google.com -O .buildozer/android/packages/cmdline.zip
          unzip -q .buildozer/android/packages/cmdline.zip -d ~/.buildozer/android/platform/android-sdk/
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          mv ~/.buildozer/android/platform/android-sdk/cmdline-tools/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/ 2>/dev/null || true
          
          # 3. Forzamos la auto-aceptacion de licencias y actualizaciones en silencio usando 'yes' nativo
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n893547d6f52ca6474d9233ddf1a141d81e5334eb\n24333f1a63b68b449d3137a3554900db4d2e6102\n84831b9409646a547e30e308b27748e36444c890\nf991504443f313315fa667d5e434c3140db9f1d9\ne6b7c2de7d564f174c234b4502faeff3014c5577\n94f9f159efe1d9701a99de61f8bba1e32e85a059\nb41244e9ecef2346515f5e4d1544330fda02650a" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Compilar APK Nativa
        run: |
          export PATH=$PATH:~/.local/bin
          buildozer android debug
