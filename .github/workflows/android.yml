name: Compilar APK WoW Nativo C
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar codigo fuente del cliente WoW
        uses: actions/checkout@v4

      - name: Descargar Estructura Oficial de Android SDL2
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL-toolchain-android
          path: build_android

      - name: Configurar Java 17 Estable
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Mover Archivo de Codigo C al Proyecto Nativo
        run: |
          # Inyectamos tu main.c en el corazon del motor grafico de Android
          mkdir -p build_android/app/src/main/jni/src
          cp main.c build_android/app/src/main/jni/src/main.c

      - name: Configurar e Instalar Android SDK Oficial de Google
        uses: android-actions/setup-android@v3

      - name: Ejecutar Compilador y Generar APK Nativa
        run: |
          cd build_android
          chmod +x gradlew
          # Compilamos la APK para celulares modernos (arm64-v8a) con el motor Gradle
          ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a

      - name: Subir APK de C puro para Descargar
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Nativo-C-APK
          path: build_android/app/build/outputs/apk/debug/*.apk
