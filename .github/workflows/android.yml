name: Build Android App with SDL3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo fuente del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17 Estable
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar e Instalar Android SDK Oficial de Google
      uses: android-actions/setup-android@v3

    - name: Compilar APK usando el Sistema Oficial de SDL
      run: |
        # 1. Nos movemos a la carpeta donde tienes guardado el SDL3 descomprimido
        cd mi-proyecto/app/libs
        
        # 2. Desempaquetamos el archivo AAR oficial para extraer la plantilla nativa de Google sin errores humanos
        unzip -q SDL3-3.4.16.aar -d sdl_package
        
        # 3. CORREGIDO: Copiamos tu archivo main.c usando la ruta exacta de tu subcarpeta mi-proyecto
        mkdir -p sdl_package/jni/src
        cp ../../src/main/cpp/main.c sdl_package/jni/src/main.c
        
        # 4. Forzamos la compilacion directa de tu joystick y botonera con los binarios de SDL3
        cd sdl_package
        chmod +x gradlew 2>/dev/null || true
        gradle assembleDebug -Pandroid.injected.build.abi=arm64-v8a --no-build-cache

    - name: Subir APK de SDL3 Terminada
      uses: actions/upload-artifact@v4
      with:
        name: WoW-SDL3-Mobile-APK
        path: mi-proyecto/app/libs/sdl_package/build/outputs/apk/debug/*.apk
