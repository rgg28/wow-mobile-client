name: Build Android App with SDL3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo fuente del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17 Estable
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar e Instalar Android SDK Oficial de Google
      uses: android-actions/setup-android@v3

    - name: Compilar APK usando el Sistema Oficial de SDL
      run: |
        # 1. Buscamos de forma inteligente la ruta real del archivo main.c en el servidor
        RUTA_MAIN=$(find . -name "main.c" | head -n 1)
        echo "Archivo main.c encontrado con exito en la ruta: $RUTA_MAIN"
        
        # 2. Nos movemos a la carpeta de las librerías donde está el SDL3
        cd mi-proyecto/app/libs
        
        # 3. Desempaquetamos el archivo AAR oficial para extraer la plantilla nativa de Google
        unzip -q SDL3-3.4.16.aar -d sdl_package
        
        # 4. Inyectamos el archivo main.c que encontramos en el paso 1 dentro del compilador nativo
        mkdir -p sdl_package/jni/src
        cp "../../../$RUTA_MAIN" sdl_package/jni/src/main.c
        
        # 5. Forzamos la compilacion directa de tu joystick y botonera con los binarios de SDL3
        cd sdl_package
        chmod +x gradlew 2>/dev/null || true
        gradle assembleDebug -Pandroid.injected.build.abi=arm64-v8a --no-build-cache

    - name: Subir APK de SDL3 Terminada
      uses: actions/upload-artifact@v4
      with:
        name: WoW-SDL3-Mobile-APK
        path: mi-proyecto/app/libs/sdl_package/build/outputs/apk/debug/*.apk
