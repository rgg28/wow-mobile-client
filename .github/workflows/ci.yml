name: CI - Benilla Android

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      ANDROID_PLATFORM: android-33

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Liberar espacio
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            clang \
            lld

      - name: Extraer código de benilla.zip
        shell: bash
        run: |
          set -euo pipefail

          if [ -f benilla.zip ]; then
            mkdir -p /tmp/benilla-extracted
            unzip -q benilla.zip -d /tmp/benilla-extracted

            if [ -f /tmp/benilla-extracted/benilla-0.2.0/Cargo.toml ]; then
              cp -a /tmp/benilla-extracted/benilla-0.2.0/. .
            elif [ -f /tmp/benilla-extracted/Cargo.toml ]; then
              cp -a /tmp/benilla-extracted/. .
            else
              echo "::error::No se encontró Cargo.toml en benilla.zip"
              find /tmp/benilla-extracted -maxdepth 3 -name Cargo.toml
              exit 1
            fi
          else
            echo "benilla.zip no existe; se usará el código del repositorio."
          fi

          find . -maxdepth 4 -name Cargo.toml -print

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: >-
            platforms;android-33
            build-tools;33.0.2
            ndk;25.2.9519653

      - name: Configurar Rust para Android
        shell: bash
        run: |
          set -euo pipefail

          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
          rustc --version
          cargo --version

      - name: Configurar NDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Diagnosticar dependencia arboard
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f Cargo.toml ]; then
            echo "::error::No hay Cargo.toml en la raíz del repositorio."
            exit 1
          fi

          cargo tree -p benilla-app -i arboard || true

          echo "Revisar si arboard se activa desde benilla-app o desde otra dependencia."
          grep -RIn \
            --include='Cargo.toml' \
            --exclude-dir=target \
            'arboard' . || true

      - name: Compilar biblioteca Android
        shell: bash
        run: |
          set -euo pipefail

          cargo ndk \
            -t aarch64-linux-android \
            build \
            --release \
            -p benilla-app

          echo "Bibliotecas generadas:"
          find target -type f -name '*.so' -print

          if [ ! -f target/aarch64-linux-android/release/libbenilla_app.so ]; then
            echo "::error::No se generó libbenilla_app.so en la ruta esperada."
            find target -type f -name '*.so' -print
            exit 1
          fi

      - name: Construir APK Android
        shell: bash
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleRelease
          elif [ -f app/gradlew ]; then
            chmod +x app/gradlew
            cd app
            ./gradlew --no-daemon assembleRelease
          else
            echo "::error::No existe un proyecto Gradle con wrapper."
            echo "La biblioteca .so no es un APK instalable."
            exit 1
          fi

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find . -type f \
              -path '*/build/outputs/apk/*/*.apk' \
              -not -path '*/build/intermediates/*'
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::Gradle terminó sin generar ningún APK."
            exit 1
          fi

          printf 'APK generado: %s\n' "${APKS[@]}"

          for apk in "${APKS[@]}"; do
            test -s "$apk"
            unzip -t "$apk"
          done

      - name: Subir APK y bibliotecas nativas
        uses: actions/upload-artifact@v4
        with:
          name: Benilla-WoW-Classic-Android-Build
          if-no-files-found: error
          path: |
            **/build/outputs/apk/**/*.apk
            target/aarch64-linux-android/release/*.so
