name: Compilar APK WoW Android (Snapdragon 695)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar herramientas de descompresión
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extraer el proyecto WoW Forever
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "wow-forever-android.zip" ]; then
            echo "::error::No se encontró wow-forever-android.zip en la raíz del repositorio."
            exit 1
          fi

          mkdir -p project_extracted
          unzip -o wow-forever-android.zip -d project_extracted

          if [ -d "project_extracted/wow-forever-android" ]; then
            cp -a project_extracted/wow-forever-android/. ./
          else
            cp -a project_extracted/. ./
          fi

          rm -rf project_extracted wow-forever-android.zip

          if [ ! -f "gradlew" ]; then
            echo "::error::No se encontró gradlew después de extraer el proyecto."
            find . -maxdepth 3 -name gradlew -print
            exit 1
          fi

          chmod +x gradlew

      - name: Corregir compatibilidad de KSP y Kotlin Reflect
        shell: bash
        run: |
          set -euo pipefail

          TOML="gradle/libs.versions.toml"
          BUILD="app/build.gradle.kts"

          if [ ! -f "$TOML" ]; then
            echo "::error::No se encontró $TOML"
            exit 1
          fi

          if [ ! -f "$BUILD" ]; then
            echo "::error::No se encontró $BUILD"
            exit 1
          fi

          # Aplicar el ajuste DESPUÉS de extraer el ZIP, que puede
          # sobrescribir las versiones guardadas en el repositorio.
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("gradle/libs.versions.toml")
          content = path.read_text(encoding="utf-8")

          match = re.search(
              r"(?ms)^\[versions\]\s*$.*?(?=^\[|\Z)",
              content
          )

          if not match:
              raise SystemExit("No se encontró la sección [versions] en libs.versions.toml")

          section = match.group(0)
          pattern = r'(?m)^(\s*ksp\s*=\s*")[^"]+(".*)$'

          if not re.search(pattern, section):
              raise SystemExit("No se encontró la versión ksp dentro de [versions]")

          section = re.sub(pattern, r'\g<1>2.1.21-2.0.1\g<2>', section, count=1)
          content = content[:match.start()] + section + content[match.end():]
          path.write_text(content, encoding="utf-8")

          build = Path("app/build.gradle.kts")
          text = build.read_text(encoding="utf-8")

          # kotlin-reflect debe estar también en el classpath de KSP
          # si el procesador que se ejecuta necesita KClasses.
          if "ksp(libs.kotlin.reflect)" not in text:
              line = re.search(r"(?m)^([ \t]*)ksp\(libs\.bundles\.ksp\)\s*$", text)
              if line:
                  insertion = line.group(0) + "\n" + line.group(1) + "ksp(libs.kotlin.reflect)"
                  text = text[:line.start()] + insertion + text[line.end():]
                  build.write_text(text, encoding="utf-8")
              else:
                  raise SystemExit(
                      "No se encontró ksp(libs.bundles.ksp) en app/build.gradle.kts; "
                      "no se modificó automáticamente el classpath."
                  )

          print("Ajustes aplicados.")
          PY

          echo "===== Versiones efectivas ====="
          grep -nE '^(kotlin|ksp|dagger-hilt)[[:space:]]*=' "$TOML"

          echo "===== Configuración KSP ====="
          grep -nE 'ksp\(libs\.(bundles\.ksp|kotlin\.reflect)\)' "$BUILD"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Android SDK y NDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.3.13750724" >> "$GITHUB_ENV"

          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

      - name: Configurar local.properties
        shell: bash
        run: |
          set -euo pipefail

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Diagnosticar entorno y dependencias
        shell: bash
        run: |
          set -u

          echo "===== Java ====="
          java -version

          echo "===== Gradle ====="
          ./gradlew --version

          echo "===== Versiones Kotlin, KSP y Hilt ====="
          grep -nE '^(kotlin|ksp|dagger-hilt)[[:space:]]*=' gradle/libs.versions.toml || true

          echo "===== Dependencias de KSP ====="
          ./gradlew :app:dependencies \
            --configuration kspModernRelease \
            --no-daemon \
            --no-configuration-cache || true

      - name: Compilar APK Release
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean assembleRelease \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --stacktrace \
            --info

      - name: Buscar APK generado
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          find . -type f -path '*/build/outputs/apk/*/*.apk' -print

          if ! find . -type f -path '*/build/outputs/apk/release/*.apk' -print -quit | grep -q .; then
            echo "::error::La compilación terminó, pero no se encontró ningún APK Release."
            exit 1
          fi

      - name: Subir APK como artefacto
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wow-forever-android-sd695
          path: '**/build/outputs/apk/release/*.apk'
          if-no-files-found: error
          retention-days: 7
