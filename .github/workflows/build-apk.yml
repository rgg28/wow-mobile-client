name: Compilar APK WoW Android (Snapdragon 695)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el repositorio de GitHub
      uses: actions/checkout@v4

    - name: Instalar herramientas de descompresión
      run: sudo apt-get update && sudo apt-get install -y unzip

    - name: Descomprimir el proyecto wow-forever-android.zip
      run: |
        unzip -o wow-forever-android.zip -d ./project_extracted
        # Normalizar la estructura: mover los archivos a la raíz exacta del contenedor de trabajo actual
        if [ -d "./project_extracted/wow-forever-android" ]; then
          cp -r ./project_extracted/wow-forever-android/* ./
        else
          cp -r ./project_extracted/* ./
        fi
        rm -rf project_extracted wow-forever-android.zip

    - name: Remover permanentemente la referencia de Frame Generation
      run: |
        TARGET_FILE="app/src/main/java/app/gamenative/ui/screen/xserver/XServerScreen.kt"
        if [ -f "$TARGET_FILE" ]; then
          echo "Limpiando referencias residuales en XServerScreen.kt..."
          # Elimina por completo cualquier línea que intente invocar setFrameGenerationArmed
          sed -i '/setFrameGenerationArmed/d' "$TARGET_FILE"
        else
          echo "Advertencia: No se encontró el archivo en $TARGET_FILE para remover la línea."
        fi

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Configurar Variables de Entorno del Android SDK
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        # Se unifica el PATH apuntando a la versión 27 que exige tu script de Gradle
        echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.3.13750724" >> $GITHUB_ENV
        echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

    - name: Aceptar Licencias de Android e Instalar Herramientas Correctas
      run: |
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        # SE CORRIGE AQUÍ: Se le ordena descargar la versión 27.3.13750724 del NDK de forma explícita
        /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.3.13750724" "cmake;3.22.1"

    - name: Inyectar archivos de propiedades en todas las rutas posibles
      run: |
        # Escribir local.properties en la raíz apuntando de forma consistente al NDK 27
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
        echo "ndk.dir=/usr/local/lib/android/sdk/ndk/27.3.13750724" >> local.properties
        
        # Duplicar el archivo de propiedades dentro de la carpeta /app por si el script build.gradle.kts realiza una búsqueda relativa
        if [ -d "app" ]; then
          cp local.properties app/local.properties
        fi

    - name: Conceder permisos de ejecución a Gradle
      run: chmod +x gradlew
      continue-on-error: true

    - name: Compilar APK en modo Release con optimizaciones nativas
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew clean assembleRelease --no-daemon --no-build-cache
        else
          gradle clean assembleRelease --no-daemon --no-build-cache
        fi

    - name: Subir el archivo APK compilado como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: wow-forever-android-sd695
        path: |
          **/build/outputs/apk/release/*.apk
          app/build/outputs/apk/release/*.apk
