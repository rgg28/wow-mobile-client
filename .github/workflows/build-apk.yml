name: Compilar APK WoW Android (Snapdragon 695)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el repositorio de GitHub
      uses: actions/checkout@v4

    - name: Instalar herramientas de descompresión
      run: sudo apt-get update && sudo apt-get install -y unzip

    - name: Descomprimir el proyecto wow-forever-android.zip
      run: |
        unzip -o wow-forever-android.zip -d ./project_extracted
        if [ -d "./project_extracted/wow-forever-android" ]; then
          mv ./project_extracted/wow-forever-android/* ./
        else
          mv ./project_extracted/* ./
        fi
        rm -rf project_extracted wow-forever-android.zip

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Configurar Variables de Entorno del Android SDK
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/25.1.8937393" >> $GITHUB_ENV
        echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

    - name: Aceptar Licencias de Android e Instalar Herramientas Correctas
      run: |
        # Usamos el sdkmanager nativo del sistema apuntando a la ruta más reciente
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        
        # Instalamos el NDK y CMake sin la acción de terceros rota
        /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

    - name: Conceder permisos de ejecución a Gradle
      run: chmod +x gradlew
      continue-on-error: true

    - name: Compilar APK en modo Release con optimizaciones nativas
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleRelease --no-daemon
        else
          gradle assembleRelease --no-daemon
        fi

    - name: Subir el archivo APK compilado como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: wow-forever-android-sd695
        path: app/build/outputs/apk/release/*.apk
