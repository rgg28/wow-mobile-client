name: Build WoW Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_PLATFORM: android-35
      ANDROID_BUILD_TOOLS: 35.0.0
      ANDROID_CMAKE_VERSION: 3.31.6
      ANDROID_NDK_VERSION: 28.2.13676358
      JAVA_VERSION: "17"
      GRADLE_VERSION: "8.9"

    steps:

      # ==========================================================
      # CHECKOUT MAIN PROJECT
      # ==========================================================

      - name: Checkout wow-mobile-client
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ==========================================================
      # CHECKOUT WOWEE SEPARATELY
      # ==========================================================

      - name: Checkout WoWee
        uses: actions/checkout@v4
        with:
          repository: Kelsidavis/WoWee
          path: wowee
          submodules: recursive
          fetch-depth: 0

      # ==========================================================
      # VERIFY REPOSITORIES
      # ==========================================================

      - name: Verify repositories
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "REPOSITORIES"
          echo "=============================================="

          echo ""
          echo "Workspace:"
          pwd

          echo ""
          echo "Contenido:"
          ls -la

          echo ""
          echo "Verificando wow-mobile-client..."

          test -d app
          test -d app/src
          test -d app/src/main

          echo "OK: app"

          echo ""
          echo "Verificando WoWee..."

          test -d wowee
          test -d wowee/include
          test -d wowee/src
          test -d wowee/extern

          echo "OK: wowee"

      # ==========================================================
      # JAVA 17
      # ==========================================================

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ==========================================================
      # ANDROID SDK
      # ==========================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID SDK"
          echo "=============================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "${ANDROID_HOME}/cmdline-tools" \
                -type f \
                -name sdkmanager \
                | sort \
                | tail -1
            )"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager no encontrado."
            exit 1
          fi

          echo ""
          echo "sdkmanager:"
          echo "$SDKMANAGER"

          echo ""
          echo "Aceptando licencias..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo ""
          echo "Instalando Android SDK..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmake;${ANDROID_CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      # ==========================================================
      # VERIFY ANDROID TOOLCHAIN
      # ==========================================================

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID TOOLCHAIN"
          echo "=============================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Platform:"

          test -d "${ANDROID_HOME}/platforms/${ANDROID_PLATFORM}"

          echo "OK: ${ANDROID_PLATFORM}"

          echo ""
          echo "Build Tools:"

          test -d "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}"

          echo "OK: ${ANDROID_BUILD_TOOLS}"

          echo ""
          echo "CMake:"

          test -d "${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}"

          "${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}/bin/cmake" \
            --version

          echo ""
          echo "NDK:"

          test -d "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"

          cat \
            "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/source.properties"

          echo ""
          echo "ADB:"

          "${ANDROID_HOME}/platform-tools/adb" version

      # ==========================================================
      # SDL3
      # ==========================================================

      - name: Checkout SDL3
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          path: sdl3
          fetch-depth: 1

      # ==========================================================
      # GLM
      # ==========================================================

      - name: Checkout GLM
        uses: actions/checkout@v4
        with:
          repository: g-truc/glm
          path: glm-src
          fetch-depth: 1

      # ==========================================================
      # CONFIGURE GLM
      # ==========================================================

      - name: Configure GLM
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "GLM"
          echo "=============================================="

          GLM_PATH="${GITHUB_WORKSPACE}/glm-src"

          if [ ! -d "$GLM_PATH/glm" ]; then
            echo "ERROR: no se encontro la carpeta glm:"
            echo "$GLM_PATH/glm"
            exit 1
          fi

          echo "GLM:"
          echo "$GLM_PATH"

          echo "GLM_INCLUDE_DIR=$GLM_PATH" >> "$GITHUB_ENV"

      # ==========================================================
      # OPENSSL
      # ==========================================================

      - name: Extract and configure OpenSSL
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "OPENSSL"
          echo "=============================================="

          echo ""
          echo "Buscando openssl.zip..."

          if [ ! -f openssl.zip ]; then
            echo "ERROR: openssl.zip no existe."
            exit 1
          fi

          echo "OK: openssl.zip"

          rm -rf openssl-android

          mkdir -p openssl-android

          unzip -q openssl.zip -d openssl-android

          echo ""
          echo "Buscando openssl/bn.h..."

          BN_HEADER="$(
            find openssl-android \
              -type f \
              -path '*/openssl/bn.h' \
              -print \
              -quit
          )"

          if [ -z "$BN_HEADER" ]; then
            echo "ERROR: no se encontró openssl/bn.h."

            echo ""
            echo "Archivos encontrados:"
            find openssl-android \
              -type f \
              | sort \
              | head -300

            exit 1
          fi

          echo ""
          echo "bn.h:"
          echo "$BN_HEADER"

          OPENSSL_INCLUDE_DIR="$(
            dirname "$(dirname "$BN_HEADER")"
          )"

          if [ ! -f "${OPENSSL_INCLUDE_DIR}/openssl/bn.h" ]; then
            echo "ERROR: OPENSSL_INCLUDE_DIR inválido:"
            echo "$OPENSSL_INCLUDE_DIR"
            exit 1
          fi

          echo ""
          echo "OPENSSL_INCLUDE_DIR:"
          echo "$OPENSSL_INCLUDE_DIR"

          # ------------------------------------------------------
          # LIBCRYPTO STATIC
          # ------------------------------------------------------

          echo ""
          echo "Buscando libcrypto.a..."

          CRYPTO_LIB="$(
            find openssl-android \
              -type f \
              -name 'libcrypto.a' \
              -print \
              -quit
          )"

          if [ -z "$CRYPTO_LIB" ]; then
            echo "ERROR: libcrypto.a no encontrado."

            echo ""
            echo "Librerías .a encontradas:"

            find openssl-android \
              -type f \
              -name '*.a' \
              -print \
              | sort

            exit 1
          fi

          echo "libcrypto.a:"
          echo "$CRYPTO_LIB"

          # ------------------------------------------------------
          # LIBSSL STATIC
          # ------------------------------------------------------

          echo ""
          echo "Buscando libssl.a..."

          SSL_LIB="$(
            find openssl-android \
              -type f \
              -name 'libssl.a' \
              -print \
              -quit
          )"

          if [ -z "$SSL_LIB" ]; then
            echo "ERROR: libssl.a no encontrado."

            echo ""
            echo "Librerías .a encontradas:"

            find openssl-android \
              -type f \
              -name '*.a' \
              -print \
              | sort

            exit 1
          fi

          echo "libssl.a:"
          echo "$SSL_LIB"

          # ------------------------------------------------------
          # ABSOLUTE PATHS
          # ------------------------------------------------------

          CRYPTO_ABS="${GITHUB_WORKSPACE}/${CRYPTO_LIB}"
          SSL_ABS="${GITHUB_WORKSPACE}/${SSL_LIB}"

          echo ""
          echo "Verificando archivos..."

          test -f "${OPENSSL_INCLUDE_DIR}/openssl/bn.h"
          test -f "${CRYPTO_ABS}"
          test -f "${SSL_ABS}"

          echo ""
          echo "=============================================="
          echo "OPENSSL CONFIGURADO"
          echo "=============================================="

          echo ""
          echo "Include:"
          echo "$OPENSSL_INCLUDE_DIR"

          echo ""
          echo "Crypto:"
          echo "$CRYPTO_ABS"

          echo ""
          echo "SSL:"
          echo "$SSL_ABS"

          echo ""
          echo "Tamaños:"

          ls -lh \
            "${OPENSSL_INCLUDE_DIR}/openssl/bn.h" \
            "${CRYPTO_ABS}" \
            "${SSL_ABS}"

          # ------------------------------------------------------
          # EXPORT
          # ------------------------------------------------------

          {
            echo "OPENSSL_INCLUDE_DIR=${OPENSSL_INCLUDE_DIR}"
            echo "OPENSSL_CRYPTO_LIBRARY=${CRYPTO_ABS}"
            echo "OPENSSL_SSL_LIBRARY=${SSL_ABS}"
          } >> "$GITHUB_ENV"

      # ==========================================================
      # VERIFY OPENSSL
      # ==========================================================

      - name: Verify OpenSSL configuration
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY OPENSSL"
          echo "=============================================="

          echo ""
          echo "OPENSSL_INCLUDE_DIR:"
          echo "$OPENSSL_INCLUDE_DIR"

          echo ""
          echo "OPENSSL_CRYPTO_LIBRARY:"
          echo "$OPENSSL_CRYPTO_LIBRARY"

          echo ""
          echo "OPENSSL_SSL_LIBRARY:"
          echo "$OPENSSL_SSL_LIBRARY"

          echo ""
          echo "Archivos:"

          test -f "${OPENSSL_INCLUDE_DIR}/openssl/bn.h"
          test -f "${OPENSSL_CRYPTO_LIBRARY}"
          test -f "${OPENSSL_SSL_LIBRARY}"

          ls -lh \
            "${OPENSSL_INCLUDE_DIR}/openssl/bn.h" \
            "${OPENSSL_CRYPTO_LIBRARY}" \
            "${OPENSSL_SSL_LIBRARY}"

          echo ""
          echo "OPENSSL OK"

      # ==========================================================
      # VERIFY WOWEE
      # ==========================================================

      - name: Verify WoWee sources
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "WOWEE SOURCES"
          echo "=============================================="

          REQUIRED_FILES=(

            "wowee/include/core/application.hpp"
            "wowee/include/network/world_socket.hpp"
            "wowee/include/auth/auth_handler.hpp"

            "wowee/src/auth/auth_handler.cpp"
            "wowee/src/auth/auth_opcodes.cpp"
            "wowee/src/auth/auth_packets.cpp"
            "wowee/src/auth/big_num.cpp"
            "wowee/src/auth/crypto.cpp"
            "wowee/src/auth/srp.cpp"
            "wowee/src/auth/vanilla_crypt.cpp"

            "wowee/src/network/packet.cpp"
            "wowee/src/network/socket.cpp"
            "wowee/src/network/tcp_socket.cpp"
            "wowee/src/network/world_socket.cpp"

            "wowee/src/game/opcodes.cpp"
            "wowee/src/game/opcode_table.cpp"
            "wowee/src/game/game_handler_packets.cpp"

            "wowee/src/core/window.cpp"
            "wowee/src/core/application.cpp"
            "wowee/src/core/app_clock.cpp"
            "wowee/src/core/input.cpp"
            "wowee/src/core/logger.cpp"

            "wowee/src/rendering/renderer.cpp"
            "wowee/src/rendering/render_graph.cpp"
            "wowee/src/rendering/vk_context.cpp"
            "wowee/src/rendering/vk_pipeline.cpp"
            "wowee/src/rendering/vk_buffer.cpp"
            "wowee/src/rendering/vk_shader.cpp"
            "wowee/src/rendering/vk_texture.cpp"
            "wowee/src/rendering/vk_utils.cpp"

            "wowee/extern/imgui/imgui.cpp"
            "wowee/extern/imgui/imgui_draw.cpp"
            "wowee/extern/imgui/imgui_tables.cpp"
            "wowee/extern/imgui/imgui_widgets.cpp"

            "wowee/extern/imgui/backends/imgui_impl_sdl3.cpp"
            "wowee/extern/imgui/backends/imgui_impl_vulkan.cpp"

            "wowee/extern/vk-bootstrap/src/VkBootstrap.cpp"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do

            if [ ! -f "$FILE" ]; then
              echo ""
              echo "ERROR: falta:"
              echo "$FILE"
              exit 1
            fi

            echo "OK: $FILE"

          done

          echo ""
          echo "WoWee sources OK"

      # ==========================================================
      # VERIFY ANDROID CMAKE
      # ==========================================================

      - name: Verify Android CMake
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID CMAKE"
          echo "=============================================="

          CMAKE_FILE="app/src/main/CMakeLists.txt"

          echo ""
          echo "Directorio actual:"
          pwd

          echo ""
          echo "Archivo CMake:"

          if [ ! -f "$CMAKE_FILE" ]; then
            echo "ERROR: no existe:"
            echo "$CMAKE_FILE"
            exit 1
          fi

          ls -lh "$CMAKE_FILE"

          # ------------------------------------------------------
          # ENVIRONMENT
          # ------------------------------------------------------

          echo ""
          echo "OpenSSL desde entorno:"

          echo "OPENSSL_INCLUDE_DIR=$OPENSSL_INCLUDE_DIR"
          echo "OPENSSL_CRYPTO_LIBRARY=$OPENSSL_CRYPTO_LIBRARY"
          echo "OPENSSL_SSL_LIBRARY=$OPENSSL_SSL_LIBRARY"

          echo ""
          echo "GLM:"
          echo "GLM_INCLUDE_DIR=$GLM_INCLUDE_DIR"

          # ------------------------------------------------------
          # REAL FILES
          # ------------------------------------------------------

          echo ""
          echo "Verificando archivos reales de WoWee:"

          REQUIRED_FILES=(

            "wowee/src/auth/big_num.cpp"
            "wowee/src/auth/auth_handler.cpp"
            "wowee/src/network/world_socket.cpp"
            "wowee/src/core/application.cpp"
            "wowee/src/rendering/renderer.cpp"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do

            if [ ! -f "$FILE" ]; then
              echo ""
              echo "ERROR: no existe:"
              echo "$FILE"

              echo ""
              echo "Directorio:"
              dirname "$FILE"

              exit 1
            fi

            echo "OK: $FILE"

          done

          # ------------------------------------------------------
          # CMAKE REFERENCES
          # ------------------------------------------------------

          echo ""
          echo "Verificando referencias dentro de CMakeLists.txt:"

          REQUIRED_REFERENCES=(

            "auth/big_num.cpp"
            "auth/auth_handler.cpp"
            "network/world_socket.cpp"
            "core/application.cpp"
            "rendering/renderer.cpp"
          )

          for REF in "${REQUIRED_REFERENCES[@]}"; do

            if ! grep -n "$REF" "$CMAKE_FILE"; then
              echo ""
              echo "ERROR: CMakeLists.txt no contiene:"
              echo "$REF"
              exit 1
            fi

          done

          # ------------------------------------------------------
          # OPENSSL REFERENCES
          # ------------------------------------------------------

          echo ""
          echo "Verificando referencias OpenSSL:"

          if ! grep -n "OPENSSL_INCLUDE_DIR" "$CMAKE_FILE"; then
            echo "ERROR: falta OPENSSL_INCLUDE_DIR"
            exit 1
          fi

          if ! grep -n "OPENSSL_CRYPTO_LIBRARY" "$CMAKE_FILE"; then
            echo "ERROR: falta OPENSSL_CRYPTO_LIBRARY"
            exit 1
          fi

          if ! grep -n "OPENSSL_SSL_LIBRARY" "$CMAKE_FILE"; then
            echo "ERROR: falta OPENSSL_SSL_LIBRARY"
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "ANDROID CMAKE OK"
          echo "=============================================="

      # ==========================================================
      # VALIDATE INTEGRATION
      # ==========================================================

      - name: Validate WoW integration
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "WOW INTEGRATION"
          echo "=============================================="

          FILE="app/src/main/wow_integration.cpp"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: falta:"
            echo "$FILE"
            exit 1
          fi

          if grep -q 'g_WoWwowee' "$FILE"; then
            echo "ERROR: g_WoWwowee encontrado."
            exit 1
          fi

          if grep -q 'wowee::core::wowee::core' "$FILE"; then
            echo "ERROR: namespace wowee::core duplicado."
            exit 1
          fi

          if grep -q 'wowee::network::wowee::network' "$FILE"; then
            echo "ERROR: namespace wowee::network duplicado."
            exit 1
          fi

          echo "wow_integration.cpp OK"

      # ==========================================================
      # INSTALL GRADLE
      # ==========================================================

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "INSTALL GRADLE"
          echo "=============================================="

          GRADLE_ROOT="${RUNNER_TEMP}/gradle-${GRADLE_VERSION}"

          if [ ! -x "${GRADLE_ROOT}/bin/gradle" ]; then

            cd "${RUNNER_TEMP}"

            wget -q \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -O gradle.zip

            rm -rf "$GRADLE_ROOT"

            unzip -q \
              gradle.zip \
              -d "${RUNNER_TEMP}"

          fi

          echo "${GRADLE_ROOT}/bin" >> "$GITHUB_PATH"

          "${GRADLE_ROOT}/bin/gradle" --version

      # ==========================================================
      # VERIFY GRADLE PROJECT
      # ==========================================================

      - name: Verify Gradle project
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "GRADLE PROJECT"
          echo "=============================================="

          if [ -f settings.gradle ]; then

            echo "settings.gradle encontrado."

          elif [ -f settings.gradle.kts ]; then

            echo "settings.gradle.kts encontrado."

          else

            echo "ERROR: no existe settings.gradle ni settings.gradle.kts."
            exit 1

          fi

          if [ -f app/build.gradle ]; then

            echo "app/build.gradle encontrado."

          elif [ -f app/build.gradle.kts ]; then

            echo "app/build.gradle.kts encontrado."

          else

            echo "ERROR: no existe app/build.gradle ni app/build.gradle.kts."
            exit 1

          fi

          echo ""
          gradle --version

      # ==========================================================
      # CLEAN
      # ==========================================================

      - name: Clean native build
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "CLEAN"
          echo "=============================================="

          rm -rf app/.cxx
          rm -rf app/build

          gradle clean --no-daemon

      # ==========================================================
      # SHOW BUILD CONFIGURATION
      # ==========================================================

      - name: Show build configuration
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "BUILD CONFIGURATION"
          echo "=============================================="

          echo ""
          echo "----- app/build.gradle -----"

          if [ -f app/build.gradle ]; then
            sed -n '1,360p' app/build.gradle
          else
            sed -n '1,360p' app/build.gradle.kts
          fi

          echo ""
          echo "----- CMakeLists.txt -----"

          sed -n '1,500p' app/src/main/CMakeLists.txt

          echo ""
          echo "----- OPENSSL -----"

          echo "OPENSSL_INCLUDE_DIR=$OPENSSL_INCLUDE_DIR"
          echo "OPENSSL_CRYPTO_LIBRARY=$OPENSSL_CRYPTO_LIBRARY"
          echo "OPENSSL_SSL_LIBRARY=$OPENSSL_SSL_LIBRARY"

      # ==========================================================
      # BUILD APK
      # ==========================================================

      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "BUILD APK"
          echo "=============================================="

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # ==========================================================
      # FIND APK
      # ==========================================================

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FIND APK"
          echo "=============================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK="$(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: no se genero ningun APK."
            exit 1
          fi

          echo ""
          echo "APK generado:"
          echo "$APK"

      # ==========================================================
      # UPLOAD APK
      # ==========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wow-mobile-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
