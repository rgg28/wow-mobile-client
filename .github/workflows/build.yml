name: Build WoW Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Nuestro proyecto
      # ============================================================

      - name: Checkout WoW Mobile
        uses: actions/checkout@v4


      # ============================================================
      # 2. WoWee + TODOS sus submódulos
      # ============================================================

      - name: Checkout WoWee
        uses: actions/checkout@v4
        with:
          repository: Kelsidavis/WoWee
          path: wowee
          submodules: recursive
          fetch-depth: 0


      # ============================================================
      # 3. Java 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 4. Configurar Gradle (Solución al error del gradlew)
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ============================================================
      # 5. Localizar Android SDK
      # ============================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -d "$ANDROID_HOME/cmdline-tools/16.0/bin" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              | head -1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager no encontrado"
            find "$ANDROID_HOME" -maxdepth 5 \
              -type f \
              -name sdkmanager \
              -print || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          echo "sdkmanager encontrado:"
          "$SDKMANAGER" --version


      # ============================================================
      # 6. Aceptar licencias
      # ============================================================

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true


      # ============================================================
      # 7. Instalar herramientas Android
      # ============================================================

      - name: Install Android toolchain
        shell: bash
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.31.6" \
            "ndk;28.2.13676358"


      # ============================================================
      # 8. Verificar toolchain
      # ============================================================

      - name: Verify Android toolchain
        shell: bash
        run: |
          echo "=========================================="
          echo "ANDROID_HOME"
          echo "$ANDROID_HOME"
          echo "=========================================="

          echo "NDK:"
          ls -la "$ANDROID_HOME/ndk"

          echo "CMake:"
          ls -la "$ANDROID_HOME/cmake"

          echo "Build Tools:"
          ls -la "$ANDROID_HOME/build-tools"

          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          test -d "$ANDROID_HOME/cmake/3.31.6"


      # ============================================================
      # 9. Preparar WoWee
      # ============================================================

      - name: Prepare WoWee
        working-directory: wowee
        shell: bash
        run: |
          git submodule update --init --recursive

          echo "WoWee commit:"
          git rev-parse HEAD

          echo "Submodules:"
          git submodule status --recursive


      # ============================================================
      # 10. Clonar rama oficial de SDL3 para Android
      # ============================================================

      - name: Checkout SDL3 official
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: main
          path: sdl3


      # ============================================================
      # 11. Instalar OpenSSL local (arm64-v8a v4.0.3)
      # ============================================================

      - name: Unzip Local OpenSSL
        shell: bash
        run: |
          mkdir -p ${{ github.workspace }}/openssl-android
          unzip -q "./openssl.zip" -d ${{ github.workspace }}/openssl-android
          
          echo "Contenido verificado en el subdirectorio openssl:"
          ls -la ${{ github.workspace }}/openssl-android/openssl


      # ============================================================
      # 12. Limpiar (Usando 'gradle' global)
      # ============================================================

      - name: Clean
        shell: bash
        run: |
          gradle clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 13. Modificar build.gradle e Inyectar Bloque Nativo SDL3/GLM
      # ============================================================

      - name: Build Debug APK
        shell: bash
        run: |
          # 1. Definimos los argumentos nativos de OpenSSL absolutos para CMake
          NEW_CMAKE_ARGS="arguments '-DANDROID_STL=c++_shared', '-DOPENSSL_ROOT_DIR=${{ github.workspace }}/openssl-android/openssl', '-DOPENSSL_INCLUDE_DIR=${{ github.workspace }}/openssl-android/openssl/include', '-DOPENSSL_CRYPTO_LIBRARY=${{ github.workspace }}/openssl-android/openssl/lib/libcrypto.a', '-DOPENSSL_SSL_LIBRARY=${{ github.workspace }}/openssl-android/openssl/lib/libssl.a', '-DOPENSSL_USE_STATIC_LIBS=TRUE'"
          
          # 2. Inyectamos los argumentos en el archivo build.gradle
          sed -i "s|arguments \"-DANDROID_STL=c++_shared\"|$NEW_CMAKE_ARGS|g" app/build.gradle
          
          # 3. Resolvemos la ubicación real de GLM dentro de WoWee de forma segura
          GLM_ROOT="${{ github.workspace }}/wowee/extern/glm"
          if [ ! -d "$GLM_ROOT" ]; then
            GLM_ROOT="${{ github.workspace }}/wowee/third_party/glm"
          fi
          
          # 4. PARCHE LIMPIO CMAKElISTS (Inyección no destructiva)
          # Creamos un bloque de configuración temporal que añade el código fuente de SDL3
          # y los directorios globales de cabeceras necesarios ANTES de que se procese el resto del archivo.
          cat << 'EOF' > temp_patch.txt
          add_subdirectory("/home/runner/work/wow-mobile-client/wow-mobile-client/sdl3" sdl3_build)
          include_directories("/home/runner/work/wow-mobile-client/wow-mobile-client/sdl3/include")
          EOF
          
          # Inyectamos la ruta de GLM si existe
          if [ -d "$GLM_ROOT" ]; then
            echo "include_directories(\"${GLM_ROOT}\")" >> temp_patch.txt
          fi
          
          # Unimos el parche al inicio de tu archivo original sin alterar ninguna directiva inferior
          cat app/src/main/CMakeLists.txt >> temp_patch.txt
          mv temp_patch.txt app/src/main/CMakeLists.txt
          
          # 5. Verificación visual rápida del archivo resultante en los logs
          echo "=== Contenido superior del CMakeLists parcheado ==="
          head -n 20 app/src/main/CMakeLists.txt
          
          # 6. Compilación final
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info


      # ============================================================
      # 14. Buscar APK
      # ============================================================

      - name: Locate APK
        shell: bash
        run: |
          echo "APK generado:"
          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # ============================================================
      # 15. Descargar APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wowmobile-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
