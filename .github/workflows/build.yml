name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Base
        uses: android-actions/setup-android@v3

      - name: Instalar Android NDK de forma dedicada
        run: |
          set -euo pipefail
          # Aceptar licencias e instalar la versión estable del NDK que requiere Rust
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;25.2.9519653"

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Instalar dependencias del sistema
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            clang \
            lld \
            file \
            rsync

      - name: Extraer y acomodar fuentes de Benilla
        run: |
          set -euo pipefail

          if [ -f benilla.zip ]; then
            mkdir -p /tmp/benilla-source
            unzip -q benilla.zip -d /tmp/benilla-source

            # Buscar el Cargo.toml principal dentro de benilla-0.2.0
            ROOT="$(find /tmp/benilla-source -name Cargo.toml -type f -print -quit)"

            if [ -z "$ROOT" ]; then
              echo "::error::Cargo.toml not found in benilla.zip"
              exit 1
            fi

            SOURCE_DIR="$(dirname "$ROOT")"
            
            # Transferir de manera limpia el contenido a la raíz de trabajo
            rsync -a "$SOURCE_DIR/" .
          fi

          # Validar que todo esté en su lugar de forma correcta
          test -f Cargo.toml
          test -f crates/benilla-app/Cargo.toml
          test -f crates/benilla-app/src/textinput/clipboard.rs

      - name: Configurar Linkers de Android para Cargo
        run: |
          mkdir -p .cargo
          
          # Encontrar la ruta del compilador del NDK instalado
          NDK_TOOLCHAIN="$ANDROID_HOME/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin"
          
          cat << EOF > .cargo/config.toml
          [target.aarch64-linux-android]
          linker = "$NDK_TOOLCHAIN/aarch64-linux-android31-clang"

          [target.armv7-linux-androideabi]
          linker = "$NDK_TOOLCHAIN/armv7-linux-androideabi31-clang"

          [target.x86_64-linux-android]
          linker = "$NDK_TOOLCHAIN/x86_64-linux-android31-clang"

          [target.i686-linux-android]
          linker = "$NDK_TOOLCHAIN/i686-linux-android31-clang"
          EOF

      - name: Compilar proyecto (Rust / Cargo)
        run: |
          # Compilación orientada a la arquitectura móvil principal de Android
          cargo build --release --target aarch64-linux-android

      - name: Subir artefactos compilados
        uses: actions/upload-artifact@v4
        with:
          name: android-build-artifacts
          path: target/aarch64-linux-android/release/
