name: Compilar WoW Android

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:

  build:
    name: Build WoW Android
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. DESCARGAR REPOSITORIO
      # ============================================================

      - name: Checkout repository con Git LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Verificar Git LFS
        shell: bash
        run: |
          set -e

          echo "=== Git LFS ==="
          git lfs version
          git lfs ls-files

          echo "=== Ejecutando git lfs pull ==="
          git lfs pull

      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verificar Java
        shell: bash
        run: |
          java -version
          keytool -help >/dev/null

      # ============================================================
      # 3. .NET 8
      # ============================================================

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verificar .NET
        shell: bash
        run: |
          dotnet --info

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================

      - name: Verificar Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME"

          echo "=== SDK Manager ==="
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true

      - name: Instalar componentes Android necesarios
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verificar Android Build Tools
        shell: bash
        run: |
          set -e

          echo "=== Build Tools ==="
          ls -la "$ANDROID_HOME/build-tools/34.0.0"

          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/34.0.0/zipalign"

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" --version

      # ============================================================
      # 5. VERIFICAR GODOT
      # ============================================================

      - name: Verificar Godot C# 4.2.1
        shell: bash
        run: |
          set -e

          GODOT="$GITHUB_WORKSPACE/Godot_v4.2.1-stable_mono_linux.x86_64"

          echo "=== Verificando Godot ==="

          test -f "$GODOT"

          echo "Archivo:"
          file "$GODOT"

          echo "Primeros bytes:"
          xxd -l 4 "$GODOT"

          echo "=== Comprobando que no sea un puntero Git LFS ==="

          if grep -q "version https://git-lfs.github.com/spec/v1" "$GODOT" 2>/dev/null; then
            echo "ERROR: Godot sigue siendo un puntero Git LFS."
            exit 1
          fi

          echo "Godot no es un puntero LFS."

          chmod +x "$GODOT"

          echo "=== Versión Godot ==="
          "$GODOT" --version

      # ============================================================
      # 6. VERIFICAR GODOTSHARP
      # ============================================================

      - name: Verificar GodotSharp
        shell: bash
        run: |
          set -e

          echo "=== GodotSharp ==="

          test -d "$GITHUB_WORKSPACE/GodotSharp"

          find "$GITHUB_WORKSPACE/GodotSharp" \
            -maxdepth 3 \
            -type f \
            | head -100

      # ============================================================
      # 7. INSTALAR EXPORT TEMPLATES GODOT
      # ============================================================

      - name: Instalar templates Godot 4.2.1 C#
        shell: bash
        run: |
          set -e

          GODOT_TPZ="$GITHUB_WORKSPACE/Godot_v4.2.1-stable_mono_export_templates.tpz"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.2.1.stable.mono"

          echo "=== Verificando template ==="

          test -f "$GODOT_TPZ"

          echo "Template:"
          ls -lh "$GODOT_TPZ"

          echo "=== Preparando directorio ==="

          rm -rf "$TEMPLATE_DIR"
          mkdir -p "$TEMPLATE_DIR"

          echo "=== Extrayendo template ==="

          unzip -q "$GODOT_TPZ" -d "$TEMPLATE_DIR"

          echo "=== Contenido extraído ==="

          find "$TEMPLATE_DIR" -maxdepth 3 -type f | sort

          # Algunas versiones del TPZ incluyen una carpeta templates/.
          if [ -d "$TEMPLATE_DIR/templates" ]; then
            cp -a "$TEMPLATE_DIR/templates/." "$TEMPLATE_DIR/"
            rm -rf "$TEMPLATE_DIR/templates"
          fi

          echo "=== Verificando APK templates ==="

          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

          ls -lh \
            "$TEMPLATE_DIR/android_debug.apk" \
            "$TEMPLATE_DIR/android_release.apk"

      # ============================================================
      # 8. VERIFICAR PROYECTO
      # ============================================================

      - name: Verificar archivos del proyecto
        shell: bash
        run: |
          set -e

          echo "=== Archivos principales ==="

          test -f "project.godot"
          test -f "WoW Android Client.csproj"

          echo "project.godot:"
          sed -n '1,100p' project.godot

          echo
          echo "C# project:"
          sed -n '1,160p' "WoW Android Client.csproj"

          echo
          echo "=== Export presets ==="

          if [ -f "export_presets.cfg" ]; then
            sed -n '1,240p' export_presets.cfg
          else
            echo "ERROR: Falta export_presets.cfg"
            exit 1
          fi

      # ============================================================
      # 9. RESTORE .NET
      # ============================================================

      - name: Restaurar proyecto C#
        shell: bash
        run: |
          set -e

          dotnet restore "WoW Android Client.csproj"

      # ============================================================
      # 10. BUILD DEBUG
      # ============================================================

      - name: Compilar C# Debug
        shell: bash
        run: |
          set -e

          dotnet build \
            "WoW Android Client.csproj" \
            -c Debug \
            --no-restore

      # ============================================================
      # 11. BUILD RELEASE
      # ============================================================

      - name: Compilar C# Release
        shell: bash
        run: |
          set -e

          dotnet build \
            "WoW Android Client.csproj" \
            -c Release \
            --no-restore

      # ============================================================
      # 12. VERIFICAR DLL
      # ============================================================

      - name: Verificar assemblies C#
        shell: bash
        run: |
          set -e

          echo "=== Debug DLL ==="

          test -f ".godot/mono/temp/bin/Debug/WoW Android Client.dll"

          ls -lh \
            ".godot/mono/temp/bin/Debug/WoW Android Client.dll"

          echo
          echo "=== Release DLL ==="

          test -f ".godot/mono/temp/bin/Release/WoW Android Client.dll"

          ls -lh \
            ".godot/mono/temp/bin/Release/WoW Android Client.dll"

      # ============================================================
      # 13. BUILD SOLUTIONS GODOT
      # ============================================================

      - name: Preparar proyecto C# en Godot
        shell: bash
        run: |
          set -e

          GODOT="$GITHUB_WORKSPACE/Godot_v4.2.1-stable_mono_linux.x86_64"

          "$GODOT" \
            --build-solutions \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --quit \
            --verbose

      # ============================================================
      # 14. CREAR DIRECTORIO DE CLAVES
      # ============================================================

      - name: Preparar directorio de firma
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/.keys"
          chmod 700 "$GITHUB_WORKSPACE/.keys"

      # ============================================================
      # 15. CREAR DEBUG KEYSTORE
      # ============================================================

      - name: Crear debug.keystore
        shell: bash
        run: |
          set -e

          DEBUG_KEYSTORE="$GITHUB_WORKSPACE/.keys/debug.keystore"

          rm -f "$DEBUG_KEYSTORE"

          keytool \
            -genkeypair \
            -v \
            -keystore "$DEBUG_KEYSTORE" \
            -storetype PKCS12 \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 9999 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          chmod 600 "$DEBUG_KEYSTORE"

          echo "=== Debug keystore creado ==="

          keytool \
            -list \
            -keystore "$DEBUG_KEYSTORE" \
            -storepass android

      # ============================================================
      # 16. CREAR / RESTAURAR RELEASE KEYSTORE
      #
      # Si SIGNING_KEY existe:
      #   se restaura la clave permanente.
      #
      # Si SIGNING_KEY NO existe:
      #   se genera una nueva.
      #
      # ============================================================

      - name: Preparar signingKey.jks
        id: signing
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -e

          RELEASE_KEYSTORE="$GITHUB_WORKSPACE/.keys/signingKey.jks"

          echo "=== Preparando release keystore ==="

          if [ -n "$SIGNING_KEY" ]; then

            echo "SIGNING_KEY encontrado."
            echo "Restaurando signingKey.jks desde Base64..."

            printf '%s' "$SIGNING_KEY" | base64 --decode > "$RELEASE_KEYSTORE"

            test -s "$RELEASE_KEYSTORE"

            echo "created=false" >> "$GITHUB_OUTPUT"

            echo "Release keystore restaurado correctamente."

          else

            echo "SIGNING_KEY no existe."
            echo "Generando signingKey.jks por primera vez..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$RELEASE_KEYSTORE" \
              -storetype JKS \
              -alias "$SIGNING_KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$SIGNING_STORE_PASSWORD" \
              -keypass "$SIGNING_KEY_PASSWORD" \
              -dname "CN=WoW Android,O=WoW,C=AR"

            chmod 600 "$RELEASE_KEYSTORE"

            echo "created=true" >> "$GITHUB_OUTPUT"

            echo "Release keystore nuevo creado."

          fi

          echo
          echo "=== Verificando release keystore ==="

          keytool \
            -list \
            -keystore "$RELEASE_KEYSTORE" \
            -storepass "$SIGNING_STORE_PASSWORD"

      # ============================================================
      # 17. EXPORT DEBUG APK
      # ============================================================

      - name: Exportar APK Debug
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.keys/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/.keys/signingKey.jks
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.SIGNING_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

        run: |
          set -e

          GODOT="$GITHUB_WORKSPACE/Godot_v4.2.1-stable_mono_linux.x86_64"

          mkdir -p "$GITHUB_WORKSPACE/build"

          rm -f "$GITHUB_WORKSPACE/build/WoW-debug.apk"

          echo "=== Exportando Debug ==="

          "$GODOT" \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-debug \
            "Android" \
            "$GITHUB_WORKSPACE/build/WoW-debug.apk"

          echo "=== Debug APK ==="

          test -f "$GITHUB_WORKSPACE/build/WoW-debug.apk"

          ls -lh "$GITHUB_WORKSPACE/build/WoW-debug.apk"

      # ============================================================
      # 18. EXPORT RELEASE APK
      # ============================================================

      - name: Exportar APK Release
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.keys/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/.keys/signingKey.jks
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.SIGNING_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

        run: |
          set -e

          GODOT="$GITHUB_WORKSPACE/Godot_v4.2.1-stable_mono_linux.x86_64"

          mkdir -p "$GITHUB_WORKSPACE/build"

          rm -f "$GITHUB_WORKSPACE/build/WoW-release.apk"

          echo "=== Exportando Release ==="

          "$GODOT" \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-release \
            "Android" \
            "$GITHUB_WORKSPACE/build/WoW-release.apk"

          echo "=== Release APK ==="

          test -f "$GITHUB_WORKSPACE/build/WoW-release.apk"

          ls -lh "$GITHUB_WORKSPACE/build/WoW-release.apk"

      # ============================================================
      # 19. ZIPALIGN + FIRMA FINAL DEBUG
      # ============================================================

      - name: Firmar APK Debug
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}

        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          INPUT="$GITHUB_WORKSPACE/build/WoW-debug.apk"
          ALIGNED="$GITHUB_WORKSPACE/build/WoW-debug-aligned.apk"
          OUTPUT="$GITHUB_WORKSPACE/build/WoW-debug-signed.apk"

          echo "=== Zipalign Debug ==="

          "$BUILD_TOOLS/zipalign" \
            -f \
            -p \
            4 \
            "$INPUT" \
            "$ALIGNED"

          echo "=== Firma Debug ==="

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/.keys/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUTPUT" \
            "$ALIGNED"

          rm -f "$INPUT"
          rm -f "$ALIGNED"

          echo "=== Verificación Debug ==="

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$OUTPUT"

          ls -lh "$OUTPUT"

      # ============================================================
      # 20. ZIPALIGN + FIRMA FINAL RELEASE
      # ============================================================

      - name: Firmar APK Release
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}

        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          INPUT="$GITHUB_WORKSPACE/build/WoW-release.apk"
          ALIGNED="$GITHUB_WORKSPACE/build/WoW-release-aligned.apk"
          OUTPUT="$GITHUB_WORKSPACE/build/WoW-release-signed.apk"

          echo "=== Zipalign Release ==="

          "$BUILD_TOOLS/zipalign" \
            -f \
            -p \
            4 \
            "$INPUT" \
            "$ALIGNED"

          echo "=== Firma Release ==="

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/.keys/signingKey.jks" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
            --key-pass "pass:$SIGNING_KEY_PASSWORD" \
            --out "$OUTPUT" \
            "$ALIGNED"

          rm -f "$INPUT"
          rm -f "$ALIGNED"

          echo "=== Verificación Release ==="

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$OUTPUT"

          ls -lh "$OUTPUT"

      # ============================================================
      # 21. INFORMACIÓN FINAL DE APK
      # ============================================================

      - name: Verificar APK finales
        shell: bash
        run: |
          set -e

          DEBUG_APK="$GITHUB_WORKSPACE/build/WoW-debug-signed.apk"
          RELEASE_APK="$GITHUB_WORKSPACE/build/WoW-release-signed.apk"

          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"

          echo
          echo "=========================================="
          echo " APK DEBUG"
          echo "=========================================="

          ls -lh "$DEBUG_APK"

          echo
          echo "=========================================="
          echo " APK RELEASE"
          echo "=========================================="

          ls -lh "$RELEASE_APK"

          echo
          echo "=========================================="
          echo " APKSIGNER DEBUG"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify \
            --verbose \
            "$DEBUG_APK"

          echo
          echo "=========================================="
          echo " APKSIGNER RELEASE"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify \
            --verbose \
            "$RELEASE_APK"

      # ============================================================
      # 22. SUBIR APK DEBUG
      # ============================================================

      - name: Subir APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Android-Debug
          path: build/WoW-debug-signed.apk
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 23. SUBIR APK RELEASE
      # ============================================================

      - name: Subir APK Release
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Android-Release
          path: build/WoW-release-signed.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 24. PRIMERA EJECUCIÓN:
      #     SUBIR signingKey.jks SOLAMENTE SI SE GENERÓ NUEVA
      # ============================================================

      - name: Subir signingKey inicial
        if: steps.signing.outputs.created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WoW-SigningKey-INITIAL
          path: .keys/signingKey.jks
          if-no-files-found: error
          retention-days: 1
