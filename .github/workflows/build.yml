name: Android Full Native APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # OPTIMIZACIÓN: Se usa la acción oficial para configurar el SDK y el NDK exacto sin comandos manuales
      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;25.2.9519653 platforms;android-30 platforms;android-33 build-tools;30.0.3 build-tools;33.0.2'

      # Se guardan las rutas en las variables de entorno globales necesarias para los pasos posteriores
      - name: Exportar variables de entorno de Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # OPTIMIZACIÓN: Añadido caché para cargo-apk para evitar compilarlo desde cero en cada ejecución (ahorra ~35 segundos)
      - name: Cachear herramientas de Cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-apk
          key: ${{ runner.os }}-cargo-apk-v0.10.0

      - name: Instalar dependencias del sistema y cargo-apk
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev clang lld file
          
          # Solo se instala si no fue recuperado exitosamente por el caché
          if ! command -v cargo-apk &> /dev/null; then
            cargo install cargo-apk --version 0.10.0
          fi

      - name: Extraer y acomodar fuentes de Benilla
        run: |
          set -euo pipefail

          if [ -f benilla.zip ]; then
            mkdir -p /tmp/benilla-source
            python3 -c "import zipfile; zipfile.ZipFile('benilla.zip').extractall('/tmp/benilla-source')"

            ROOT_TOML=$(find /tmp/benilla-source -name Cargo.toml -type f -print -quit)
            if [ -z "$ROOT_TOML" ]; then
              echo "::error::No se encontró Cargo.toml en el ZIP"
              exit 1
            fi
            SOURCE_DIR=$(dirname "$ROOT_TOML")

            if [ -d "$SOURCE_DIR/crates" ] && [ -d "crates" ]; then rm -rf crates; fi
            cp -r "$SOURCE_DIR"/* .
            echo "✅ Fuentes reacomodadas con éxito en la raíz."
          else
            echo "::error::El archivo benilla.zip no fue detectado."
            exit 1
          fi

          if [ -d "crates/benilla-app/src/textInput" ]; then
            mv crates/benilla-app/src/textInput crates/benilla-app/src/textinput
          fi

          # Asegurar que la carpeta assets exista en el entorno del runner
          mkdir -p assets

      - name: Configurar metadatos de Android en Cargo.toml
        run: |
          set -euo pipefail
          echo "" >> Cargo.toml
          echo "[package.metadata.android]" >> Cargo.toml
          echo 'package = "com.wow.mobile"' >> Cargo.toml
          echo 'label = "WoW Mobile"' >> Cargo.toml
          echo 'lib_name = "kira"' >> Cargo.toml
          echo 'min_sdk_version = 26' >> Cargo.toml
          echo 'target_sdk_version = 33' >> Cargo.toml

      - name: Compilar y Empaquetar APK de forma Nativa
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$NDK_HOME"
          
          # SOLUCIÓN AL ERROR: Se especifica el target con el API Level mínimo (26) requerido para AAudio
          cargo apk build --release --target aarch64-linux-android26

      - name: Subir APK Final para Jugar
        uses: actions/upload-artifact@v4
        with:
          name: wow-mobile-launcher-native
          path: target/aarch64-linux-android/release/apk/*.apk
