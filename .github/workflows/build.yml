name: Compilar WoW

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

env:
  GODOT_VERSION: "4.2.1"
  GODOT_DIR: "${{ github.workspace }}/godot"
  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Descargar repositorio
      # ============================================================
      - name: Descargar código fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. .NET 8
      # ============================================================
      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # ============================================================
      # 4. Configurar Android SDK
      # ============================================================
      - name: Configurar Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: No se encontró sdkmanager."
            exit 1
          fi

          echo "sdkmanager encontrado:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "Android SDK preparado."

      # ============================================================
      # 5. Verificar proyecto
      # ============================================================
      - name: Verificar archivos del proyecto
        shell: bash
        run: |
          set -e

          echo "===== ARCHIVOS PRINCIPALES ====="

          test -f "project.godot"
          test -f "WoW Android Client.csproj"
          test -f "export_presets.cfg"

          echo "project.godot OK"
          echo "WoW Android Client.csproj OK"
          echo "export_presets.cfg OK"

          echo
          echo "===== ARCHIVOS C# ====="

          find . -maxdepth 2 -type f \
            \( -name "*.cs" -o -name "*.csproj" \) \
            -print

      # ============================================================
      # 6. Descargar Godot 4.2.1 Mono
      # ============================================================
      - name: Descargar Godot 4.2.1 Mono
        shell: bash
        run: |
          set -e

          mkdir -p "$GODOT_DIR"

          cd "$GODOT_DIR"

          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_mono_linux_x86_64.zip" \
            -O godot.zip

          unzip -q godot.zip

          chmod +x \
            "./Godot_v4.2.1-stable_mono_linux.x86_64"

          echo "Godot instalado."

          "$GODOT_DIR/Godot_v4.2.1-stable_mono_linux.x86_64" \
            --version

      # ============================================================
      # 7. Descargar templates Mono
      # ============================================================
      - name: Instalar templates Android Mono
        shell: bash
        run: |
          set -e

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.2.1.stable.mono"

          mkdir -p "$TEMPLATE_DIR"

          cd "$TEMPLATE_DIR"

          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_mono_export_templates.tpz" \
            -O templates.tpz

          unzip -q templates.tpz

          if [ -d "templates" ]; then
            cp -r templates/* .
          fi

          echo "===== TEMPLATES ====="
          find "$TEMPLATE_DIR" -maxdepth 2 -type f -print

          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

          echo "Templates Android Mono OK."

      # ============================================================
      # 8. Restaurar NuGet
      # ============================================================
      - name: Restaurar proyecto .NET
        shell: bash
        run: |
          set -e

          dotnet restore \
            "WoW Android Client.csproj"

      # ============================================================
      # 9. Compilar C# Debug
      # ============================================================
      - name: Compilar C# Debug
        shell: bash
        run: |
          set -e

          dotnet build \
            "WoW Android Client.csproj" \
            -c Debug \
            --no-restore

      # ============================================================
      # 10. Compilar C# Release
      # ============================================================
      - name: Compilar C# Release
        shell: bash
        run: |
          set -e

          dotnet build \
            "WoW Android Client.csproj" \
            -c Release \
            --no-restore

      # ============================================================
      # 11. Verificar DLL Debug + Release
      # ============================================================
      - name: Verificar assemblies C#
        shell: bash
        run: |
          set -e

          DEBUG_DLL=".godot/mono/temp/bin/Debug/WoW Android Client.dll"
          RELEASE_DLL=".godot/mono/temp/bin/Release/WoW Android Client.dll"

          echo "DEBUG:"
          ls -lh "$DEBUG_DLL"

          echo
          echo "RELEASE:"
          ls -lh "$RELEASE_DLL"

          test -f "$DEBUG_DLL"
          test -f "$RELEASE_DLL"

          echo
          echo "Ambos assemblies fueron generados correctamente."

      # ============================================================
      # 12. Generar solución Godot
      # ============================================================
      - name: Generar solución Godot
        shell: bash
        run: |
          set -e

          "$GODOT_DIR/Godot_v4.2.1-stable_mono_linux.x86_64" \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --build-solutions \
            --quit

      # ============================================================
      # 13. Validar proyecto Godot
      # ============================================================
      - name: Validar proyecto Godot
        shell: bash
        run: |
          set -e

          "$GODOT_DIR/Godot_v4.2.1-stable_mono_linux.x86_64" \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --editor \
            --quit

      # ============================================================
      # 14. Verificar preset Android
      # ============================================================
      - name: Verificar preset Android
        shell: bash
        run: |
          set -e

          grep -n '^\[preset\.[0-9]\+\]' export_presets.cfg || true
          grep -n 'platform="Android"' export_presets.cfg || true
          grep -n 'package/name' export_presets.cfg || true

          echo
          echo "Preset Android localizado."

      # ============================================================
      # 15. Crear keystore temporal
      # ============================================================
      - name: Crear keystore de compilación
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/.keys"

          keytool \
            -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/.keys/signingKey.jks" \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass androidpassword \
            -keypass androidpassword \
            -dname "CN=WoW Android,O=WoW,C=AR"

          test -f "$GITHUB_WORKSPACE/.keys/signingKey.jks"

          echo "Keystore creado."

      # ============================================================
      # 16. Exportar APK DEBUG
      # ============================================================
      - name: Exportar APK Debug
        shell: bash
        run: |
          set -e

          mkdir -p build

          rm -f build/WoW-debug.apk

          "$GODOT_DIR/Godot_v4.2.1-stable_mono_linux.x86_64" \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-debug \
            "Android" \
            "$GITHUB_WORKSPACE/build/WoW-debug.apk"

          if [ ! -f "build/WoW-debug.apk" ]; then
            echo "ERROR: No se generó WoW-debug.apk"
            exit 1
          fi

          ls -lh build/WoW-debug.apk

      # ============================================================
      # 17. Exportar APK RELEASE
      # ============================================================
      - name: Exportar APK Release
        shell: bash
        run: |
          set -e

          mkdir -p build

          rm -f build/WoW-release.apk

          "$GODOT_DIR/Godot_v4.2.1-stable_mono_linux.x86_64" \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-release \
            "Android" \
            "$GITHUB_WORKSPACE/build/WoW-release.apk"

          if [ ! -f "build/WoW-release.apk" ]; then
            echo "ERROR: No se generó WoW-release.apk"
            exit 1
          fi

          ls -lh build/WoW-release.apk

      # ============================================================
      # 18. Firmar APK Debug
      # ============================================================
      - name: Firmar APK Debug
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/zipalign" \
            -f \
            4 \
            build/WoW-debug.apk \
            build/WoW-debug-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/.keys/signingKey.jks" \
            --ks-pass pass:androidpassword \
            --key-pass pass:androidpassword \
            --ks-key-alias android \
            --out build/WoW-debug-signed.apk \
            build/WoW-debug-aligned.apk

          test -f build/WoW-debug-signed.apk

      # ============================================================
      # 19. Firmar APK Release
      # ============================================================
      - name: Firmar APK Release
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/zipalign" \
            -f \
            4 \
            build/WoW-release.apk \
            build/WoW-release-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/.keys/signingKey.jks" \
            --ks-pass pass:androidpassword \
            --key-pass pass:androidpassword \
            --ks-key-alias android \
            --out build/WoW-release-signed.apk \
            build/WoW-release-aligned.apk

          test -f build/WoW-release-signed.apk

      # ============================================================
      # 20. Verificar firmas
      # ============================================================
      - name: Verificar APKs
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          echo "===== DEBUG ====="

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            build/WoW-debug-signed.apk

          echo
          echo "===== RELEASE ====="

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            build/WoW-release-signed.apk

      # ============================================================
      # 21. Mostrar APKs finales
      # ============================================================
      - name: Mostrar APKs finales
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo " APKs GENERADAS"
          echo "========================================"

          ls -lh build/*.apk

          echo
          echo "Debug:"
          du -h build/WoW-debug-signed.apk

          echo
          echo "Release:"
          du -h build/WoW-release-signed.apk

      # ============================================================
      # 22. Subir ambas APK como artifacts
      # ============================================================
      - name: Subir APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Android-Debug
          path: build/WoW-debug-signed.apk
          if-no-files-found: error
          retention-days: 14

      - name: Subir APK Release
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Android-Release
          path: build/WoW-release-signed.apk
          if-no-files-found: error
          retention-days: 14
