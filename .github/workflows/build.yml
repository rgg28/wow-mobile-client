name: "Compilar Cliente WoW 3.3.5a"

on:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio (Con soporte Git LFS)
      uses: actions/checkout@v4
      with:
        lfs: true # Descarga los archivos reales de Godot y plantillas de Git LFS

    - name: Configurar Java 17 (Requerido por Android)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar .NET SDK (Requerido por Godot Mono/C#)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' 

    # NUEVO PASO: Compila los scripts de C# y genera las DLLs del juego antes de que Godot inspeccione los Autoloads
    - name: Compilar Solución C# (Generar binarios del juego)
      run: dotnet build --configuration Release

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

    - name: Configurar Godot y Plantillas de Exportación locales
      run: |
        # 1. Dar permisos de ejecución al binario de Godot que está en tu repositorio
        chmod +x ./Godot_v4.2.1-stable_mono_linux.x86_64
        
        # 2. Crear el directorio donde Godot busca internamente las plantillas
        mkdir -p ~/.local/share/godot/export_templates/4.2.1.stable.mono
        
        # 3. Descomprimir el archivo .tpz de tu repositorio en una ruta temporal
        unzip Godot_v4.2.1-stable_mono_export_templates.tpz -d /tmp/godot_tmpl
        
        # 4. Mover los archivos de la plantilla a la ubicación oficial de Godot
        mv /tmp/godot_tmpl/templates/* ~/.local/share/godot/export_templates/4.2.1.stable.mono/

    - name: Generar Firma Temporal y Exportar APK en Release
      run: |
        # 1. Crear la clave de firma formal (Cambiamos el alias para evitar conflictos de Debug)
        keytool -keyalg RSA -genkeypair -alias androidreleasekey -keypass androidpassword -keystore release.keystore -storepass androidpassword -dname "CN=Android Build,O=Godot,C=US" -validity 20000
        
        # 2. Crear la carpeta de salida
        mkdir -p build/android
        
        # 3. Exportar en release limpio (Godot generará el APK leyendo las DLLs creadas en el paso previo)
        ./Godot_v4.2.1-stable_mono_linux.x86_64 --headless --export-release "Android" build/android/wow_335_client.apk
        
        # 4. Encontrar apksigner en el SDK de Android del runner y aplicar la firma obligatoria
        APKSIGNER_PATH=$(find $ANDROID_HOME/build-tools/ -name apksigner | head -n 1)
        echo "Firmando APK usando apksigner desde: $APKSIGNER_PATH"
        
        $APKSIGNER_PATH sign --ks release.keystore --ks-key-alias androidreleasekey --ks-pass pass:androidpassword --key-pass pass:androidpassword build/android/wow_335_client.apk
        
        # 5. Verificar que la estructura de la firma quedó perfecta para Android
        $APKSIGNER_PATH verify build/android/wow_335_client.apk

    - name: Subir APK Generado como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: WoW-Android-Client-3.3.5a
        path: build/android/wow_335_client.apk
