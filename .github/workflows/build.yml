name: "Compilar Cliente WoW 3.3.5a"

on:
  push:
    branches: [ "main" ]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wow-335-android-build
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-22.04

    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

    # ============================================================
    # 1. CLONAR REPOSITORIO
    # ============================================================
    - name: Clonar repositorio con Git LFS
      uses: actions/checkout@v4
      with:
        lfs: true
        fetch-depth: 1

    # ============================================================
    # 2. JAVA 17
    # ============================================================
    - name: Configurar Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Verificar Java
      run: |
        java -version
        echo "JAVA_HOME=$JAVA_HOME"

    # ============================================================
    # 3. .NET 8
    # ============================================================
    - name: Configurar .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Verificar .NET
      run: |
        dotnet --info

    # ============================================================
    # 4. CONFIGURAR ANDROID SDK DEL RUNNER
    #
    # NO usamos android-actions/setup-android@v3.
    #
    # Ese action estaba ejecutando:
    #
    #     sdkmanager tools
    #
    # y "tools" ya no existe como paquete del SDK moderno.
    # ============================================================
    - name: Configurar Android SDK
      shell: bash
      run: |
        set -e

        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

        test -d "$ANDROID_HOME" || {
          echo "ERROR: Android SDK no encontrado."
          exit 1
        }

        test -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || {
          echo "No existe cmdline-tools/latest."
          echo "Buscando sdkmanager disponible..."

          find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print
        }

        SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
          -type f \
          -name sdkmanager \
          | sort -V \
          | tail -n 1)

        if [ -z "$SDKMANAGER" ]; then
          echo "ERROR: No se encontró sdkmanager."
          exit 1
        fi

        echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

        echo "Usando sdkmanager:"
        echo "$SDKMANAGER"

        "$SDKMANAGER" --version

    # ============================================================
    # 5. ACEPTAR LICENCIAS
    # ============================================================
    - name: Aceptar licencias Android
      shell: bash
      run: |
        yes | "$SDKMANAGER" --licenses >/dev/null || true

    # ============================================================
    # 6. INSTALAR SOLO LOS PAQUETES NECESARIOS
    # ============================================================
    - name: Instalar Android SDK 34
      shell: bash
      run: |
        set -e

        echo "Instalando paquetes Android necesarios..."

        "$SDKMANAGER" \
          "platform-tools" \
          "platforms;android-34" \
          "build-tools;34.0.0"

        echo ""
        echo "=== Build Tools ==="
        ls -la "$ANDROID_HOME/build-tools"

        echo ""
        echo "=== Android Platforms ==="
        ls -la "$ANDROID_HOME/platforms"

        echo ""
        echo "=== Platform Tools ==="
        ls -la "$ANDROID_HOME/platform-tools"

    # ============================================================
    # 7. CONFIGURAR PATH ANDROID
    # ============================================================
    - name: Configurar PATH Android
      shell: bash
      run: |
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

    # ============================================================
    # 8. VERIFICAR PROYECTO
    # ============================================================
    - name: Verificar archivos del proyecto
      shell: bash
      run: |
        set -e

        echo "=== Archivos principales ==="

        test -f project.godot || {
          echo "ERROR: Falta project.godot"
          exit 1
        }

        test -f "WoW Android Client.csproj" || {
          echo "ERROR: Falta WoW Android Client.csproj"
          exit 1
        }

        test -f NetworkClient.cs || {
          echo "ERROR: Falta NetworkClient.cs"
          exit 1
        }

        test -f ProgramEntryPoint.cs || {
          echo "ERROR: Falta ProgramEntryPoint.cs"
          exit 1
        }

        test -f export_presets.cfg || {
          echo "ERROR: Falta export_presets.cfg"
          exit 1
        }

        echo "Todos los archivos principales están presentes."

    # ============================================================
    # 9. PREPARAR GODOT 4.2.1 MONO
    # ============================================================
    - name: Preparar Godot 4.2.1 Mono
      shell: bash
      run: |
        set -e

        chmod +x ./Godot_v4.2.1-stable_mono_linux.x86_64

        echo "=== Godot ==="

        ./Godot_v4.2.1-stable_mono_linux.x86_64 --version

        echo ""
        echo "=== Preparando templates ==="

        TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.2.1.stable.mono"

        mkdir -p "$TEMPLATE_DIR"

        rm -rf /tmp/godot_tmpl
        mkdir -p /tmp/godot_tmpl

        unzip -q \
          Godot_v4.2.1-stable_mono_export_templates.tpz \
          -d /tmp/godot_tmpl

        echo ""
        echo "Contenido del TPZ:"

        find /tmp/godot_tmpl \
          -maxdepth 3 \
          -type f \
          -print

        if [ ! -d "/tmp/godot_tmpl/templates" ]; then
          echo "ERROR: No se encontró /tmp/godot_tmpl/templates"
          exit 1
        fi

        cp -r \
          /tmp/godot_tmpl/templates/. \
          "$TEMPLATE_DIR/"

        echo ""
        echo "Templates instaladas:"
        find "$TEMPLATE_DIR" \
          -maxdepth 1 \
          -type f \
          -printf '%f\n'

    # ============================================================
    # 10. RESTORE C#
    # ============================================================
    - name: Restaurar proyecto C#
      shell: bash
      run: |
        dotnet restore \
          "WoW Android Client.csproj" \
          --verbosity normal

    # ============================================================
    # 11. COMPILAR C# RELEASE
    #
    # Aquí queremos descubrir cualquier error real de C#.
    # ============================================================
    - name: Compilar proyecto C# Release
      shell: bash
      run: |
        dotnet build \
          "WoW Android Client.csproj" \
          --configuration Release \
          --no-restore \
          --verbosity normal

    # ============================================================
    # 12. VERIFICAR DLL
    # ============================================================
    - name: Verificar assemblies C#
      shell: bash
      run: |
        echo "=== DLL generadas ==="

        find . \
          -type f \
          -name "*.dll" \
          -print

    # ============================================================
    # 13. PREPARAR SOLUCIÓN GODOT
    #
    # SIN "|| true".
    # ============================================================
    - name: Preparar solución C# de Godot
      shell: bash
      run: |
        timeout 180 \
          ./Godot_v4.2.1-stable_mono_linux.x86_64 \
          --headless \
          --editor \
          --path "$GITHUB_WORKSPACE" \
          --build-solutions \
          --quit \
          --verbose

    # ============================================================
    # 14. VALIDAR PROYECTO GODOT
    # ============================================================
    - name: Validar proyecto Godot
      shell: bash
      run: |
        timeout 180 \
          ./Godot_v4.2.1-stable_mono_linux.x86_64 \
          --headless \
          --editor \
          --path "$GITHUB_WORKSPACE" \
          --quit \
          --verbose

    # ============================================================
    # 15. COMPROBAR PRESET ANDROID
    # ============================================================
    - name: Comprobar preset Android
      shell: bash
      run: |
        echo "=== Presets disponibles ==="

        grep -n 'name=' export_presets.cfg || true

        echo ""
        echo "=== Buscando preset Android ==="

        if ! grep -q 'name="Android"' export_presets.cfg; then
          echo "ERROR: No existe un preset llamado Android."
          exit 1
        fi

        echo "Preset Android encontrado."

    # ============================================================
    # 16. CREAR KEYSTORE RELEASE
    # ============================================================
    - name: Generar firma Release
      shell: bash
      run: |
        set -e

        keytool \
          -keyalg RSA \
          -genkeypair \
          -alias androidreleasekey \
          -keypass androidpassword \
          -keystore release.keystore \
          -storepass androidpassword \
          -dname "CN=Android Build,O=Godot,C=US" \
          -validity 20000 \
          -noprompt

        echo ""
        echo "Keystore creada."

        keytool \
          -list \
          -keystore release.keystore \
          -storepass androidpassword

    # ============================================================
    # 17. PREPARAR CARPETA APK
    # ============================================================
    - name: Preparar salida
      run: |
        mkdir -p build/android

    # ============================================================
    # 18. EXPORTAR APK RELEASE
    # ============================================================
    - name: Exportar APK Release
      shell: bash
      run: |
        set -e

        timeout 600 \
          ./Godot_v4.2.1-stable_mono_linux.x86_64 \
          --headless \
          --path "$GITHUB_WORKSPACE" \
          --verbose \
          --export-release \
          "Android" \
          build/android/wow_335_client.apk

    # ============================================================
    # 19. VERIFICAR APK
    # ============================================================
    - name: Verificar APK generado
      shell: bash
      run: |
        if [ ! -f build/android/wow_335_client.apk ]; then
          echo "ERROR: Godot no creó el APK."

          echo ""
          echo "Contenido de build:"
          find build \
            -maxdepth 4 \
            -type f \
            -ls

          exit 1
        fi

        echo "APK creado:"
        ls -lh build/android/wow_335_client.apk

        file build/android/wow_335_client.apk

    # ============================================================
    # 20. ENCONTRAR APKSIGNER
    # ============================================================
    - name: Localizar apksigner
      shell: bash
      run: |
        APKSIGNER_PATH=$(find "$ANDROID_HOME/build-tools" \
          -type f \
          -name apksigner \
          | sort -V \
          | tail -n 1)

        if [ -z "$APKSIGNER_PATH" ]; then
          echo "ERROR: No se encontró apksigner."
          exit 1
        fi

        echo "APKSIGNER_PATH=$APKSIGNER_PATH" >> "$GITHUB_ENV"

        echo "Apksigner:"
        echo "$APKSIGNER_PATH"

        "$APKSIGNER_PATH" --version

    # ============================================================
    # 21. FIRMAR APK RELEASE
    # ============================================================
    - name: Firmar APK Release
      shell: bash
      run: |
        set -e

        "$APKSIGNER_PATH" sign \
          --ks release.keystore \
          --ks-key-alias androidreleasekey \
          --ks-pass pass:androidpassword \
          --key-pass pass:androidpassword \
          build/android/wow_335_client.apk

    # ============================================================
    # 22. VERIFICAR FIRMA
    # ============================================================
    - name: Verificar firma APK
      shell: bash
      run: |
        set -e

        "$APKSIGNER_PATH" verify \
          --verbose \
          build/android/wow_335_client.apk

        echo ""
        echo "=========================================="
        echo " APK RELEASE FIRMADO CORRECTAMENTE"
        echo "=========================================="

        ls -lh build/android/wow_335_client.apk

    # ============================================================
    # 23. SUBIR APK
    # ============================================================
    - name: Subir APK generado
      uses: actions/upload-artifact@v4
      with:
        name: WoW-Android-Client-3.3.5a
        path: build/android/wow_335_client.apk
        if-no-files-found: error
        retention-days: 7
