name: Compilar WoW

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  build:
    name: Compilar APK WoW
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. DESCARGAR REPOSITORIO
      # ============================================================
      - name: Descargar codigo fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. .NET 8
      # ============================================================
      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Preparar Android SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " ANDROID SDK"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: No se encontro sdkmanager."
            exit 1
          fi

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          echo ""
          echo "Aceptando licencias..."

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo ""
          echo "Instalando componentes Android..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo ""
          echo "Android SDK preparado."

      # ============================================================
      # 5. VERIFICAR ARCHIVOS DEL PROYECTO
      # ============================================================
      - name: Verificar archivos principales
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " ARCHIVOS PRINCIPALES"
          echo "=========================================="

          test -f "project.godot"
          test -f "WoW Android Client.csproj"
          test -f "NetworkClient.cs"
          test -f "ProgramEntryPoint.cs"
          test -f "export_presets.cfg"

          echo ""
          echo "Todos los archivos principales están presentes."

      # ============================================================
      # 6. DESCARGAR GODOT 4.2.1 MONO
      # ============================================================
      - name: Preparar Godot 4.2.1 Mono
        shell: bash
        run: |
          set -e

          GODOT="./Godot_v4.2.1-stable_mono_linux.x86_64"

          if [ ! -f "$GODOT" ]; then
            echo "Descargando Godot 4.2.1 Mono..."

            wget -q \
              "https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_mono_linux_x86_64.zip" \
              -O godot.zip

            unzip -q godot.zip

            rm -f godot.zip
          fi

          chmod +x "$GODOT"

          echo ""
          echo "Godot:"
          "$GODOT" --version

      # ============================================================
      # 7. EXPORT TEMPLATES ANDROID
      # ============================================================
      - name: Preparar templates de exportacion Android
        shell: bash
        run: |
          set -e

          GODOT="./Godot_v4.2.1-stable_mono_linux.x86_64"

          mkdir -p "$HOME/.local/share/godot/export_templates/4.2.1.stable"

          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_mono_export_templates.tpz"

          wget -q \
            "$TEMPLATE_URL" \
            -O templates.tpz

          mkdir -p templates_extract

          unzip -q templates.tpz -d templates_extract

          cp -r \
            templates_extract/templates/. \
            "$HOME/.local/share/godot/export_templates/4.2.1.stable/"

          rm -rf templates_extract
          rm -f templates.tpz

          echo "Templates Android preparados."

      # ============================================================
      # 8. RESTORE C#
      # ============================================================
      - name: Restaurar proyecto C#
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " DOTNET RESTORE"
          echo "=========================================="

          dotnet restore "WoW Android Client.csproj"

      # ============================================================
      # 9. COMPILAR DEBUG + RELEASE
      # ============================================================
      - name: Compilar proyecto C# Debug + Release
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " COMPILANDO C# DEBUG"
          echo "=========================================="

          dotnet build "WoW Android Client.csproj" \
            --configuration Debug \
            --no-restore

          echo ""
          echo "=========================================="
          echo " COMPILANDO C# RELEASE"
          echo "=========================================="

          dotnet build "WoW Android Client.csproj" \
            --configuration Release \
            --no-restore

          echo ""
          echo "=========================================="
          echo " DLL GENERADAS"
          echo "=========================================="

          find ".godot/mono/temp/bin" \
            -maxdepth 2 \
            -type f \
            -name "*.dll" \
            -printf '%p\n' | sort

      # ============================================================
      # 10. VERIFICAR ASSEMBLIES
      # ============================================================
      - name: Verificar assemblies C#
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " VERIFICANDO ASSEMBLIES"
          echo "=========================================="

          DEBUG_DLL=".godot/mono/temp/bin/Debug/WoW Android Client.dll"
          RELEASE_DLL=".godot/mono/temp/bin/Release/WoW Android Client.dll"

          if [ ! -f "$DEBUG_DLL" ]; then
            echo "ERROR: No existe:"
            echo "$DEBUG_DLL"
            exit 1
          fi

          if [ ! -f "$RELEASE_DLL" ]; then
            echo "ERROR: No existe:"
            echo "$RELEASE_DLL"
            exit 1
          fi

          echo ""
          echo "DEBUG:"
          ls -lh "$DEBUG_DLL"
          file "$DEBUG_DLL"

          echo ""
          echo "RELEASE:"
          ls -lh "$RELEASE_DLL"
          file "$RELEASE_DLL"

          echo ""
          echo "=========================================="
          echo " CLASES C#"
          echo "=========================================="

          grep -Rni \
            -E 'class NetworkClient|class ProgramEntryPoint' \
            --include="*.cs" \
            . || true

      # ============================================================
      # 11. GODOT BUILD SOLUTIONS
      # ============================================================
      - name: Preparar solucion C# de Godot
        shell: bash
        run: |
          set -e

          GODOT="./Godot_v4.2.1-stable_mono_linux.x86_64"

          echo "=========================================="
          echo " GODOT BUILD SOLUTIONS"
          echo "=========================================="

          timeout 180 "$GODOT" \
            --headless \
            --path . \
            --build-solutions \
            --quit \
            --verbose

      # ============================================================
      # 12. VALIDAR PROYECTO GODOT
      # ============================================================
      - name: Validar proyecto Godot
        shell: bash
        run: |
          set -e

          GODOT="./Godot_v4.2.1-stable_mono_linux.x86_64"

          echo "=========================================="
          echo " VALIDACION GODOT"
          echo "=========================================="

          timeout 180 "$GODOT" \
            --headless \
            --path . \
            --editor \
            --quit \
            --verbose

      # ============================================================
      # 13. VERIFICAR PRESET ANDROID
      # ============================================================
      - name: Verificar preset Android
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " PRESET ANDROID"
          echo "=========================================="

          if ! grep -q 'name="Android"' export_presets.cfg; then
            echo "ERROR: No se encontro el preset Android."
            exit 1
          fi

          echo "Preset Android encontrado."

      # ============================================================
      # 14. CREAR KEYSTORE TEMPORAL
      # ============================================================
      - name: Crear keystore temporal
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " CREANDO KEYSTORE"
          echo "=========================================="

          keytool \
            -genkeypair \
            -v \
            -keystore release.keystore \
            -alias androidreleasekey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass androidpassword \
            -keypass androidpassword \
            -dname "CN=Android Build,O=Godot,C=US"

          echo "Keystore creado."

      # ============================================================
      # 15. EXPORTAR APK
      # ============================================================
      - name: Exportar APK Android
        shell: bash
        run: |
          set -e

          GODOT="./Godot_v4.2.1-stable_mono_linux.x86_64"

          mkdir -p build

          echo "=========================================="
          echo " EXPORTANDO APK"
          echo "=========================================="

          timeout 300 "$GODOT" \
            --headless \
            --path . \
            --export-release "Android" \
            "build/WoW.apk"

          echo ""
          echo "APK generado:"

          ls -lh build/WoW.apk

      # ============================================================
      # 16. FIRMAR APK
      # ============================================================
      - name: Firmar APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " FIRMANDO APK"
          echo "=========================================="

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: No se encontro apksigner."
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-key-alias androidreleasekey \
            --ks-pass pass:androidpassword \
            --key-pass pass:androidpassword \
            --out build/WoW-signed.apk \
            build/WoW.apk

          echo ""
          echo "APK firmado:"

          ls -lh build/WoW-signed.apk

      # ============================================================
      # 17. VERIFICAR FIRMA
      # ============================================================
      - name: Verificar firma APK
        shell: bash
        run: |
          set -e

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -n 1)

          echo "=========================================="
          echo " VERIFICANDO FIRMA"
          echo "=========================================="

          "$APKSIGNER" verify \
            --verbose \
            build/WoW-signed.apk

      # ============================================================
      # 18. SUBIR APK
      # ============================================================
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Android-APK
          path: build/WoW-signed.apk
          if-no-files-found: error
          retention-days: 30
