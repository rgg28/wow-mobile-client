name: Build WoW Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_PLATFORM: android-35
      ANDROID_BUILD_TOOLS: 35.0.0
      ANDROID_CMAKE_VERSION: 3.31.6
      ANDROID_NDK_VERSION: 28.2.13676358
      JAVA_VERSION: "17"
      GRADLE_VERSION: "8.9"

    steps:

      # ============================================================
      # 1. MAIN REPOSITORY
      # ============================================================

      - name: Checkout wow-mobile-client
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # 2. WOWEE - REPOSITORY SEPARADO
      # ============================================================

      - name: Checkout WoWee
        uses: actions/checkout@v4
        with:
          repository: Kelsidavis/WoWee
          path: wowee
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # 3. VERIFY REPOSITORIES
      # ============================================================

      - name: Verify repositories
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "REPOSITORIES"
          echo "=============================================="

          echo "Workspace:"
          pwd

          echo
          echo "Main repository:"
          test -d app

          echo "app/"
          find app -maxdepth 2 -type f | sort | head -100

          echo
          echo "WoWee:"
          test -d wowee
          test -d wowee/include
          test -d wowee/src

          echo "WoWee checkout OK."

      # ============================================================
      # 4. JAVA
      # ============================================================

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # 5. ANDROID SDK
      # ============================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID SDK"
          echo "=============================================="

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" \
              -type f \
              -name sdkmanager \
              | sort \
              | tail -1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager no encontrado."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmake;${ANDROID_CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      # ============================================================
      # 6. VERIFY ANDROID TOOLCHAIN
      # ============================================================

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID TOOLCHAIN"
          echo "=============================================="

          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "${ANDROID_HOME}/platforms/${ANDROID_PLATFORM}"
          test -d "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}"
          test -d "${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}"
          test -d "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"

          echo
          echo "CMake:"
          "${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}/bin/cmake" --version

          echo
          echo "ADB:"
          "${ANDROID_HOME}/platform-tools/adb" version

          echo
          echo "NDK:"
          cat "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/source.properties"

      # ============================================================
      # 7. SDL3
      # ============================================================

      - name: Checkout SDL3
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          path: sdl3
          fetch-depth: 1

      # ============================================================
      # 8. GLM
      # ============================================================

      - name: Checkout GLM
        uses: actions/checkout@v4
        with:
          repository: g-truc/glm
          path: glm-src
          fetch-depth: 1

      # ============================================================
      # 9. OPENSSL
      # ============================================================

      - name: Extract OpenSSL
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "OPENSSL"
          echo "=============================================="

          test -f openssl.zip

          rm -rf openssl-android
          mkdir -p openssl-android

          unzip -q openssl.zip -d openssl-android

          echo "OpenSSL extracted."

          find openssl-android \
            -maxdepth 5 \
            -type f \
            | head -100

      # ============================================================
      # 10. VERIFY WOWEE SOURCES
      # ============================================================

      - name: Verify WoWee sources
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "WOWEE SOURCES"
          echo "=============================================="

          test -d wowee

          REQUIRED_FILES=(

            "wowee/include/core/application.hpp"
            "wowee/include/network/world_socket.hpp"
            "wowee/include/auth/auth_handler.hpp"

            "wowee/src/auth/auth_handler.cpp"
            "wowee/src/auth/auth_opcodes.cpp"
            "wowee/src/auth/auth_packets.cpp"
            "wowee/src/auth/big_num.cpp"
            "wowee/src/auth/crypto.cpp"
            "wowee/src/auth/srp.cpp"
            "wowee/src/auth/vanilla_crypt.cpp"

            "wowee/src/network/packet.cpp"
            "wowee/src/network/socket.cpp"
            "wowee/src/network/tcp_socket.cpp"
            "wowee/src/network/world_socket.cpp"

            "wowee/src/game/opcodes.cpp"
            "wowee/src/game/opcode_table.cpp"
            "wowee/src/game/game_handler_packets.cpp"

            "wowee/src/core/window.cpp"
            "wowee/src/core/application.cpp"
            "wowee/src/core/app_clock.cpp"
            "wowee/src/core/input.cpp"
            "wowee/src/core/logger.cpp"

            "wowee/src/rendering/renderer.cpp"
            "wowee/src/rendering/render_graph.cpp"
            "wowee/src/rendering/vk_context.cpp"
            "wowee/src/rendering/vk_pipeline.cpp"
            "wowee/src/rendering/vk_buffer.cpp"
            "wowee/src/rendering/vk_shader.cpp"
            "wowee/src/rendering/vk_texture.cpp"
            "wowee/src/rendering/vk_utils.cpp"

            "wowee/extern/imgui/imgui.cpp"
            "wowee/extern/imgui/imgui_draw.cpp"
            "wowee/extern/imgui/imgui_tables.cpp"
            "wowee/extern/imgui/imgui_widgets.cpp"
            "wowee/extern/imgui/backends/imgui_impl_sdl3.cpp"
            "wowee/extern/imgui/backends/imgui_impl_vulkan.cpp"

            "wowee/extern/vk-bootstrap/src/VkBootstrap.cpp"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo
              echo "ERROR: falta:"
              echo "$FILE"
              exit 1
            fi
          done

          echo
          echo "Todos los fuentes seleccionados por nuestro CMake existen."
          echo "No se utiliza wowee/CMakeLists.txt."
          echo "WoWee OK."

      # ============================================================
      # 11. VERIFY ANDROID CMAKE
      # ============================================================

      - name: Verify Android CMake
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID CMAKE"
          echo "=============================================="

          CMAKE_FILE="app/src/main/CMakeLists.txt"

          test -f "$CMAKE_FILE"

          grep -q 'wowee/src/auth/auth_handler.cpp' "$CMAKE_FILE"
          grep -q 'wowee/src/network/world_socket.cpp' "$CMAKE_FILE"
          grep -q 'wowee/src/core/application.cpp' "$CMAKE_FILE"
          grep -q 'wowee/src/rendering/renderer.cpp' "$CMAKE_FILE"

          echo "CMake Android OK."

      # ============================================================
      # 12. VERIFY WOW INTEGRATION
      # ============================================================

      - name: Validate WoW integration
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "WOW INTEGRATION"
          echo "=============================================="

          FILE="app/src/main/wow_integration.cpp"

          test -f "$FILE"

          if grep -q 'g_WoWwowee' "$FILE"; then
            echo "ERROR: g_WoWwowee encontrado."
            exit 1
          fi

          if grep -q 'wowee::core::wowee::core' "$FILE"; then
            echo "ERROR: namespace wowee::core duplicado."
            exit 1
          fi

          if grep -q 'wowee::network::wowee::network' "$FILE"; then
            echo "ERROR: namespace wowee::network duplicado."
            exit 1
          fi

          echo "wow_integration.cpp OK."

      # ============================================================
      # 13. INSTALL GRADLE 8.9
      #
      # NO necesitamos gradlew dentro del repositorio.
      # Tampoco usamos los wrappers de WoWee o SDL3.
      # ============================================================

      - name: Install Gradle
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "GRADLE"
          echo "=============================================="

          GRADLE_DIR="${RUNNER_TEMP}/gradle-${GRADLE_VERSION}"

          if [ ! -x "${GRADLE_DIR}/bin/gradle" ]; then

            mkdir -p "${RUNNER_TEMP}/gradle-download"

            cd "${RUNNER_TEMP}/gradle-download"

            wget -q \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -O gradle.zip

            rm -rf "${GRADLE_DIR}"

            unzip -q gradle.zip \
              -d "${RUNNER_TEMP}"

          fi

          echo "${GRADLE_DIR}/bin" >> "$GITHUB_PATH"

          echo "Gradle instalado:"
          "${GRADLE_DIR}/bin/gradle" --version

      # ============================================================
      # 14. VERIFY GRADLE PROJECT
      # ============================================================

      - name: Verify Gradle project
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "GRADLE PROJECT"
          echo "=============================================="

          if [ -f settings.gradle ]; then
            echo "Encontrado: settings.gradle"
          elif [ -f settings.gradle.kts ]; then
            echo "Encontrado: settings.gradle.kts"
          else
            echo "ERROR: no existe settings.gradle ni settings.gradle.kts"
            echo
            echo "Archivos raíz:"
            find . -maxdepth 1 -type f -print | sort
            exit 1
          fi

          test -f app/build.gradle || \
          test -f app/build.gradle.kts

          echo
          echo "Proyecto Android Gradle OK."

          gradle --version

      # ============================================================
      # 15. CLEAN
      # ============================================================

      - name: Clean native build
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "CLEAN"
          echo "=============================================="

          rm -rf app/.cxx
          rm -rf app/build

          gradle clean --no-daemon

      # ============================================================
      # 16. SHOW CONFIGURATION
      # ============================================================

      - name: Show build configuration
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "app/build.gradle"
          echo "=============================================="

          if [ -f app/build.gradle ]; then
            sed -n '1,360p' app/build.gradle
          else
            sed -n '1,360p' app/build.gradle.kts
          fi

          echo
          echo "=============================================="
          echo "app/src/main/CMakeLists.txt"
          echo "=============================================="

          sed -n '1,420p' app/src/main/CMakeLists.txt

      # ============================================================
      # 17. BUILD APK
      # ============================================================

      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "BUILD WOW MOBILE"
          echo "=============================================="

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # ============================================================
      # 18. FIND APK
      # ============================================================

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "APK OUTPUT"
          echo "=============================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            -quit)"

          if [ -z "$APK" ]; then
            echo
            echo "ERROR: no se genero ningun APK."
            exit 1
          fi

          echo
          echo "APK generado:"
          echo "$APK"

      # ============================================================
      # 19. UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wow-mobile-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
