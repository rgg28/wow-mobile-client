name: "Compilar Cliente WoW 3.3.5a"

on:
  push:
    branches: [ "main" ]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wow-335-android-build
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:

    # ============================================================
    # 1. CLONAR REPOSITORIO
    # ============================================================
    - name: Clonar repositorio (Git LFS)
      uses: actions/checkout@v4
      with:
        lfs: true
        fetch-depth: 1

    # ============================================================
    # 2. JAVA 17
    # ============================================================
    - name: Configurar Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Verificar Java
      run: |
        java -version
        echo "JAVA_HOME=$JAVA_HOME"

    # ============================================================
    # 3. .NET 8
    # ============================================================
    - name: Configurar .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Verificar .NET
      run: |
        dotnet --info

    # ============================================================
    # 4. ANDROID SDK
    # ============================================================
    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    # ============================================================
    # 5. INSTALAR SOLO LOS PAQUETES NECESARIOS
    # ============================================================
    - name: Instalar Android SDK 34
      shell: bash
      run: |
        echo "Aceptando licencias..."
        yes | sdkmanager --licenses >/dev/null || true

        echo "Instalando Android SDK..."

        sdkmanager \
          "platform-tools" \
          "platforms;android-34" \
          "build-tools;34.0.0"

        echo ""
        echo "Android SDK instalado."

        echo ""
        echo "Build Tools:"
        ls -la "$ANDROID_HOME/build-tools"

        echo ""
        echo "Platforms:"
        ls -la "$ANDROID_HOME/platforms"

    # ============================================================
    # 6. VERIFICAR ARCHIVOS DEL PROYECTO
    # ============================================================
    - name: Verificar archivos del proyecto
      shell: bash
      run: |
        test -f project.godot || {
          echo "ERROR: falta project.godot"
          exit 1
        }

        test -f "WoW Android Client.csproj" || {
          echo "ERROR: falta WoW Android Client.csproj"
          exit 1
        }

        test -f NetworkClient.cs || {
          echo "ERROR: falta NetworkClient.cs"
          exit 1
        }

        test -f ProgramEntryPoint.cs || {
          echo "ERROR: falta ProgramEntryPoint.cs"
          exit 1
        }

        echo "Archivos principales encontrados correctamente."

    # ============================================================
    # 7. GODOT 4.2.1 MONO
    # ============================================================
    - name: Preparar Godot 4.2.1 Mono
      shell: bash
      run: |
        chmod +x ./Godot_v4.2.1-stable_mono_linux.x86_64

        echo "=== Godot ==="

        ./Godot_v4.2.1-stable_mono_linux.x86_64 --version

        echo ""
        echo "=== Preparando templates ==="

        mkdir -p \
          "$HOME/.local/share/godot/export_templates/4.2.1.stable.mono"

        rm -rf /tmp/godot_tmpl
        mkdir -p /tmp/godot_tmpl

        unzip -q \
          Godot_v4.2.1-stable_mono_export_templates.tpz \
          -d /tmp/godot_tmpl

        if [ ! -d "/tmp/godot_tmpl/templates" ]; then
          echo "ERROR: No se encontró la carpeta templates."
          find /tmp/godot_tmpl -maxdepth 3 -type f
          exit 1
        fi

        cp -r \
          /tmp/godot_tmpl/templates/. \
          "$HOME/.local/share/godot/export_templates/4.2.1.stable.mono/"

        echo ""
        echo "Templates instaladas."

    # ============================================================
    # 8. RESTORE C#
    # ============================================================
    - name: Restaurar proyecto C#
      run: |
        dotnet restore "WoW Android Client.csproj" \
          --verbosity normal

    # ============================================================
    # 9. BUILD C#
    # ============================================================
    - name: Compilar proyecto C# Release
      run: |
        dotnet build \
          "WoW Android Client.csproj" \
          --configuration Release \
          --no-restore \
          --verbosity normal

    # ============================================================
    # 10. VERIFICAR DLL
    # ============================================================
    - name: Verificar DLL
      shell: bash
      run: |
        echo "=== DLL generadas ==="

        find . \
          -type f \
          -name "*.dll" \
          -print

    # ============================================================
    # 11. PREPARAR SOLUCIÓN GODOT
    # ============================================================
    - name: Preparar solución C# de Godot
      shell: bash
      run: |
        timeout 180 \
          ./Godot_v4.2.1-stable_mono_linux.x86_64 \
          --headless \
          --editor \
          --path "$GITHUB_WORKSPACE" \
          --build-solutions \
          --quit \
          --verbose

    # ============================================================
    # 12. VALIDAR PROYECTO
    # ============================================================
    - name: Validar proyecto Godot
      shell: bash
      run: |
        timeout 180 \
          ./Godot_v4.2.1-stable_mono_linux.x86_64 \
          --headless \
          --editor \
          --path "$GITHUB_WORKSPACE" \
          --quit \
          --verbose

    # ============================================================
    # 13. COMPROBAR PRESET
    # ============================================================
    - name: Comprobar preset Android
      shell: bash
      run: |
        if [ ! -f export_presets.cfg ]; then
          echo "ERROR: falta export_presets.cfg"
          exit 1
        fi

        echo "=== Presets ==="
        grep -n 'name=' export_presets.cfg || true

        echo ""
        echo "=== Preset Android ==="

        grep -n 'name="Android"' export_presets.cfg || {
          echo "ERROR: No existe un preset llamado Android."
          exit 1
        }

    # ============================================================
    # 14. CREAR KEYSTORE RELEASE
    # ============================================================
    - name: Generar firma Release
      shell: bash
      run: |
        keytool \
          -keyalg RSA \
          -genkeypair \
          -alias androidreleasekey \
          -keypass androidpassword \
          -keystore release.keystore \
          -storepass androidpassword \
          -dname "CN=Android Build,O=Godot,C=US" \
          -validity 20000 \
          -noprompt

        echo "Keystore creada correctamente."

    # ============================================================
    # 15. PREPARAR SALIDA
    # ============================================================
    - name: Crear carpeta de salida
      run: |
        mkdir -p build/android

    # ============================================================
    # 16. EXPORTAR RELEASE
    # ============================================================
    - name: Exportar APK Release
      shell: bash
      run: |
        timeout 600 \
          ./Godot_v4.2.1-stable_mono_linux.x86_64 \
          --headless \
          --path "$GITHUB_WORKSPACE" \
          --verbose \
          --export-release \
          "Android" \
          build/android/wow_335_client.apk

    # ============================================================
    # 17. VERIFICAR APK
    # ============================================================
    - name: Verificar APK
      shell: bash
      run: |
        if [ ! -f build/android/wow_335_client.apk ]; then
          echo "ERROR: no se creó el APK."

          find build \
            -maxdepth 4 \
            -type f \
            -ls

          exit 1
        fi

        ls -lh build/android/wow_335_client.apk

    # ============================================================
    # 18. ENCONTRAR APKSIGNER
    # ============================================================
    - name: Localizar apksigner
      shell: bash
      run: |
        APKSIGNER_PATH=$(find "$ANDROID_HOME/build-tools" \
          -type f \
          -name apksigner \
          | sort -V \
          | tail -n 1)

        if [ -z "$APKSIGNER_PATH" ]; then
          echo "ERROR: no se encontró apksigner."
          exit 1
        fi

        echo "APKSIGNER_PATH=$APKSIGNER_PATH" >> "$GITHUB_ENV"

        echo "Apksigner:"
        echo "$APKSIGNER_PATH"

        "$APKSIGNER_PATH" --version

    # ============================================================
    # 19. FIRMAR RELEASE
    # ============================================================
    - name: Firmar APK Release
      shell: bash
      run: |
        "$APKSIGNER_PATH" sign \
          --ks release.keystore \
          --ks-key-alias androidreleasekey \
          --ks-pass pass:androidpassword \
          --key-pass pass:androidpassword \
          build/android/wow_335_client.apk

    # ============================================================
    # 20. VERIFICAR FIRMA
    # ============================================================
    - name: Verificar firma
      shell: bash
      run: |
        "$APKSIGNER_PATH" verify \
          --verbose \
          build/android/wow_335_client.apk

        echo ""
        echo "=========================================="
        echo " APK RELEASE FIRMADO CORRECTAMENTE"
        echo "=========================================="

        ls -lh build/android/wow_335_client.apk

    # ============================================================
    # 21. SUBIR APK
    # ============================================================
    - name: Subir APK
      uses: actions/upload-artifact@v4
      with:
        name: WoW-Android-Client-3.3.5a
        path: build/android/wow_335_client.apk
        if-no-files-found: error
        retention-days: 7
