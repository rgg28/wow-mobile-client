name: Build WoW Mobile Client

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_VERSION: "28.2.13676358"
      ANDROID_CMAKE_VERSION: "3.31.6"
      ANDROID_PLATFORM: "android-35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ABI: "arm64-v8a"

    steps:
      # ============================================================
      # 1. CHECKOUT PRINCIPAL
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # 2. JAVA
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. ANDROID SDK / NDK / CMAKE
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmake;${ANDROID_CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      # ============================================================
      # 4. GRADLE
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ============================================================
      # 5. VERIFICAR ESTRUCTURA
      # ============================================================
      - name: Check repository structure
        shell: bash
        run: |
          echo "=============================================="
          echo "ESTRUCTURA DEL PROYECTO"
          echo "=============================================="

          echo "Directorio actual:"
          pwd

          echo
          echo "Contenido:"
          find . -maxdepth 2 -type f | sort | head -300

          echo
          echo "=============================================="
          echo "WOWEE"
          echo "=============================================="

          if [ -d "wowee" ]; then
            echo "WoWee encontrado."
          else
            echo "ERROR: No existe el directorio wowee."
            exit 1
          fi

      # ============================================================
      # 6. VERIFICAR WOWEE
      # ============================================================
      - name: Inspect WoWee source
        shell: bash
        run: |
          echo "=============================================="
          echo "INSPECCIONANDO WOWEE"
          echo "=============================================="

          find wowee \
            \( -name "*.hpp" -o -name "*.h" -o -name "*.cpp" -o -name "*.cc" \) \
            | sort \
            | head -500

          echo
          echo "Buscando AuthHandler:"
          grep -Rni "class AuthHandler\|struct AuthHandler\|AuthHandler" wowee \
            --include="*.hpp" \
            --include="*.h" \
            --include="*.cpp" \
            --include="*.cc" \
            | head -100 || true

      # ============================================================
      # 7. SDL3
      # ============================================================
      - name: Checkout SDL3
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          path: sdl3
          fetch-depth: 1

      # ============================================================
      # 8. GLM
      # ============================================================
      - name: Checkout GLM
        uses: actions/checkout@v4
        with:
          repository: g-truc/glm
          path: glm-src
          fetch-depth: 1

      # ============================================================
      # 9. OPENSSL LOCAL
      # ============================================================
      - name: Prepare OpenSSL
        shell: bash
        run: |
          echo "=============================================="
          echo "PREPARANDO OPENSSL"
          echo "=============================================="

          if [ ! -f "./openssl.zip" ]; then
            echo "ADVERTENCIA: ./openssl.zip no existe."
            echo "Se continuará sin extracción local de OpenSSL."
          else
            rm -rf "${GITHUB_WORKSPACE}/openssl-android"
            mkdir -p "${GITHUB_WORKSPACE}/openssl-android"

            unzip -q "./openssl.zip" \
              -d "${GITHUB_WORKSPACE}/openssl-android"

            echo "OpenSSL extraído correctamente."
            find "${GITHUB_WORKSPACE}/openssl-android" \
              -maxdepth 4 \
              -type f \
              | head -100
          fi

      # ============================================================
      # 10. NORMALIZAR INCLUDES SDL
      # ============================================================
      - name: Normalize WoWee SDL includes
        shell: bash
        run: |
          echo "=============================================="
          echo "NORMALIZANDO INCLUDES SDL"
          echo "=============================================="

          if [ -d "wowee" ]; then
            grep -RIl \
              --include="*.h" \
              --include="*.hpp" \
              --include="*.c" \
              --include="*.cc" \
              --include="*.cpp" \
              'SDL2/' \
              wowee \
              | while read -r file; do
                  sed -i 's#SDL2/#SDL3/#g' "$file"
                done
          fi

          echo "Normalización terminada."

      # ============================================================
      # 11. INFORMACIÓN DEL TOOLCHAIN
      # ============================================================
      - name: Show Android toolchain
        shell: bash
        run: |
          echo "=============================================="
          echo "ANDROID TOOLCHAIN"
          echo "=============================================="

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"
          echo "ANDROID_NDK_VERSION=${ANDROID_NDK_VERSION}"
          echo "ANDROID_CMAKE_VERSION=${ANDROID_CMAKE_VERSION}"
          echo "ABI=${ABI}"

          echo
          echo "NDK:"
          ls -la "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" | head -30

          echo
          echo "CMake:"
          "${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}/bin/cmake" \
            --version

          echo
          echo "Ninja:"
          "${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}/bin/ninja" \
            --version

      # ============================================================
      # 12. VERIFICAR wow_integration.cpp
      # ============================================================
      - name: Validate WoW integration source
        shell: bash
        run: |
          set -e

          FILE="app/src/main/wow_integration.cpp"

          echo "=============================================="
          echo "VALIDANDO ${FILE}"
          echo "=============================================="

          if [ ! -f "$FILE" ]; then
            echo "ERROR: No existe ${FILE}"
            exit 1
          fi

          echo
          echo "Contenido actual:"
          echo "----------------------------------------------"
          nl -ba "$FILE"
          echo "----------------------------------------------"

          echo
          echo "COMPROBANDO NAMESPACES CORRUPTOS"
          echo "=============================================="

          if grep -q "wowee::core::wowee::core" "$FILE"; then
            echo "ERROR: Namespace wowee::core duplicado."
            exit 1
          fi

          if grep -q "wowee::network::wowee::network" "$FILE"; then
            echo "ERROR: Namespace wowee::network duplicado."
            exit 1
          fi

          if grep -q "g_WoWwowee" "$FILE"; then
            echo "ERROR: Identificador g_WoWwowee corrupto."
            exit 1
          fi

          echo "OK: No hay namespaces corruptos."

          echo
          echo "COMPROBANDO AUTHHANDLER"
          echo "=============================================="

          AUTH_DECL_COUNT=$(
            grep -Ec \
              '^[[:space:]]*wowee::auth::AuthHandler[[:space:]]+auth[[:space:]]*;' \
              "$FILE" || true
          )

          echo "Declaraciones de AuthHandler encontradas: ${AUTH_DECL_COUNT}"

          if [ "$AUTH_DECL_COUNT" -gt 1 ]; then
            echo "ERROR: Hay más de una instancia local de AuthHandler."
            echo
            grep -n "wowee::auth::AuthHandler" "$FILE" || true
            exit 1
          fi

          echo "OK: AuthHandler no está duplicado."

          echo
          echo "COMPROBANDO LITERAL \\\\n"
          echo "=============================================="

          if grep -Fq '\n' "$FILE"; then
            echo "ERROR: Se encontró un literal \n dentro del código."
            grep -nF '\n' "$FILE" || true
            exit 1
          fi

          echo "OK: No hay literales \n."

          echo
          echo "COMPROBANDO DECLARACIONES"
          echo "=============================================="

          APP_COUNT=$(
            grep -Ec \
              'std::unique_ptr<wowee::core::Application>[[:space:]]+g_WoWApplication' \
              "$FILE" || true
          )

          SOCKET_COUNT=$(
            grep -Ec \
              'std::unique_ptr<wowee::network::WorldSocket>[[:space:]]+g_WoWWorldSocket' \
              "$FILE" || true
          )

          echo "g_WoWApplication: ${APP_COUNT}"
          echo "g_WoWWorldSocket: ${SOCKET_COUNT}"

          if [ "$APP_COUNT" -gt 1 ]; then
            echo "ERROR: g_WoWApplication duplicado."
            exit 1
          fi

          if [ "$SOCKET_COUNT" -gt 1 ]; then
            echo "ERROR: g_WoWWorldSocket duplicado."
            exit 1
          fi

          echo
          echo "=============================================="
          echo "VALIDACION COMPLETADA"
          echo "=============================================="

      # ============================================================
      # 13. MOSTRAR CMAKE
      # ============================================================
      - name: Inspect CMake configuration
        shell: bash
        run: |
          echo "=============================================="
          echo "CMAKE"
          echo "=============================================="

          if [ -f "app/src/main/CMakeLists.txt" ]; then
            echo
            echo "app/src/main/CMakeLists.txt:"
            cat app/src/main/CMakeLists.txt
          fi

          if [ -f "app/CMakeLists.txt" ]; then
            echo
            echo "app/CMakeLists.txt:"
            cat app/CMakeLists.txt
          fi

      # ============================================================
      # 14. LIMPIAR BUILD ANTERIOR
      # ============================================================
      - name: Clean Android build
        shell: bash
        run: |
          echo "=============================================="
          echo "LIMPIANDO BUILD"
          echo "=============================================="

          rm -rf app/.cxx
          rm -rf app/build

          ./gradlew clean --no-daemon --stacktrace

      # ============================================================
      # 15. PREPARAR GRADLE / CMAKE
      # ============================================================
      - name: Configure native build arguments
        shell: bash
        run: |
          echo "=============================================="
          echo "CONFIGURANDO BUILD NATIVO"
          echo "=============================================="

          if [ ! -f "app/build.gradle" ]; then
            echo "ERROR: No existe app/build.gradle"
            exit 1
          fi

          echo
          echo "app/build.gradle antes de modificar:"
          cat app/build.gradle

          python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text(encoding="utf-8")

          cmake_args = """
                arguments "-DANDROID_STL=c++_shared"
                arguments "-DANDROID_PLATFORM=android-35"
                arguments "-DANDROID_ABI=arm64-v8a"
                arguments "-DWOWEE_ANDROID=ON"
                arguments "-DWOWEE_USE_SDL3=ON"
          """

          if "WOWEE_ANDROID=ON" not in text:
              marker = "externalNativeBuild {"
              if marker in text:
                  text = text.replace(
                      marker,
                      marker + "\n" + cmake_args,
                      1
                  )

          path.write_text(text, encoding="utf-8")
          PY

          echo
          echo "app/build.gradle después de modificar:"
          cat app/build.gradle

      # ============================================================
      # 16. COMPILAR DEBUG APK
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          echo "=============================================="
          echo "COMPILANDO DEBUG APK"
          echo "=============================================="

          echo
          echo "NO se modificará wow_integration.cpp."
          echo "El archivo será compilado exactamente como fue validado."

          echo
          echo "=============================================="
          echo "INTEGRACION FINAL"
          echo "=============================================="

          nl -ba app/src/main/wow_integration.cpp

          echo
          echo "=============================================="
          echo "GRADLE BUILD"
          echo "=============================================="

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # ============================================================
      # 17. BUSCAR APK
      # ============================================================
      - name: Locate APK
        shell: bash
        run: |
          echo "=============================================="
          echo "APK GENERADO"
          echo "=============================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            | sort

          APK_COUNT=$(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | wc -l
          )

          echo
          echo "APK encontrados: ${APK_COUNT}"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No se generó ningún APK."
            exit 1
          fi

      # ============================================================
      # 18. SUBIR APK
      # ============================================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wow-mobile-client-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # ============================================================
      # 19. INFORMACION FINAL
      # ============================================================
      - name: Build summary
        if: success()
        shell: bash
        run: |
          echo "=============================================="
          echo "BUILD COMPLETADO"
          echo "=============================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;
