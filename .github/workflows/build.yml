name: Build WoW Mobile Client

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_VERSION: "28.2.13676358"
      ANDROID_CMAKE_VERSION: "3.31.6"
      ANDROID_PLATFORM: "android-35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ABI: "arm64-v8a"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. CONFIGURAR ANDROID SDK
      # ============================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "CONFIGURANDO ANDROID SDK"
          echo "=============================================="

          if [ -z "${ANDROID_HOME:-}" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
          fi

          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          fi

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" \
              -type f \
              -name sdkmanager \
              | sort \
              | tail -1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager no encontrado."

            find "${ANDROID_HOME}/cmdline-tools" \
              -maxdepth 4 \
              -type f \
              -name sdkmanager \
              -print || true

            exit 1
          fi

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"

          echo "SDKMANAGER=${SDKMANAGER}" >> "$GITHUB_ENV"
          echo "${SDKMANAGER_DIR}" >> "$GITHUB_PATH"

          echo
          echo "sdkmanager seleccionado:"
          echo "$SDKMANAGER"

          echo
          echo "Versión:"
          "$SDKMANAGER" --version

      # ============================================================
      # 4. LICENCIAS
      # ============================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ACEPTANDO LICENCIAS ANDROID"
          echo "=============================================="

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Licencias procesadas."

      # ============================================================
      # 5. INSTALAR ANDROID SDK
      # ============================================================

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "INSTALANDO ANDROID SDK"
          echo "=============================================="

          echo "SDKMANAGER=${SDKMANAGER}"
          echo
          echo "Platform:"
          echo "${ANDROID_PLATFORM}"
          echo
          echo "Build Tools:"
          echo "${ANDROID_BUILD_TOOLS}"
          echo
          echo "CMake:"
          echo "${ANDROID_CMAKE_VERSION}"
          echo
          echo "NDK:"
          echo "${ANDROID_NDK_VERSION}"

          echo
          echo "=============================================="
          echo "INSTALANDO PAQUETES"
          echo "=============================================="

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmake;${ANDROID_CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo
          echo "=============================================="
          echo "SDK INSTALADO"
          echo "=============================================="

          echo
          echo "Platforms:"
          ls -la "${ANDROID_HOME}/platforms"

          echo
          echo "Build Tools:"
          ls -la "${ANDROID_HOME}/build-tools"

          echo
          echo "NDK:"
          ls -la "${ANDROID_HOME}/ndk"

          echo
          echo "CMake:"
          ls -la "${ANDROID_HOME}/cmake"

      # ============================================================
      # 6. VERIFICAR TOOLCHAIN
      # ============================================================

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFICANDO TOOLCHAIN"
          echo "=============================================="

          echo
          echo "ADB:"
          "${ANDROID_HOME}/platform-tools/adb" version

          echo
          echo "CMake:"
          "${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}/bin/cmake" \
            --version

          echo
          echo "Ninja:"
          "${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}/bin/ninja" \
            --version

          echo
          echo "NDK:"
          cat \
            "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/source.properties"

          echo
          echo "Platform:"
          ls -la \
            "${ANDROID_HOME}/platforms/${ANDROID_PLATFORM}"

      # ============================================================
      # 7. GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ============================================================
      # 8. VERIFICAR WOWEE
      # ============================================================

      - name: Check WoWee
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "WOWEE"
          echo "=============================================="

          if [ ! -d "wowee" ]; then
            echo "ERROR: No existe wowee/"
            exit 1
          fi

          echo "WoWee encontrado."

          echo
          echo "Submódulos:"
          git submodule status || true

      # ============================================================
      # 9. INSPECCIONAR WOWEE
      # ============================================================

      - name: Inspect WoWee source
        shell: bash
        run: |
          echo "=============================================="
          echo "INSPECCIONANDO WOWEE"
          echo "=============================================="

          find wowee \
            \( -name "*.hpp" -o -name "*.h" -o -name "*.cpp" -o -name "*.cc" \) \
            | sort \
            | head -500

          echo
          echo "AuthHandler:"
          grep -Rni \
            "AuthHandler" \
            wowee \
            --include="*.hpp" \
            --include="*.h" \
            --include="*.cpp" \
            --include="*.cc" \
            | head -100 || true

      # ============================================================
      # 10. SDL3
      # ============================================================

      - name: Checkout SDL3
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          path: sdl3
          fetch-depth: 1

      # ============================================================
      # 11. GLM
      # ============================================================

      - name: Checkout GLM
        uses: actions/checkout@v4
        with:
          repository: g-truc/glm
          path: glm-src
          fetch-depth: 1

      # ============================================================
      # 12. OPENSSL
      # ============================================================

      - name: Prepare OpenSSL
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "OPENSSL"
          echo "=============================================="

          if [ -f "./openssl.zip" ]; then

            rm -rf "${GITHUB_WORKSPACE}/openssl-android"

            mkdir -p \
              "${GITHUB_WORKSPACE}/openssl-android"

            unzip -q \
              "./openssl.zip" \
              -d "${GITHUB_WORKSPACE}/openssl-android"

            echo "OpenSSL extraído correctamente."

          else

            echo "ADVERTENCIA:"
            echo "openssl.zip no existe."

          fi

      # ============================================================
      # 13. NORMALIZAR SDL
      # ============================================================

      - name: Normalize WoWee SDL includes
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "NORMALIZANDO SDL"
          echo "=============================================="

          if [ -d "wowee" ]; then

            grep -RIl \
              --include="*.h" \
              --include="*.hpp" \
              --include="*.c" \
              --include="*.cc" \
              --include="*.cpp" \
              'SDL2/' \
              wowee \
              | while read -r file; do

                echo "Corrigiendo: $file"

                sed -i 's#SDL2/#SDL3/#g' "$file"

              done

          fi

      # ============================================================
      # 14. VALIDAR WOW_INTEGRATION
      # ============================================================

      - name: Validate WoW integration source
        shell: bash
        run: |
          set -e

          FILE="app/src/main/wow_integration.cpp"

          echo "=============================================="
          echo "VALIDANDO WOW INTEGRATION"
          echo "=============================================="

          if [ ! -f "$FILE" ]; then
            echo "ERROR: No existe $FILE"
            exit 1
          fi

          echo
          echo "Archivo:"
          echo "----------------------------------------------"

          nl -ba "$FILE"

          echo "----------------------------------------------"

          echo
          echo "Namespaces corruptos"

          if grep -q "wowee::core::wowee::core" "$FILE"; then
            echo "ERROR: namespace wowee::core duplicado."
            exit 1
          fi

          if grep -q "wowee::network::wowee::network" "$FILE"; then
            echo "ERROR: namespace wowee::network duplicado."
            exit 1
          fi

          if grep -q "g_WoWwowee" "$FILE"; then
            echo "ERROR: g_WoWwowee encontrado."
            exit 1
          fi

          echo "OK."

          echo
          echo "AuthHandler"

          AUTH_DECL_COUNT=$(
            grep -Ec \
              '^[[:space:]]*wowee::auth::AuthHandler[[:space:]]+auth[[:space:]]*;' \
              "$FILE" || true
          )

          echo "Declaraciones encontradas: ${AUTH_DECL_COUNT}"

          if [ "$AUTH_DECL_COUNT" -gt 1 ]; then
            echo "ERROR: AuthHandler duplicado."
            grep -n \
              "wowee::auth::AuthHandler" \
              "$FILE" || true
            exit 1
          fi

          echo "OK."

          echo
          echo "Literales \\\\n"

          if grep -Fq '\n' "$FILE"; then
            echo "ERROR: Literal \n encontrado."

            grep -nF '\n' "$FILE" || true

            exit 1
          fi

          echo "OK."

      # ============================================================
      # 15. CMAKE
      # ============================================================

      - name: Inspect CMake configuration
        shell: bash
        run: |
          echo "=============================================="
          echo "CMAKE"
          echo "=============================================="

          if [ -f "app/src/main/CMakeLists.txt" ]; then
            echo
            echo "app/src/main/CMakeLists.txt"
            echo "----------------------------------------------"
            cat app/src/main/CMakeLists.txt
          fi

          if [ -f "app/CMakeLists.txt" ]; then
            echo
            echo "app/CMakeLists.txt"
            echo "----------------------------------------------"
            cat app/CMakeLists.txt
          fi

      # ============================================================
      # 16. LIMPIAR BUILD
      # ============================================================

      - name: Clean Android build
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LIMPIANDO BUILD"
          echo "=============================================="

          rm -rf app/.cxx
          rm -rf app/build

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 17. CONFIGURAR BUILD NATIVO
      # ============================================================

      - name: Configure native build
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "CONFIGURANDO BUILD NATIVO"
          echo "=============================================="

          if [ ! -f "app/build.gradle" ]; then
            echo "ERROR: No existe app/build.gradle"
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text(encoding="utf-8")

          required = [
              'arguments "-DANDROID_STL=c++_shared"',
              'arguments "-DANDROID_PLATFORM=android-35"',
              'arguments "-DANDROID_ABI=arm64-v8a"',
              'arguments "-DWOWEE_ANDROID=ON"',
              'arguments "-DWOWEE_USE_SDL3=ON"',
          ]

          if "-DWOWEE_ANDROID=ON" not in text:

              marker = "externalNativeBuild {"

              if marker in text:

                  block = "\n".join(
                      "        " + line
                      for line in required
                  )

                  text = text.replace(
                      marker,
                      marker + "\n" + block,
                      1
                  )

          path.write_text(
              text,
              encoding="utf-8"
          )

          PY

          echo
          echo "app/build.gradle:"
          cat app/build.gradle

      # ============================================================
      # 18. BUILD DEBUG
      # ============================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          echo "=============================================="
          echo "COMPILANDO DEBUG APK"
          echo "=============================================="

          echo
          echo "wow_integration.cpp NO será modificado."

          echo
          echo "Fuente final:"
          nl -ba app/src/main/wow_integration.cpp

          echo
          echo "=============================================="
          echo "GRADLE BUILD"
          echo "=============================================="

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # ============================================================
      # 19. BUSCAR APK
      # ============================================================

      - name: Locate APK
        shell: bash
        run: |
          echo "=============================================="
          echo "BUSCANDO APK"
          echo "=============================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            | sort

          APK_COUNT=$(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | wc -l
          )

          echo
          echo "APK encontrados: ${APK_COUNT}"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No se generó ningún APK."
            exit 1
          fi

      # ============================================================
      # 20. SUBIR APK
      # ============================================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wow-mobile-client-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # ============================================================
      # 21. RESUMEN
      # ============================================================

      - name: Build summary
        if: success()
        shell: bash
        run: |
          echo "=============================================="
          echo "BUILD COMPLETADO"
          echo "=============================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;
