name: Build Full WoW Android Engine

on:
  workflow_dispatch: # Permite ejecutar el script con un clic desde la web de GitHub

jobs:
  build-everything:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar el Código de tu Repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 2. Descomprimir StormLib Local y Preparar Estructuras
      run: |
        mkdir -p app-project/jni/src
        mkdir -p app-project/app/libs
        
        # Buscamos tu archivo stormlib.zip en la raíz y lo extraemos en el lugar correcto
        if [ -f "stormlib.zip" ]; then
          unzip stormlib.zip -d temp_stormlib
          # Creamos la carpeta final respetando el nombre exacto usado en CMake
          mkdir -p app-project/jni/stormlib
          mv temp_stormlib/* app-project/jni/stormlib/
          rm -rf temp_stormlib
        else
          echo "ERROR: No se encontró el archivo stormlib.zip en la raíz de tu repositorio"
          exit 1
        fi

        # Movemos tu archivo AAR de SDL3 a la carpeta de librerías de la App de Android
        if [ -f "SDL3-3.4.18.aar" ]; then
          cp SDL3-3.4.18.aar app-project/app/libs/
        else
          echo "ERROR: No se encontró el archivo SDL3-3.4.18.aar en la raíz de tu repositorio"
          exit 1
        fi

    - name: 3. Auto-Generar el Código del Juego (Controles Inteligentes Táctiles SDL3)
      run: |
        cat << 'EOF' > app-project/jni/src/main.cpp
        #include <SDL3/SDL.h>
        #include <SDL3/SDL_main.h>
        #include <string>

        // Estructuras para los controles nativos de Android (Pocos botones)
        struct VirtualJoystick { float x, y, radius; bool active; float dx, dy; };
        struct VirtualButton { float x, y, radius; int actionId; bool pressed; };

        VirtualJoystick movementJoystick = { 250.0f, 800.0f, 90.0f, false, 0.0f, 0.0f };
        VirtualButton actionButtons = {
            { 1650.0f, 800.0f, 80.0f, 1, false }, // Ataque básico / Interacción inteligente
            { 1480.0f, 850.0f, 55.0f, 2, false }, // Habilidad 1 (Smart Targeting automático)
            { 1700.0f, 630.0f, 55.0f, 3, false }  // Habilidad 2 (Smart Targeting automático)
        };

        int main(int argc, char* argv[]) {
            if (!SDL_Init(SDL_INIT_VIDEO)) return -1;

            SDL_Window* window = SDL_CreateWindow("WoW 3.3.5a Android Zero", 1920, 1080, SDL_WINDOW_FULLSCREEN);
            SDL_Renderer* renderer = SDL_CreateRenderer(window, NULL);

            // Ruta en tu celular donde lee la carpeta Data original de PC de forma externa
            std::string externalMpqPath = "/sdcard/Android/data/com.zero.wowmobile/files/Data/";

            bool isRunning = true;
            SDL_Event event;

            while (isRunning) {
                while (SDL_PollEvent(&event)) {
                    if (event.type == SDL_EVENT_QUIT) isRunning = false;

                    if (event.type == SDL_EVENT_FINGER_DOWN || event.type == SDL_EVENT_FINGER_MOTION) {
                        float touchX = event.tfinger.x * 1920;
                        float touchY = event.tfinger.y * 1080;

                        // Lógica del Joystick izquierdo nativo (Movimiento 360)
                        float distJS = (touchX - movementJoystick.x)*(touchX - movementJoystick.x) + (touchY - movementJoystick.y)*(touchY - movementJoystick.y);
                        if (distJS < (movementJoystick.radius * movementJoystick.radius)) {
                            movementJoystick.active = true;
                            movementJoystick.dx = (touchX - movementJoystick.x) / movementJoystick.radius;
                            movementJoystick.dy = (touchY - movementJoystick.y) / movementJoystick.radius;
                        }

                        // Lógica de los botones de acción con auto-apuntado
                        for (int i = 0; i < 3; i++) {
                            float distBtn = (touchX - actionButtons[i].x)*(touchX - actionButtons[i].x) + (touchY - actionButtons[i].y)*(touchY - actionButtons[i].y);
                            if (distBtn < (actionButtons[i].radius * actionButtons[i].radius)) {
                                actionButtons[i].pressed = true;
                            }
                        }
                    }
                    if (event.type == SDL_EVENT_FINGER_UP) {
                        movementJoystick.active = false;
                        movementJoystick.dx = 0; movementJoystick.dy = 0;
                        for (int i = 0; i < 3; i++) actionButtons[i].pressed = false;
                    }
                }

                SDL_SetRenderDrawColor(renderer, 15, 15, 15, 255);
                SDL_RenderClear(renderer);
                SDL_RenderPresent(renderer);
            }

            SDL_DestroyRenderer(renderer);
            SDL_DestroyWindow(window);
            SDL_Quit();
            return 0;
        }
        EOF

    - name: 4. Auto-Generar Enlace de Compilación CMake (Sin compilar SDL desde fuente)
      run: |
        cat << 'EOF' > app-project/jni/CMakeLists.txt
        cmake_minimum_required(VERSION 3.22.1)
        project(WoWAndroidEngine)

        set(CMAKE_CXX_STANDARD 17)

        # Compilar únicamente tu StormLib local descompreso
        add_subdirectory(stormlib)

        find_library(ANDROID_LOG_LIB log)
        find_library(ANDROID_GLES_LIB GLESv3)
        
        # Localizar SDL3 por medio del paquete AAR inyectado por Gradle
        find_package(SDL3 REQUIRED)

        add_library(wow_engine SHARED src/main.cpp)

        target_link_libraries(wow_engine
            SDL3::SDL3
            stormlib
            ${ANDROID_LOG_LIB}
            ${ANDROID_GLES_LIB}
            android
        )
        EOF

    - name: 5. Auto-Generar Entorno Android Gradle y Manifiesto de Permisos
      run: |
        mkdir -p app-project/app/src/main
        
        # Manifiesto de Android con permisos corregidos
        cat << 'EOF' > app-project/app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com" package="com.zero.wowmobile">
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
            <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
            <application android:label="WoW 3.3.5a Android Engine" android:hasCode="true">
                <activity android:name="org.libsdl.app.SDLActivity" android:screenOrientation="landscape" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app-project/build.gradle
        buildscript {
            repositories { google() ; mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
        }
        allprojects { repositories { google() ; mavenCentral() } }
        EOF

        cat << 'EOF' > app-project/app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.zero.wowmobile'
            compileSdk 33
            defaultConfig {
                applicationId "com.zero.wowmobile"
                minSdk 26
                targetSdk 33
                ndk { abiFilters 'arm64-v8a' }
                externalNativeBuild { 
                    cmake { 
                        cppFlags "-std=c++17" 
                        arguments "-DSDL3_DIR=${project.buildDir}/outputs/aar"
                    } 
                }
            }
            externalNativeBuild { cmake { path "../jni/CMakeLists.txt" } }
        }
        dependencies {
            implementation files('libs/SDL3-3.4.18.aar')
        }
        EOF

        echo "include ':app'" > app-project/settings.gradle

    - name: 6. Configurar e Inyectar Gradle 8.2 de forma Segura
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2' # Fuerza el entorno exacto saltándose el Gradle 9 del sistema

    - name: 7. Compilar Todo y Generar APK Ejecutable
      run: |
        cd app-project
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        # Usamos el binario de Gradle inyectado de forma directa
        gradle assembleRelease

    - name: 8. Subir APK a GitHub como archivo de descarga
      uses: actions/upload-artifact@v4
      with:
        name: wow-3.3.5a-android-apk
        path: app-project/app/build/outputs/apk/release/*.apk
