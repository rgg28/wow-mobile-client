name: Android Full Auto-App Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK e instalar NDK
        run: |
          set -uo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | sudo $SDKMANAGER --licenses || echo "⚠️ Alerta en licencias."
          sudo $SDKMANAGER "ndk;25.2.9519653" "platforms;android-33" "build-tools;33.0.2"

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Instalar dependencias del sistema
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev clang lld file

      - name: Extraer y acomodar fuentes de Benilla
        run: |
          set -euo pipefail

          if [ -f benilla.zip ]; then
            mkdir -p /tmp/benilla-source
            python3 -c "import zipfile; zipfile.ZipFile('benilla.zip').extractall('/tmp/benilla-source')"

            ROOT_TOML=$(find /tmp/benilla-source -name Cargo.toml -type f -print -quit)
            if [ -z "$ROOT_TOML" ]; then
              echo "::error::No se encontró Cargo.toml en el ZIP"
              exit 1
            fi
            SOURCE_DIR=$(dirname "$ROOT_TOML")

            if [ -d "$SOURCE_DIR/crates" ] && [ -d "crates" ]; then rm -rf crates; fi
            cp -r "$SOURCE_DIR"/* .
            echo "✅ Fuentes reacomodadas con éxito en la raíz."
          else
            echo "::error::El archivo benilla.zip no fue detectado."
            exit 1
          fi

          if [ -d "crates/benilla-app/src/textInput" ]; then
            mv crates/benilla-app/src/textInput crates/benilla-app/src/textinput
          fi

      - name: Forzar compilación de librería dinámica (.so) de forma segura
        run: |
          set -euo pipefail
          if grep -q "\[lib\]" Cargo.toml; then
            echo "Se detectó la sección [lib] previa. Modificando crate-type..."
            sed -i '/\[lib\]/a crate-type = ["cdylib"]' Cargo.toml
          else
            echo "No se detectó [lib]. Creando sección desde cero..."
            echo "" >> Cargo.toml
            echo "[lib]" >> Cargo.toml
            echo 'crate-type = ["cdylib"]' >> Cargo.toml
            echo 'name = "kira"' >> Cargo.toml
          fi

      - name: Configurar Linkers de Android para Cargo
        run: |
          mkdir -p .cargo
          NDK_TOOLCHAIN="/usr/local/lib/android/sdk/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin"
          
          # Ajustamos las llamadas a los compiladores Clang nativos del NDK de Android
          cat << EOF > .cargo/config.toml
          [target.aarch64-linux-android]
          linker = "$NDK_TOOLCHAIN/aarch64-linux-android33-clang"

          [target.armv7-linux-androideabi]
          linker = "$NDK_TOOLCHAIN/armv7a-linux-androideabi33-clang"
          EOF

      - name: Compilar Motores nativos (.so)
        run: |
          cargo build --release --target aarch64-linux-android
          cargo build --release --target armv7-linux-androideabi

      - name: Crear Proyecto Android Base desde Cero
        run: |
          set -euo pipefail
          mkdir -p my-app/app/src/main/res/values
          mkdir -p my-app/app/src/main/java/com/wow/mobile
          mkdir -p my-app/app/src/main/jniLibs/arm64-v8a
          mkdir -p my-app/app/src/main/jniLibs/armeabi-v7a

          echo "buildscript {" > my-app/build.gradle
          echo "    repositories { google(); mavenCentral() }" >> my-app/build.gradle
          echo "    dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }" >> my-app/build.gradle
          echo "}" >> my-app/build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> my-app/build.gradle

          echo "include ':app'" > my-app/settings.gradle

          echo "plugins { id 'com.android.application' }" > my-app/app/build.gradle
          echo "android {" >> my-app/app/build.gradle
          echo "    namespace 'com.wow.mobile'" >> my-app/app/build.gradle
          echo "    compileSdk 33" >> my-app/app/build.gradle
          echo "    defaultConfig {" >> my-app/app/build.gradle
          echo "        applicationId 'com.wow.mobile'" >> my-app/app/build.gradle
          echo "        minSdk 21" >> my-app/app/build.gradle
          echo "        targetSdk 33" >> my-app/app/build.gradle
          echo "        versionCode 1" >> my-app/app/build.gradle
          echo "        versionName '1.0'" >> my-app/app/build.gradle
          echo "    }" >> my-app/app/build.gradle
          echo "}" >> my-app/app/build.gradle

          cat << 'EOF' > my-app/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://android.com">
              <application android:label="WoW Mobile Client" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name="com.wow.mobile.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > my-app/app/src/main/java/com/wow/mobile/MainActivity.java
          package com.wow.mobile;
          import android.app.Activity;
          import android.os.Bundle;

          public class MainActivity extends Activity {
              static {
                  System.loadLibrary("kira");
              }
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

          echo '<resources><string name="app_name">WoW Mobile</string></resources>' > my-app/app/src/main/res/values/strings.xml

          find target/aarch64-linux-android/release/ -maxdepth 1 -name "*.so" -exec cp {} my-app/app/src/main/jniLibs/arm64-v8a/ \;
          find target/armv7-linux-androideabi/release/ -maxdepth 1 -name "*.so" -exec cp {} my-app/app/src/main/jniLibs/armeabi-v7a/ \;
          echo "✅ Entorno de la aplicación Android andamiaje completado."

      - name: Descargar e Inicializar Wrapper de Gradle
        run: |
          set -euo pipefail
          cd my-app
          gradle wrapper --gradle-version 7.5

      - name: Compilar Aplicación (Generar APK)
        run: |
          set -euo pipefail
          cd my-app
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK Final para Jugar
        uses: actions/upload-artifact@v4
        with:
          name: wow-mobile-launcher
          path: my-app/app/build/outputs/apk/debug/*.apk
