name: Build WoW Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_PLATFORM: android-35
      ANDROID_BUILD_TOOLS: 35.0.0
      ANDROID_CMAKE_VERSION: 3.31.6
      ANDROID_NDK_VERSION: 28.2.13676358
      JAVA_VERSION: "17"
      GRADLE_VERSION: "8.9"

    steps:

      # ============================================================
      # 1. MAIN REPOSITORY
      # ============================================================

      - name: Checkout wow-mobile-client
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # 2. WOWEE
      # ============================================================

      - name: Checkout WoWee
        uses: actions/checkout@v4
        with:
          repository: Kelsidavis/WoWee
          path: wowee
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # 3. VERIFY REPOSITORIES
      # ============================================================

      - name: Verify repositories
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "REPOSITORIES"
          echo "=============================================="

          pwd

          test -d app
          test -d wowee
          test -d wowee/include
          test -d wowee/src

          echo "Main repository OK."
          echo "WoWee repository OK."

      # ============================================================
      # 4. JAVA
      # ============================================================

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # 5. ANDROID SDK
      # ============================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" \
              -type f \
              -name sdkmanager \
              | sort \
              | tail -1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager no encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmake;${ANDROID_CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      # ============================================================
      # 6. VERIFY ANDROID
      # ============================================================

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -e

          test -d "${ANDROID_HOME}/platforms/${ANDROID_PLATFORM}"
          test -d "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}"
          test -d "${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}"
          test -d "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"

          "${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}/bin/cmake" --version

          "${ANDROID_HOME}/platform-tools/adb" version

      # ============================================================
      # 7. SDL3
      # ============================================================

      - name: Checkout SDL3
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          path: sdl3
          fetch-depth: 1

      # ============================================================
      # 8. GLM
      # ============================================================

      - name: Checkout GLM
        uses: actions/checkout@v4
        with:
          repository: g-truc/glm
          path: glm-src
          fetch-depth: 1

      # ============================================================
      # 9. OPENSSL
      # ============================================================

      - name: Extract and configure OpenSSL
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "OPENSSL"
          echo "=============================================="

          test -f openssl.zip

          rm -rf openssl-android

          mkdir -p openssl-android

          unzip -q openssl.zip -d openssl-android

          echo
          echo "Buscando openssl/bn.h..."

          BN_HEADER="$(
            find openssl-android \
              -type f \
              -path '*/openssl/bn.h' \
              -print \
              -quit
          )"

          if [ -z "$BN_HEADER" ]; then

            echo
            echo "ERROR: openssl/bn.h no existe dentro de openssl.zip"

            echo
            echo "Archivos relacionados encontrados:"

            find openssl-android \
              -type f \
              \( \
                -name "bn.h" \
                -o -name "libcrypto.so" \
                -o -name "libssl.so" \
              \) \
              -print

            exit 1
          fi

          echo
          echo "bn.h:"
          echo "$BN_HEADER"

          OPENSSL_INCLUDE_DIR="$(
            dirname "$(dirname "$BN_HEADER")"
          )"

          echo
          echo "OPENSSL_INCLUDE_DIR:"
          echo "$OPENSSL_INCLUDE_DIR"

          test -f "${OPENSSL_INCLUDE_DIR}/openssl/bn.h"

          CRYPTO_LIB="$(
            find openssl-android \
              -type f \
              -name 'libcrypto.so' \
              -print \
              -quit
          )"

          SSL_LIB="$(
            find openssl-android \
              -type f \
              -name 'libssl.so' \
              -print \
              -quit
          )"

          if [ -z "$CRYPTO_LIB" ]; then
            echo "ERROR: libcrypto.so no encontrado."
            exit 1
          fi

          if [ -z "$SSL_LIB" ]; then
            echo "ERROR: libssl.so no encontrado."
            exit 1
          fi

          echo
          echo "libcrypto:"
          echo "$CRYPTO_LIB"

          echo
          echo "libssl:"
          echo "$SSL_LIB"

          CRYPTO_ABS="${GITHUB_WORKSPACE}/${CRYPTO_LIB}"
          SSL_ABS="${GITHUB_WORKSPACE}/${SSL_LIB}"

          echo
          echo "Variables CMake:"

          echo "OPENSSL_INCLUDE_DIR=${OPENSSL_INCLUDE_DIR}"
          echo "OPENSSL_CRYPTO_LIBRARY=${CRYPTO_ABS}"
          echo "OPENSSL_SSL_LIBRARY=${SSL_ABS}"

          {
            echo "OPENSSL_INCLUDE_DIR=${OPENSSL_INCLUDE_DIR}"
            echo "OPENSSL_CRYPTO_LIBRARY=${CRYPTO_ABS}"
            echo "OPENSSL_SSL_LIBRARY=${SSL_ABS}"
          } >> "$GITHUB_ENV"

      # ============================================================
      # 10. VERIFY OPENSSL
      # ============================================================

      - name: Verify OpenSSL configuration
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY OPENSSL"
          echo "=============================================="

          echo "OPENSSL_INCLUDE_DIR=$OPENSSL_INCLUDE_DIR"
          echo "OPENSSL_CRYPTO_LIBRARY=$OPENSSL_CRYPTO_LIBRARY"
          echo "OPENSSL_SSL_LIBRARY=$OPENSSL_SSL_LIBRARY"

          echo
          echo "Header:"
          ls -l "${OPENSSL_INCLUDE_DIR}/openssl/bn.h"

          echo
          echo "Crypto:"
          ls -l "$OPENSSL_CRYPTO_LIBRARY"

          echo
          echo "SSL:"
          ls -l "$OPENSSL_SSL_LIBRARY"

      # ============================================================
      # 11. VERIFY WOWEE
      # ============================================================

      - name: Verify WoWee sources
        shell: bash
        run: |
          set -e

          REQUIRED_FILES=(

            "wowee/include/core/application.hpp"
            "wowee/include/network/world_socket.hpp"
            "wowee/include/auth/auth_handler.hpp"

            "wowee/src/auth/auth_handler.cpp"
            "wowee/src/auth/auth_opcodes.cpp"
            "wowee/src/auth/auth_packets.cpp"
            "wowee/src/auth/big_num.cpp"
            "wowee/src/auth/crypto.cpp"
            "wowee/src/auth/srp.cpp"
            "wowee/src/auth/vanilla_crypt.cpp"

            "wowee/src/network/packet.cpp"
            "wowee/src/network/socket.cpp"
            "wowee/src/network/tcp_socket.cpp"
            "wowee/src/network/world_socket.cpp"

            "wowee/src/game/opcodes.cpp"
            "wowee/src/game/opcode_table.cpp"
            "wowee/src/game/game_handler_packets.cpp"

            "wowee/src/core/window.cpp"
            "wowee/src/core/application.cpp"
            "wowee/src/core/app_clock.cpp"
            "wowee/src/core/input.cpp"
            "wowee/src/core/logger.cpp"

            "wowee/src/rendering/renderer.cpp"
            "wowee/src/rendering/render_graph.cpp"
            "wowee/src/rendering/vk_context.cpp"
            "wowee/src/rendering/vk_pipeline.cpp"
            "wowee/src/rendering/vk_buffer.cpp"
            "wowee/src/rendering/vk_shader.cpp"
            "wowee/src/rendering/vk_texture.cpp"
            "wowee/src/rendering/vk_utils.cpp"

            "wowee/extern/imgui/imgui.cpp"
            "wowee/extern/imgui/imgui_draw.cpp"
            "wowee/extern/imgui/imgui_tables.cpp"
            "wowee/extern/imgui/imgui_widgets.cpp"

            "wowee/extern/imgui/backends/imgui_impl_sdl3.cpp"
            "wowee/extern/imgui/backends/imgui_impl_vulkan.cpp"

            "wowee/extern/vk-bootstrap/src/VkBootstrap.cpp"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do

            if [ ! -f "$FILE" ]; then
              echo
              echo "ERROR: falta:"
              echo "$FILE"
              exit 1
            fi

          done

          echo "Todos los archivos WoWee requeridos existen."

      # ============================================================
      # 12. VERIFY CMAKE
      # ============================================================

      - name: Verify Android CMake
        shell: bash
        run: |
          set -e

          CMAKE_FILE="app/src/main/CMakeLists.txt"

          test -f "$CMAKE_FILE"

          grep -q 'wowee/src/auth/big_num.cpp' "$CMAKE_FILE"
          grep -q 'wowee/src/auth/auth_handler.cpp' "$CMAKE_FILE"
          grep -q 'wowee/src/network/world_socket.cpp' "$CMAKE_FILE"
          grep -q 'wowee/src/core/application.cpp' "$CMAKE_FILE"
          grep -q 'wowee/src/rendering/renderer.cpp' "$CMAKE_FILE"

          echo "Android CMake OK."

      # ============================================================
      # 13. VERIFY INTEGRATION
      # ============================================================

      - name: Validate WoW integration
        shell: bash
        run: |
          set -e

          FILE="app/src/main/wow_integration.cpp"

          test -f "$FILE"

          if grep -q 'g_WoWwowee' "$FILE"; then
            echo "ERROR: g_WoWwowee encontrado."
            exit 1
          fi

          if grep -q 'wowee::core::wowee::core' "$FILE"; then
            echo "ERROR: namespace duplicado."
            exit 1
          fi

          if grep -q 'wowee::network::wowee::network' "$FILE"; then
            echo "ERROR: namespace duplicado."
            exit 1
          fi

          echo "wow_integration.cpp OK."

      # ============================================================
      # 14. GRADLE
      # ============================================================

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e

          GRADLE_ROOT="${RUNNER_TEMP}/gradle-${GRADLE_VERSION}"

          if [ ! -x "${GRADLE_ROOT}/bin/gradle" ]; then

            cd "${RUNNER_TEMP}"

            wget -q \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -O gradle.zip

            rm -rf "$GRADLE_ROOT"

            unzip -q gradle.zip \
              -d "${RUNNER_TEMP}"

          fi

          echo "${GRADLE_ROOT}/bin" >> "$GITHUB_PATH"

          "${GRADLE_ROOT}/bin/gradle" --version

      # ============================================================
      # 15. VERIFY GRADLE PROJECT
      # ============================================================

      - name: Verify Gradle project
        shell: bash
        run: |
          set -e

          if [ -f settings.gradle ]; then
            echo "settings.gradle encontrado."
          elif [ -f settings.gradle.kts ]; then
            echo "settings.gradle.kts encontrado."
          else
            echo "ERROR: falta settings.gradle/settings.gradle.kts."
            exit 1
          fi

          if [ -f app/build.gradle ]; then
            echo "app/build.gradle encontrado."
          elif [ -f app/build.gradle.kts ]; then
            echo "app/build.gradle.kts encontrado."
          else
            echo "ERROR: falta app/build.gradle."
            exit 1
          fi

          gradle --version

      # ============================================================
      # 16. CLEAN
      # ============================================================

      - name: Clean native build
        shell: bash
        run: |
          set -e

          rm -rf app/.cxx
          rm -rf app/build

          gradle clean --no-daemon

      # ============================================================
      # 17. SHOW CMAKE
      # ============================================================

      - name: Show build configuration
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "BUILD.GRADLE"
          echo "=============================================="

          if [ -f app/build.gradle ]; then
            sed -n '1,360p' app/build.gradle
          else
            sed -n '1,360p' app/build.gradle.kts
          fi

          echo
          echo "=============================================="
          echo "CMAKE"
          echo "=============================================="

          sed -n '1,500p' app/src/main/CMakeLists.txt

      # ============================================================
      # 18. BUILD APK
      # ============================================================

      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "BUILD WOW MOBILE"
          echo "=============================================="

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # ============================================================
      # 19. FIND APK
      # ============================================================

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "APK OUTPUT"
          echo "=============================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK="$(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: no se genero ningun APK."
            exit 1
          fi

          echo
          echo "APK generado:"
          echo "$APK"

      # ============================================================
      # 20. UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wow-mobile-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
