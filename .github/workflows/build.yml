name: Compilar WoW Android

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:

  build:
    name: Build WoW Android
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. DESCARGAR REPOSITORIO
      # ============================================================

      - name: Descargar codigo fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. .NET 8
      # ============================================================

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"


      # ============================================================
      # 4. PREPARAR ANDROID SDK
      # ============================================================

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"

          echo "=========================================="
          echo " ANDROID SDK"
          echo "=========================================="

          echo
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "Contenido del Android SDK:"

          ls -la "$ANDROID_HOME"

          echo
          echo "Buscando sdkmanager..."

          SDKMANAGER=""

          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          elif [ -f "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"

          elif [ -f "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"

          else
            SDKMANAGER="$(find "$ANDROID_HOME" \
              -type f \
              -name "sdkmanager" \
              -print \
              -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo
            echo "ERROR: No se encontro sdkmanager."
            exit 1
          fi

          echo
          echo "sdkmanager encontrado:"
          echo "$SDKMANAGER"

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"

          echo
          echo "Agregando sdkmanager al PATH..."

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

          export PATH="$SDKMANAGER_DIR:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH"

          echo
          echo "Version de sdkmanager:"

          "$SDKMANAGER" --version

          echo
          echo "Aceptando licencias..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo
          echo "Instalando componentes necesarios..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo
          echo "=========================================="
          echo " VERIFICANDO ANDROID SDK"
          echo "=========================================="

          echo
          echo "Platform Tools:"

          test -f "$ANDROID_HOME/platform-tools/adb"

          echo "OK"

          echo
          echo "Android Platform 34:"

          test -d "$ANDROID_HOME/platforms/android-34"

          echo "OK"

          echo
          echo "Build Tools 34.0.0:"

          test -f "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -f "$ANDROID_HOME/build-tools/34.0.0/zipalign"

          echo "OK"

          echo
          echo "Android SDK preparado correctamente."


      # ============================================================
      # 5. VERIFICAR GODOT MONO
      # ============================================================

      - name: Verificar Godot Mono
        shell: bash
        run: |
          set -e

          GODOT="./Godot_v4.2.1-stable_mono_linux.x86_64"
          TEMPLATES="./Godot_v4.2.1-stable_mono_export_templates.tpz"
          GODOTSHARP="./GodotSharp"

          echo "=========================================="
          echo " GODOT MONO"
          echo "=========================================="

          echo
          echo "Verificando ejecutable Godot..."

          test -f "$GODOT"

          echo "Godot encontrado."

          echo
          echo "Verificando templates..."

          test -f "$TEMPLATES"

          echo "Templates encontrados."

          echo
          echo "Verificando GodotSharp..."

          test -d "$GODOTSHARP"

          echo "GodotSharp encontrado."

          echo
          echo "Permiso del ejecutable Godot..."

          chmod +x "$GODOT"

          echo
          echo "Version Godot:"

          "$GODOT" --version

          echo
          echo "Archivos:"

          ls -lh "$GODOT"
          ls -lh "$TEMPLATES"


      # ============================================================
      # 6. INSTALAR TEMPLATES MONO
      # ============================================================

      - name: Instalar templates Mono
        shell: bash
        run: |
          set -e

          GODOT_TEMPLATES="$HOME/.local/share/godot/export_templates/4.2.1.stable.mono"

          echo "=========================================="
          echo " TEMPLATES MONO"
          echo "=========================================="

          echo
          echo "Limpiando directorio anterior..."

          rm -rf "$GODOT_TEMPLATES"

          mkdir -p "$GODOT_TEMPLATES"

          echo
          echo "Extrayendo templates..."

          unzip -q \
            "./Godot_v4.2.1-stable_mono_export_templates.tpz" \
            -d "$GODOT_TEMPLATES"

          echo
          echo "Contenido extraido:"

          find "$GODOT_TEMPLATES" \
            -maxdepth 4 \
            -type f \
            -print

          if [ -d "$GODOT_TEMPLATES/templates" ]; then

            echo
            echo "Moviendo contenido de templates/..."

            cp -a \
              "$GODOT_TEMPLATES/templates/." \
              "$GODOT_TEMPLATES/"

            rm -rf "$GODOT_TEMPLATES/templates"

          fi

          echo
          echo "Templates finales:"

          find "$GODOT_TEMPLATES" \
            -maxdepth 2 \
            -type f \
            -print

          echo
          echo "Verificando Android Debug..."

          test -f "$GODOT_TEMPLATES/android_debug.apk"

          echo "Android Debug OK."

          echo
          echo "Verificando Android Release..."

          test -f "$GODOT_TEMPLATES/android_release.apk"

          echo "Android Release OK."

          echo
          echo "=========================================="
          echo " TEMPLATES ANDROID MONO OK"
          echo "=========================================="

          ls -lh "$GODOT_TEMPLATES/android_debug.apk"
          ls -lh "$GODOT_TEMPLATES/android_release.apk"


      # ============================================================
      # 7. VERIFICAR PROYECTO
      # ============================================================

      - name: Verificar proyecto Godot
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " PROYECTO GODOT"
          echo "=========================================="

          test -f "project.godot"
          test -f "export_presets.cfg"
          test -f "WoW Android Client.csproj"

          echo
          echo "project.godot OK"
          echo "export_presets.cfg OK"
          echo "WoW Android Client.csproj OK"

          echo
          echo "Archivos C#:"

          find . \
            -maxdepth 3 \
            -type f \
            -name "*.cs" \
            -print | sort


      # ============================================================
      # 8. RESTORE
      # ============================================================

      - name: Restaurar proyecto C#
        shell: bash
        run: |
          set -e

          dotnet restore \
            "WoW Android Client.csproj"


      # ============================================================
      # 9. BUILD DEBUG
      # ============================================================

      - name: Compilar C# Debug
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " BUILD DEBUG"
          echo "=========================================="

          dotnet build \
            "WoW Android Client.csproj" \
            -c Debug \
            --no-restore


      # ============================================================
      # 10. BUILD RELEASE
      # ============================================================

      - name: Compilar C# Release
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " BUILD RELEASE"
          echo "=========================================="

          dotnet build \
            "WoW Android Client.csproj" \
            -c Release \
            --no-restore


      # ============================================================
      # 11. VERIFICAR DLL
      # ============================================================

      - name: Verificar assemblies C#
        shell: bash
        run: |
          set -e

          DEBUG_DLL=".godot/mono/temp/bin/Debug/WoW Android Client.dll"
          RELEASE_DLL=".godot/mono/temp/bin/Release/WoW Android Client.dll"

          echo "Verificando Debug..."

          test -f "$DEBUG_DLL"

          ls -lh "$DEBUG_DLL"

          echo
          echo "Verificando Release..."

          test -f "$RELEASE_DLL"

          ls -lh "$RELEASE_DLL"

          echo
          echo "DLL Debug + Release OK."


      # ============================================================
      # 12. GENERAR SOLUTION
      # ============================================================

      - name: Generar solution Godot
        shell: bash
        run: |
          set -e

          ./Godot_v4.2.1-stable_mono_linux.x86_64 \
            --headless \
            --path . \
            --editor \
            --build-solutions \
            --quit \
            --verbose


      # ============================================================
      # 13. VALIDAR GODOT
      # ============================================================

      - name: Validar proyecto Godot
        shell: bash
        run: |
          set -e

          ./Godot_v4.2.1-stable_mono_linux.x86_64 \
            --headless \
            --path . \
            --editor \
            --quit \
            --verbose


      # ============================================================
      # 14. VERIFICAR PRESET ANDROID
      # ============================================================

      - name: Verificar preset Android
        shell: bash
        run: |
          set -e

          echo "Buscando preset Android..."

          grep -q 'name="Android"' export_presets.cfg

          echo "Preset Android encontrado."


      # ============================================================
      # 15. CREAR KEYSTORE
      # ============================================================

      - name: Crear keystore temporal
        shell: bash
        run: |
          set -e

          mkdir -p .keys

          keytool \
            -genkeypair \
            -v \
            -keystore ".keys/signingKey.jks" \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass androidpassword \
            -keypass androidpassword \
            -dname "CN=WoW Android, OU=Mobile, O=WoW, L=Argentina, ST=Tucuman, C=AR"

          test -f ".keys/signingKey.jks"

          echo
          echo "Keystore creado correctamente."

          ls -lh ".keys/signingKey.jks"


      # ============================================================
      # 16. PREPARAR BUILD
      # ============================================================

      - name: Preparar directorio build
        shell: bash
        run: |
          set -e

          rm -rf build
          mkdir -p build

          echo "Directorio build preparado."


      # ============================================================
      # 17. EXPORT DEBUG
      # ============================================================

      - name: Exportar APK Debug
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " EXPORT DEBUG APK"
          echo "=========================================="

          ./Godot_v4.2.1-stable_mono_linux.x86_64 \
            --headless \
            --path . \
            --export-debug \
            "Android" \
            "build/WoW-debug.apk"

          test -f "build/WoW-debug.apk"

          echo
          echo "APK Debug generado:"

          ls -lh "build/WoW-debug.apk"


      # ============================================================
      # 18. EXPORT RELEASE
      # ============================================================

      - name: Exportar APK Release
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " EXPORT RELEASE APK"
          echo "=========================================="

          ./Godot_v4.2.1-stable_mono_linux.x86_64 \
            --headless \
            --path . \
            --export-release \
            "Android" \
            "build/WoW-release.apk"

          test -f "build/WoW-release.apk"

          echo
          echo "APK Release generado:"

          ls -lh "build/WoW-release.apk"


      # ============================================================
      # 19. VERIFICAR HERRAMIENTAS DE FIRMA
      # ============================================================

      - name: Verificar herramientas Android
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          test -f "$BUILD_TOOLS/apksigner"
          test -f "$BUILD_TOOLS/zipalign"

          echo "apksigner encontrado."
          echo "zipalign encontrado."

          echo
          echo "Version apksigner:"

          "$BUILD_TOOLS/apksigner" version


      # ============================================================
      # 20. ZIPALIGN DEBUG
      # ============================================================

      - name: Alinear APK Debug
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/zipalign" \
            -f \
            4 \
            "build/WoW-debug.apk" \
            "build/WoW-debug-aligned.apk"

          test -f "build/WoW-debug-aligned.apk"


      # ============================================================
      # 21. FIRMAR DEBUG
      # ============================================================

      - name: Firmar APK Debug
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/apksigner" sign \
            --ks ".keys/signingKey.jks" \
            --ks-key-alias android \
            --ks-pass pass:androidpassword \
            --key-pass pass:androidpassword \
            --out "build/WoW-debug-signed.apk" \
            "build/WoW-debug-aligned.apk"

          test -f "build/WoW-debug-signed.apk"

          echo
          echo "APK Debug firmado:"

          ls -lh "build/WoW-debug-signed.apk"


      # ============================================================
      # 22. ZIPALIGN RELEASE
      # ============================================================

      - name: Alinear APK Release
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/zipalign" \
            -f \
            4 \
            "build/WoW-release.apk" \
            "build/WoW-release-aligned.apk"

          test -f "build/WoW-release-aligned.apk"


      # ============================================================
      # 23. FIRMAR RELEASE
      # ============================================================

      - name: Firmar APK Release
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/apksigner" sign \
            --ks ".keys/signingKey.jks" \
            --ks-key-alias android \
            --ks-pass pass:androidpassword \
            --key-pass pass:androidpassword \
            --out "build/WoW-release-signed.apk" \
            "build/WoW-release-aligned.apk"

          test -f "build/WoW-release-signed.apk"

          echo
          echo "APK Release firmado:"

          ls -lh "build/WoW-release-signed.apk"


      # ============================================================
      # 24. VERIFICAR FIRMA DEBUG
      # ============================================================

      - name: Verificar firma Debug
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "build/WoW-debug-signed.apk"

          echo
          echo "Firma Debug valida."


      # ============================================================
      # 25. VERIFICAR FIRMA RELEASE
      # ============================================================

      - name: Verificar firma Release
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "build/WoW-release-signed.apk"

          echo
          echo "Firma Release valida."


      # ============================================================
      # 26. MOSTRAR RESULTADO
      # ============================================================

      - name: Mostrar APK finales
        shell: bash
        run: |
          set -e

          echo
          echo "=========================================="
          echo " BUILD COMPLETADO"
          echo "=========================================="

          echo
          echo "DEBUG:"

          ls -lh \
            "build/WoW-debug-signed.apk"

          echo
          echo "RELEASE:"

          ls -lh \
            "build/WoW-release-signed.apk"

          echo
          echo "Todos los archivos:"

          find build \
            -maxdepth 1 \
            -type f \
            -printf "%f - %s bytes\n" \
            | sort


      # ============================================================
      # 27. SUBIR DEBUG
      # ============================================================

      - name: Subir APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Android-Debug
          path: build/WoW-debug-signed.apk
          if-no-files-found: error


      # ============================================================
      # 28. SUBIR RELEASE
      # ============================================================

      - name: Subir APK Release
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Android-Release
          path: build/WoW-release-signed.apk
          if-no-files-found: error
