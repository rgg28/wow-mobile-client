name: Build WoW Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Nuestro proyecto
      # ============================================================

      - name: Checkout WoW Mobile
        uses: actions/checkout@v4


      # ============================================================
      # 2. WoWee
      # ============================================================

      - name: Checkout WoWee
        uses: actions/checkout@v4
        with:
          repository: Kelsidavis/WoWee
          path: wowee
          submodules: recursive
          fetch-depth: 0


      # ============================================================
      # 3. Java 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ============================================================
      # 4. Android SDK
      #
      # El runner de GitHub ya contiene Android SDK.
      # No usamos android-actions/setup-android.
      # ============================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          yes | sdkmanager --licenses >/dev/null || true


      # ============================================================
      # 5. Instalar exactamente las herramientas necesarias
      # ============================================================

      - name: Install Android build tools
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.31.6" \
            "ndk;28.2.13676358"


      # ============================================================
      # 6. Verificar NDK
      # ============================================================

      - name: Verify Android toolchain
        shell: bash
        run: |
          echo "=========================================="
          echo "ANDROID_HOME"
          echo "$ANDROID_HOME"
          echo "=========================================="

          echo "Installed NDK:"
          ls -la "$ANDROID_HOME/ndk"

          echo "Installed CMake:"
          ls -la "$ANDROID_HOME/cmake"

          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          test -d "$ANDROID_HOME/cmake/3.31.6"


      # ============================================================
      # 7. Preparar submódulos WoWee
      # ============================================================

      - name: Prepare WoWee
        working-directory: wowee
        shell: bash
        run: |
          git submodule update --init --recursive

          echo "WoWee commit:"
          git rev-parse HEAD

          echo "WoWee directories:"
          find . -maxdepth 2 -type d | sort | head -100


      # ============================================================
      # 8. Comprobar archivos fundamentales
      # ============================================================

      - name: Check WoWee
        shell: bash
        run: |
          test -f wowee/CMakeLists.txt
          test -d wowee/src

          echo "WoWee CMake:"
          ls -lh wowee/CMakeLists.txt

          echo "WoWee source:"
          find wowee/src -type f | head -100


      # ============================================================
      # 9. Permisos Gradle
      # ============================================================

      - name: Prepare Gradle
        shell: bash
        run: |
          chmod +x ./gradlew


      # ============================================================
      # 10. Limpiar
      # ============================================================

      - name: Clean project
        shell: bash
        run: |
          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 11. Compilar APK
      # ============================================================

      - name: Build Debug APK
        shell: bash
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info


      # ============================================================
      # 12. Mostrar APK
      # ============================================================

      - name: Locate APK
        shell: bash
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # ============================================================
      # 13. Subir APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wowmobile-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
