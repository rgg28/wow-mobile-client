name: Compilar WoW Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: Build WoW Android
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. DESCARGAR EL REPOSITORIO
      # ============================================================
      - name: Descargar codigo fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. .NET 8
      # ============================================================
      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Preparar Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo
          echo "Android SDK instalado:"
          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-34|build-tools;34.0.0" || true

      # ============================================================
      # 5. VERIFICAR GODOT INCLUIDO EN EL REPOSITORIO
      # ============================================================
      - name: Verificar Godot Mono incluido
        shell: bash
        run: |
          set -e

          GODOT="./Godot_v4.2.1-stable_mono_linux.x86_64"
          TEMPLATES="./Godot_v4.2.1-stable_mono_export_templates.tpz"
          GODOTSHARP="./GodotSharp"

          echo "Buscando Godot..."
          test -f "$GODOT"

          echo "Buscando templates..."
          test -f "$TEMPLATES"

          echo "Buscando GodotSharp..."
          test -d "$GODOTSHARP"

          chmod +x "$GODOT"

          echo
          echo "Godot:"
          ls -lh "$GODOT"

          echo
          echo "Templates:"
          ls -lh "$TEMPLATES"

          echo
          echo "GodotSharp:"
          find "$GODOTSHARP" -maxdepth 2 -type f | head -50

          echo
          echo "Version de Godot:"
          "$GODOT" --version

      # ============================================================
      # 6. INSTALAR TEMPLATES MONO
      # ============================================================
      - name: Instalar templates Mono
        shell: bash
        run: |
          set -e

          GODOT_TEMPLATES="$HOME/.local/share/godot/export_templates/4.2.1.stable.mono"

          echo "Limpiando templates anteriores..."
          rm -rf "$GODOT_TEMPLATES"

          mkdir -p "$GODOT_TEMPLATES"

          echo
          echo "Extrayendo templates..."

          unzip -q \
            "./Godot_v4.2.1-stable_mono_export_templates.tpz" \
            -d "$GODOT_TEMPLATES"

          echo
          echo "Contenido extraido:"
          find "$GODOT_TEMPLATES" -maxdepth 3 -type f -print

          # El .tpz normalmente contiene una carpeta "templates".
          # Copiamos su contenido al directorio que Godot espera.
          if [ -d "$GODOT_TEMPLATES/templates" ]; then

            echo
            echo "Moviendo templates al directorio de Godot..."

            cp -a \
              "$GODOT_TEMPLATES/templates/." \
              "$GODOT_TEMPLATES/"

            rm -rf "$GODOT_TEMPLATES/templates"

          fi

          echo
          echo "Templates finales:"
          find "$GODOT_TEMPLATES" -maxdepth 2 -type f -print

          # ========================================================
          # VERIFICAR ANDROID DEBUG
          # ========================================================

          echo
          echo "Verificando Android Debug..."

          test -f "$GODOT_TEMPLATES/android_debug.apk"

          echo "Android Debug OK."

          # ========================================================
          # VERIFICAR ANDROID RELEASE
          # ========================================================

          echo
          echo "Verificando Android Release..."

          test -f "$GODOT_TEMPLATES/android_release.apk"

          echo "Android Release OK."

          echo
          echo "=========================================="
          echo " TEMPLATES ANDROID MONO OK"
          echo "=========================================="

          ls -lh "$GODOT_TEMPLATES/android_debug.apk"
          ls -lh "$GODOT_TEMPLATES/android_release.apk"

      # ============================================================
      # 7. MOSTRAR ESTRUCTURA DEL PROYECTO
      # ============================================================
      - name: Verificar proyecto Godot
        shell: bash
        run: |
          set -e

          echo "Directorio actual:"
          pwd

          echo
          echo "Archivos principales:"

          find . \
            -maxdepth 2 \
            -type f \
            \( \
              -name "project.godot" \
              -o -name "export_presets.cfg" \
              -o -name "*.csproj" \
              -o -name "*.cs" \
            \) \
            -print | sort

          echo
          echo "Verificando archivos obligatorios..."

          test -f "project.godot"
          test -f "export_presets.cfg"
          test -f "WoW Android Client.csproj"

          echo "Proyecto encontrado correctamente."

      # ============================================================
      # 8. RESTORE .NET
      # ============================================================
      - name: Restaurar proyecto C#
        shell: bash
        run: |
          set -e

          dotnet restore "WoW Android Client.csproj"

      # ============================================================
      # 9. COMPILAR DEBUG
      # ============================================================
      - name: Compilar C# Debug
        shell: bash
        run: |
          set -e

          dotnet build \
            "WoW Android Client.csproj" \
            -c Debug \
            --no-restore

      # ============================================================
      # 10. COMPILAR RELEASE
      # ============================================================
      - name: Compilar C# Release
        shell: bash
        run: |
          set -e

          dotnet build \
            "WoW Android Client.csproj" \
            -c Release \
            --no-restore

      # ============================================================
      # 11. VERIFICAR DLL DEBUG + RELEASE
      # ============================================================
      - name: Verificar assemblies C#
        shell: bash
        run: |
          set -e

          DEBUG_DLL=".godot/mono/temp/bin/Debug/WoW Android Client.dll"
          RELEASE_DLL=".godot/mono/temp/bin/Release/WoW Android Client.dll"

          echo "Buscando assembly Debug..."
          test -f "$DEBUG_DLL"

          echo "Debug OK:"
          ls -lh "$DEBUG_DLL"

          echo
          echo "Buscando assembly Release..."
          test -f "$RELEASE_DLL"

          echo "Release OK:"
          ls -lh "$RELEASE_DLL"

      # ============================================================
      # 12. GENERAR SOLUTION GODOT
      # ============================================================
      - name: Generar solution de Godot
        shell: bash
        run: |
          set -e

          ./Godot_v4.2.1-stable_mono_linux.x86_64 \
            --headless \
            --path . \
            --editor \
            --quit \
            --build-solutions \
            --verbose

      # ============================================================
      # 13. VALIDAR PROYECTO
      # ============================================================
      - name: Validar proyecto Godot
        shell: bash
        run: |
          set -e

          ./Godot_v4.2.1-stable_mono_linux.x86_64 \
            --headless \
            --path . \
            --editor \
            --quit \
            --verbose

      # ============================================================
      # 14. VERIFICAR PRESET ANDROID
      # ============================================================
      - name: Verificar preset Android
        shell: bash
        run: |
          set -e

          echo "Buscando preset Android..."

          grep -n 'name="Android"' export_presets.cfg || {
            echo "ERROR: No existe el preset Android."
            exit 1
          }

          echo
          echo "Preset Android encontrado."

      # ============================================================
      # 15. CREAR KEYSTORE TEMPORAL
      # ============================================================
      - name: Crear keystore temporal
        shell: bash
        run: |
          set -e

          mkdir -p .keys

          keytool \
            -genkeypair \
            -v \
            -keystore ".keys/signingKey.jks" \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass androidpassword \
            -keypass androidpassword \
            -dname "CN=WoW Android, OU=Mobile, O=WoW, L=Argentina, ST=Tucuman, C=AR"

          echo
          echo "Keystore creado:"

          ls -lh ".keys/signingKey.jks"

      # ============================================================
      # 16. CREAR DIRECTORIO BUILD
      # ============================================================
      - name: Preparar directorio de salida
        shell: bash
        run: |
          set -e

          rm -rf build
          mkdir -p build

      # ============================================================
      # 17. EXPORTAR APK DEBUG
      # ============================================================
      - name: Exportar APK Debug
        shell: bash
        run: |
          set -e

          ./Godot_v4.2.1-stable_mono_linux.x86_64 \
            --headless \
            --path . \
            --export-debug \
            "Android" \
            "build/WoW-debug.apk"

          echo
          echo "APK Debug generado:"

          test -f "build/WoW-debug.apk"

          ls -lh "build/WoW-debug.apk"

      # ============================================================
      # 18. EXPORTAR APK RELEASE
      # ============================================================
      - name: Exportar APK Release
        shell: bash
        run: |
          set -e

          ./Godot_v4.2.1-stable_mono_linux.x86_64 \
            --headless \
            --path . \
            --export-release \
            "Android" \
            "build/WoW-release.apk"

          echo
          echo "APK Release generado:"

          test -f "build/WoW-release.apk"

          ls -lh "build/WoW-release.apk"

      # ============================================================
      # 19. INSTALAR HERRAMIENTAS ANDROID PARA FIRMAR
      # ============================================================
      - name: Preparar herramientas de firma
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          test -f "$BUILD_TOOLS/zipalign"
          test -f "$BUILD_TOOLS/apksigner"

          echo "zipalign:"
          "$BUILD_TOOLS/zipalign" --help | head -5 || true

          echo
          echo "apksigner:"
          "$BUILD_TOOLS/apksigner" version

      # ============================================================
      # 20. ALINEAR APK DEBUG
      # ============================================================
      - name: Alinear APK Debug
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/zipalign" \
            -f \
            4 \
            "build/WoW-debug.apk" \
            "build/WoW-debug-aligned.apk"

          test -f "build/WoW-debug-aligned.apk"

      # ============================================================
      # 21. FIRMAR APK DEBUG
      # ============================================================
      - name: Firmar APK Debug
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/apksigner" sign \
            --ks ".keys/signingKey.jks" \
            --ks-key-alias android \
            --ks-pass pass:androidpassword \
            --key-pass pass:androidpassword \
            --out "build/WoW-debug-signed.apk" \
            "build/WoW-debug-aligned.apk"

          test -f "build/WoW-debug-signed.apk"

      # ============================================================
      # 22. ALINEAR APK RELEASE
      # ============================================================
      - name: Alinear APK Release
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/zipalign" \
            -f \
            4 \
            "build/WoW-release.apk" \
            "build/WoW-release-aligned.apk"

          test -f "build/WoW-release-aligned.apk"

      # ============================================================
      # 23. FIRMAR APK RELEASE
      # ============================================================
      - name: Firmar APK Release
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/apksigner" sign \
            --ks ".keys/signingKey.jks" \
            --ks-key-alias android \
            --ks-pass pass:androidpassword \
            --key-pass pass:androidpassword \
            --out "build/WoW-release-signed.apk" \
            "build/WoW-release-aligned.apk"

          test -f "build/WoW-release-signed.apk"

      # ============================================================
      # 24. VERIFICAR FIRMA DEBUG
      # ============================================================
      - name: Verificar firma Debug
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "build/WoW-debug-signed.apk"

      # ============================================================
      # 25. VERIFICAR FIRMA RELEASE
      # ============================================================
      - name: Verificar firma Release
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "build/WoW-release-signed.apk"

      # ============================================================
      # 26. MOSTRAR APK FINALES
      # ============================================================
      - name: Mostrar APK finales
        shell: bash
        run: |
          set -e

          echo
          echo "=========================================="
          echo " APK DEBUG"
          echo "=========================================="

          ls -lh "build/WoW-debug-signed.apk"

          echo
          echo "=========================================="
          echo " APK RELEASE"
          echo "=========================================="

          ls -lh "build/WoW-release-signed.apk"

          echo
          echo "=========================================="
          echo " BUILD COMPLETADO"
          echo "=========================================="

      # ============================================================
      # 27. ARTIFACT DEBUG
      # ============================================================
      - name: Subir APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Android-Debug
          path: build/WoW-debug-signed.apk
          if-no-files-found: error

      # ============================================================
      # 28. ARTIFACT RELEASE
      # ============================================================
      - name: Subir APK Release
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Android-Release
          path: build/WoW-release-signed.apk
          if-no-files-found: error
