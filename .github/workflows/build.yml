name: Build WoW Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Nuestro proyecto (wow-mobile-client)
      # ============================================================

      - name: Checkout WoW Mobile
        uses: actions/checkout@v4


      # ============================================================
      # 2. WoWee + TODOS sus submódulos nativos
      # ============================================================

      - name: Checkout WoWee
        uses: actions/checkout@v4
        with:
          repository: Kelsidavis/WoWee
          path: wowee
          submodules: recursive
          fetch-depth: 0


      # ============================================================
      # 3. Java 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 4. Configurar Gradle
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ============================================================
      # 5. Localizar Android SDK
      # ============================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -d "$ANDROID_HOME/cmdline-tools/16.0/bin" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              | head -1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager no encontrado"
            find "$ANDROID_HOME" -maxdepth 5 \
              -type f \
              -name sdkmanager \
              -print || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          echo "sdkmanager encontrado:"
          "$SDKMANAGER" --version


      # ============================================================
      # 6. Aceptar licencias
      # ============================================================

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true


      # ============================================================
      # 7. Instalar herramientas Android
      # ============================================================

      - name: Install Android toolchain
        shell: bash
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.31.6" \
            "ndk;28.2.13676358"


      # ============================================================
      # 8. Verificar toolchain
      # ============================================================

      - name: Verify Android toolchain
        shell: bash
        run: |
          echo "=========================================="
          echo "ANDROID_HOME"
          echo "$ANDROID_HOME"
          echo "=========================================="

          echo "NDK:"
          ls -la "$ANDROID_HOME/ndk"

          echo "CMake:"
          ls -la "$ANDROID_HOME/cmake"

          echo "Build Tools:"
          ls -la "$ANDROID_HOME/build-tools"

          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          test -d "$ANDROID_HOME/cmake/3.31.6"


      # ============================================================
      # 9. Preparar WoWee
      # ============================================================

      - name: Prepare WoWee
        working-directory: wowee
        shell: bash
        run: |
          git submodule update --init --recursive

          echo "WoWee commit:"
          git rev-parse HEAD

          echo "Submodules:"
          git submodule status --recursive
      # ============================================================
      # 10. Clonar la biblioteca oficial de SDL3
      # ============================================================

      - name: Checkout SDL3 official
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: main
          path: sdl3


      # ============================================================
      # 11. Instalar OpenSSL local (arm64-v8a v4.0.3)
      # ============================================================

      - name: Unzip Local OpenSSL
        shell: bash
        run: |
          mkdir -p ${{ github.workspace }}/openssl-android
          unzip -q "./openssl.zip" -d ${{ github.workspace }}/openssl-android
          
          echo "Contenido verificado en el subdirectorio openssl:"
          ls -la ${{ github.workspace }}/openssl-android/openssl


      # ============================================================
      # 12. Limpiar caché previa de compilación nativa
      # ============================================================

      - name: Clean Cache
        shell: bash
        run: |
          gradle clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 13. Secuestrar FetchContent, Forzar SDL3 y Compilar
      # ============================================================

      - name: Build Debug APK
        shell: bash
        run: |
          # 1. Definimos los argumentos nativos de OpenSSL absolutos para CMake
          NEW_CMAKE_ARGS="arguments '-DANDROID_STL=c++_shared', '-DOPENSSL_ROOT_DIR=${{ github.workspace }}/openssl-android/openssl', '-DOPENSSL_INCLUDE_DIR=${{ github.workspace }}/openssl-android/openssl/include', '-DOPENSSL_CRYPTO_LIBRARY=${{ github.workspace }}/openssl-android/openssl/lib/libcrypto.a', '-DOPENSSL_SSL_LIBRARY=${{ github.workspace }}/openssl-android/openssl/lib/libssl.a', '-DOPENSSL_USE_STATIC_LIBS=TRUE'"
          
          # 2. Inyectamos los argumentos en el archivo app/build.gradle
          sed -i "s|arguments \"-DANDROID_STL=c++_shared\"|$NEW_CMAKE_ARGS|g" app/build.gradle
          
          # 3. INTERCEPCIÓN AVANZADA DE CMAKElISTS (Secuestro de dependencias nativas)
          # Al inicio del CMakeLists principal, compilamos SDL3 de forma nativa
          # y desactivamos de manera forzada la descarga e inicialización automática de SDL2
          cat << 'EOF' > temp_patch.txt
          # Compilar la infraestructura oficial de SDL3 para el NDK
          add_subdirectory("/home/runner/work/wow-mobile-client/wow-mobile-client/sdl3" sdl3_build)
          include_directories("/home/runner/work/wow-mobile-client/wow-mobile-client/sdl3/include")
          
          # Indicar a FetchContent que el paquete SDL2 / sdl2 ya fue procesado externamente
          set(sdl2_POPULATED TRUE CACHE BOOL "Bypass FetchContent SDL2" FORCE)
          set(SDL2_POPULATED TRUE CACHE BOOL "Bypass FetchContent SDL2" FORCE)
          
          # Desactivar la validación estricta de políticas de duplicidad de nombres en CMake
          cmake_policy(SET CMP0002 OLD)
          EOF
          
          # Adjuntamos el contenido de tu CMakeLists original debajo del bloque de control
          cat app/src/main/CMakeLists.txt >> temp_patch.txt
          mv temp_patch.txt app/src/main/CMakeLists.txt
          
          # 4. Forzamos la inclusión del directorio de OpenSSL al final para el enlazador criptográfico
          echo "include_directories(\"${{ github.workspace }}/openssl-android/openssl/include\")" >> app/src/main/CMakeLists.txt
          
          # 5. Redireccionar los enlaces de enlace nativos del juego hacia SDL3-shared de forma explícita
          echo "target_link_libraries(wowmobile PRIVATE SDL3-shared)" >> app/src/main/CMakeLists.txt
          
          # 6. REFACTORIZACIÓN EN CALIENTE DE ARCHIVOS DE C++ (De SDL2 a SDL3)
          # Reemplazamos todas las llamadas a las cabeceras antiguas de las dependencias nativas del submódulo
          find ${{ github.workspace }}/wowee -type f \( -name "*.hpp" -o -name "*.cpp" -o -name "*.h" \) -exec sed -i 's|<SDL2/SDL.h>|<SDL3/SDL.h>|g' {} +
          find ${{ github.workspace }}/wowee -type f \( -name "*.hpp" -o -name "*.cpp" -o -name "*.h" \) -exec sed -i 's|#include "SDL.h"|#include <SDL3/SDL.h>|g' {} +
          
          # 7. Imprimir el encabezado final generado en los logs para auditoría visual
          echo "=== Vista superior de la jerarquía de CMakeLists ==="
          head -n 25 app/src/main/CMakeLists.txt
          
          # 8. Ejecución del compilador de Gradle
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info


      # ============================================================
      # 14. Buscar APK
      # ============================================================

      - name: Locate APK
        shell: bash
        run: |
          echo "APK generado:"
          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # ============================================================
      # 15. Descargar APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wowmobile-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
