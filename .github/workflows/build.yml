name: Build WoW Mobile Client

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_VERSION: "28.2.13676358"
      ANDROID_CMAKE_VERSION: "3.31.6"
      ANDROID_PLATFORM: "android-35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ABI: "arm64-v8a"

    steps:

      # ============================================================
      # 1. CHECKOUT DEL PROYECTO
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID SDK"
          echo "=============================================="

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          if [ -z "${ANDROID_HOME}" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
          fi

          if [ -z "${ANDROID_SDK_ROOT}" ]; then
            export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          fi

          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" \
              -type f \
              -name sdkmanager \
              | sort \
              | tail -1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: No se encontró sdkmanager."
            find "${ANDROID_HOME}/cmdline-tools" \
              -maxdepth 3 \
              -type f \
              -name sdkmanager \
              -print || true
            exit 1
          fi

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"

          echo "SDKMANAGER=${SDKMANAGER}" >> "$GITHUB_ENV"
          echo "${SDKMANAGER_DIR}" >> "$GITHUB_PATH"

          echo
          echo "sdkmanager seleccionado:"
          echo "$SDKMANAGER"

          echo
          echo "Versión:"
          "$SDKMANAGER" --version

      # ============================================================
      # 4. LICENCIAS E INSTALACIÓN DE SDK
      # ============================================================

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "INSTALANDO ANDROID SDK"
          echo "=============================================="

          echo "SDKMANAGER=${SDKMANAGER}"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmake;${ANDROID_CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo
          echo "=============================================="
          echo "SDK INSTALADO"
          echo "=============================================="

          echo
          echo "Plataformas:"
          ls -la "${ANDROID_HOME}/platforms" || true

          echo
          echo "Build Tools:"
          ls -la "${ANDROID_HOME}/build-tools" || true

          echo
          echo "NDK:"
          ls -la "${ANDROID_HOME}/ndk" || true

          echo
          echo "CMake:"
          ls -la "${ANDROID_HOME}/cmake" || true

      # ============================================================
      # 5. GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ============================================================
      # 6. COMPROBAR ESTRUCTURA
      # ============================================================

      - name: Check repository structure
        shell: bash
        run: |
          echo "=============================================="
          echo "ESTRUCTURA DEL PROYECTO"
          echo "=============================================="

          pwd

          echo
          echo "Archivos principales:"
          find . -maxdepth 2 -type f | sort | head -300

          echo
          echo "=============================================="
          echo "WOWEE"
          echo "=============================================="

          if [ ! -d "wowee" ]; then
            echo "ERROR: No existe wowee/"
            exit 1
          fi

          echo "WoWee encontrado correctamente."

      # ============================================================
      # 7. INSPECCIONAR WOWEE
      # ============================================================

      - name: Inspect WoWee source
        shell: bash
        run: |
          echo "=============================================="
          echo "INSPECCIONANDO WOWEE"
          echo "=============================================="

          find wowee \
            \( -name "*.hpp" -o -name "*.h" -o -name "*.cpp" -o -name "*.cc" \) \
            | sort \
            | head -500

          echo
          echo "Buscando AuthHandler:"
          grep -Rni \
            "class AuthHandler\|struct AuthHandler\|AuthHandler" \
            wowee \
            --include="*.hpp" \
            --include="*.h" \
            --include="*.cpp" \
            --include="*.cc" \
            | head -100 || true

      # ============================================================
      # 8. SDL3
      # ============================================================

      - name: Checkout SDL3
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          path: sdl3
          fetch-depth: 1

      # ============================================================
      # 9. GLM
      # ============================================================

      - name: Checkout GLM
        uses: actions/checkout@v4
        with:
          repository: g-truc/glm
          path: glm-src
          fetch-depth: 1

      # ============================================================
      # 10. OPENSSL
      # ============================================================

      - name: Prepare OpenSSL
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "OPENSSL"
          echo "=============================================="

          if [ ! -f "./openssl.zip" ]; then
            echo "ADVERTENCIA: openssl.zip no existe."
          else
            rm -rf "${GITHUB_WORKSPACE}/openssl-android"

            mkdir -p "${GITHUB_WORKSPACE}/openssl-android"

            unzip -q \
              "./openssl.zip" \
              -d "${GITHUB_WORKSPACE}/openssl-android"

            echo "OpenSSL extraído."

            find "${GITHUB_WORKSPACE}/openssl-android" \
              -maxdepth 4 \
              -type f \
              | head -100
          fi

      # ============================================================
      # 11. NORMALIZAR SDL
      # ============================================================

      - name: Normalize WoWee SDL includes
        shell: bash
        run: |
          echo "=============================================="
          echo "NORMALIZANDO SDL"
          echo "=============================================="

          if [ -d "wowee" ]; then

            grep -RIl \
              --include="*.h" \
              --include="*.hpp" \
              --include="*.c" \
              --include="*.cc" \
              --include="*.cpp" \
              'SDL2/' \
              wowee \
              | while read -r file; do

                echo "Corrigiendo: $file"

                sed -i 's#SDL2/#SDL3/#g' "$file"

              done

          fi

          echo "Normalización SDL terminada."

      # ============================================================
      # 12. INFORMACIÓN DEL TOOLCHAIN
      # ============================================================

      - name: Show Android toolchain
        shell: bash
        run: |
          echo "=============================================="
          echo "TOOLCHAIN"
          echo "=============================================="

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "ANDROID_NDK_VERSION=${ANDROID_NDK_VERSION}"
          echo "ANDROID_CMAKE_VERSION=${ANDROID_CMAKE_VERSION}"
          echo "ABI=${ABI}"

          echo
          echo "NDK:"
          ls -la \
            "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" \
            | head -30

          echo
          echo "CMake:"
          "${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}/bin/cmake" \
            --version

          echo
          echo "Ninja:"
          "${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}/bin/ninja" \
            --version

      # ============================================================
      # 13. VALIDAR wow_integration.cpp
      # ============================================================

      - name: Validate WoW integration source
        shell: bash
        run: |
          set -e

          FILE="app/src/main/wow_integration.cpp"

          echo "=============================================="
          echo "VALIDANDO WOW INTEGRATION"
          echo "=============================================="

          if [ ! -f "$FILE" ]; then
            echo "ERROR: No existe:"
            echo "$FILE"
            exit 1
          fi

          echo
          echo "Contenido:"
          echo "----------------------------------------------"

          nl -ba "$FILE"

          echo "----------------------------------------------"

          echo
          echo "COMPROBANDO NAMESPACES CORRUPTOS"

          if grep -q "wowee::core::wowee::core" "$FILE"; then
            echo "ERROR: Namespace wowee::core duplicado."
            exit 1
          fi

          if grep -q "wowee::network::wowee::network" "$FILE"; then
            echo "ERROR: Namespace wowee::network duplicado."
            exit 1
          fi

          if grep -q "g_WoWwowee" "$FILE"; then
            echo "ERROR: g_WoWwowee encontrado."
            exit 1
          fi

          echo "OK."

          # --------------------------------------------------------
          # AuthHandler
          # --------------------------------------------------------

          echo
          echo "COMPROBANDO AUTHHANDLER"
          echo "=============================================="

          AUTH_DECL_COUNT=$(
            grep -Ec \
              '^[[:space:]]*wowee::auth::AuthHandler[[:space:]]+auth[[:space:]]*;' \
              "$FILE" || true
          )

          echo "Declaraciones de AuthHandler encontradas: ${AUTH_DECL_COUNT}"

          if [ "$AUTH_DECL_COUNT" -gt 1 ]; then
            echo
            echo "ERROR: AuthHandler duplicado."
            echo
            grep -n \
              "wowee::auth::AuthHandler" \
              "$FILE" || true
            exit 1
          fi

          echo "OK: AuthHandler no está duplicado."

          # --------------------------------------------------------
          # Literal \n
          # --------------------------------------------------------

          echo
          echo "COMPROBANDO LITERALES \\\\n"
          echo "=============================================="

          if grep -Fq '\n' "$FILE"; then
            echo "ERROR: Se encontró un literal \n."

            grep -nF '\n' "$FILE" || true

            exit 1
          fi

          echo "OK."

          # --------------------------------------------------------
          # Variables globales
          # --------------------------------------------------------

          echo
          echo "COMPROBANDO VARIABLES GLOBALES"
          echo "=============================================="

          APP_COUNT=$(
            grep -Ec \
              'std::unique_ptr<wowee::core::Application>[[:space:]]+g_WoWApplication' \
              "$FILE" || true
          )

          SOCKET_COUNT=$(
            grep -Ec \
              'std::unique_ptr<wowee::network::WorldSocket>[[:space:]]+g_WoWWorldSocket' \
              "$FILE" || true
          )

          echo "g_WoWApplication: ${APP_COUNT}"
          echo "g_WoWWorldSocket: ${SOCKET_COUNT}"

          if [ "$APP_COUNT" -gt 1 ]; then
            echo "ERROR: g_WoWApplication duplicado."
            exit 1
          fi

          if [ "$SOCKET_COUNT" -gt 1 ]; then
            echo "ERROR: g_WoWWorldSocket duplicado."
            exit 1
          fi

          echo
          echo "=============================================="
          echo "VALIDACION COMPLETADA"
          echo "=============================================="

      # ============================================================
      # 14. MOSTRAR CMAKE
      # ============================================================

      - name: Inspect CMake configuration
        shell: bash
        run: |
          echo "=============================================="
          echo "CMAKE"
          echo "=============================================="

          if [ -f "app/src/main/CMakeLists.txt" ]; then
            echo
            echo "app/src/main/CMakeLists.txt"
            echo "----------------------------------------------"
            cat app/src/main/CMakeLists.txt
          fi

          if [ -f "app/CMakeLists.txt" ]; then
            echo
            echo "app/CMakeLists.txt"
            echo "----------------------------------------------"
            cat app/CMakeLists.txt
          fi

      # ============================================================
      # 15. LIMPIAR BUILD
      # ============================================================

      - name: Clean Android build
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LIMPIANDO BUILD"
          echo "=============================================="

          rm -rf app/.cxx
          rm -rf app/build

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 16. CONFIGURAR GRADLE
      # ============================================================

      - name: Configure native build arguments
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "CONFIGURANDO BUILD NATIVO"
          echo "=============================================="

          if [ ! -f "app/build.gradle" ]; then
            echo "ERROR: No existe app/build.gradle"
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")

          text = path.read_text(encoding="utf-8")

          arguments = [
              '        arguments "-DANDROID_STL=c++_shared"',
              '        arguments "-DANDROID_PLATFORM=android-35"',
              '        arguments "-DANDROID_ABI=arm64-v8a"',
              '        arguments "-DWOWEE_ANDROID=ON"',
              '        arguments "-DWOWEE_USE_SDL3=ON"',
          ]

          block = "\n".join(arguments)

          if "-DWOWEE_ANDROID=ON" not in text:

              marker = "externalNativeBuild {"

              if marker in text:
                  text = text.replace(
                      marker,
                      marker + "\n" + block,
                      1
                  )

          path.write_text(
              text,
              encoding="utf-8"
          )

          PY

          echo
          echo "app/build.gradle:"
          cat app/build.gradle

      # ============================================================
      # 17. COMPILAR APK
      # ============================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          echo "=============================================="
          echo "COMPILANDO DEBUG APK"
          echo "=============================================="

          echo
          echo "wow_integration.cpp NO será modificado."

          echo
          echo "=============================================="
          echo "FUENTE FINAL"
          echo "=============================================="

          nl -ba app/src/main/wow_integration.cpp

          echo
          echo "=============================================="
          echo "GRADLE"
          echo "=============================================="

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # ============================================================
      # 18. LOCALIZAR APK
      # ============================================================

      - name: Locate APK
        shell: bash
        run: |
          echo "=============================================="
          echo "APK"
          echo "=============================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            | sort

          APK_COUNT=$(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | wc -l
          )

          echo
          echo "APK encontrados: ${APK_COUNT}"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No se generó ningún APK."
            exit 1
          fi

      # ============================================================
      # 19. SUBIR APK
      # ============================================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wow-mobile-client-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # ============================================================
      # 20. RESUMEN
      # ============================================================

      - name: Build summary
        if: success()
        shell: bash
        run: |
          echo "=============================================="
          echo "BUILD COMPLETADO"
          echo "=============================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;
