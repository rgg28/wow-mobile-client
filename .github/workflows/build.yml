name: "Compilar Cliente WoW 3.3.5a"

on:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17 (Requerido por Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Android SDK (Corregido)
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

    - name: Instalar Godot y Plantillas de Exportación (Nombres Fijos)
      run: |
        # Forzar un nombre de archivo fijo para evitar el error 23 de curl
        curl -Lo godot.zip https://github.com
        unzip godot.zip
        mv Godot_v4.2.1-stable_mono_linux_x86_64/Godot_v4.2.1-stable_mono_linux_x86_64.x86_64 godot
        
        curl -Lo templates.tpz https://github.com
        mkdir -p ~/.local/share/godot/export_templates/4.2.1.stable.mono
        unzip templates.tpz -d ~/.local/share/godot/export_templates/4.2.1.stable.mono

    - name: Compilar y Exportar APK
      run: |
        mkdir -p build/android
        ./godot --headless --export-release "Android" build/android/wow_335_client.apk

    - name: Subir APK Generado como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: WoW-Android-Client-3.3.5a
        path: build/android/wow_335_client.apk
