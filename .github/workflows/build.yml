name: Build WoW Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_PLATFORM: android-35
      ANDROID_BUILD_TOOLS: 35.0.0
      ANDROID_CMAKE_VERSION: 3.31.6
      ANDROID_NDK_VERSION: 28.2.13676358
      JAVA_VERSION: 17

    steps:

      # ============================================================
      # 1. REPOSITORIO PRINCIPAL
      # ============================================================
      - name: Checkout wow-mobile-client
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # 2. WOWEE - SEGUNDO REPOSITORIO INDEPENDIENTE
      # ============================================================
      - name: Checkout WoWee
        uses: actions/checkout@v4
        with:
          repository: Kelsidavis/WoWee
          path: wowee
          submodules: recursive
          fetch-depth: 0

      - name: Verify repositories
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "REPOSITORIES"
          echo "=============================================="

          echo "Main repository:"
          pwd
          test -d app

          echo
          echo "WoWee repository:"
          test -d wowee

          echo "WoWee checkout OK."

      # ============================================================
      # 3. JAVA 17
      # ============================================================
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" \
              -type f \
              -name sdkmanager \
              | sort \
              | tail -1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager no encontrado."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmake;${ANDROID_CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      # ============================================================
      # 5. VERIFICAR TOOLCHAIN
      # ============================================================
      - name: Verify Android toolchain
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "${ANDROID_HOME}/platforms/${ANDROID_PLATFORM}"
          test -d "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}"
          test -d "${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}"
          test -d "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"

          echo
          echo "CMake:"
          "${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}/bin/cmake" --version

          echo
          echo "ADB:"
          "${ANDROID_HOME}/platform-tools/adb" version

      # ============================================================
      # 6. SDL3
      # ============================================================
      - name: Checkout SDL3
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          path: sdl3
          fetch-depth: 1

      # ============================================================
      # 7. GLM
      # ============================================================
      - name: Checkout GLM
        uses: actions/checkout@v4
        with:
          repository: g-truc/glm
          path: glm-src
          fetch-depth: 1

      # ============================================================
      # 8. OPENSSL
      # ============================================================
      - name: Extract OpenSSL
        shell: bash
        run: |
          set -e

          test -f openssl.zip

          rm -rf openssl-android
          mkdir -p openssl-android

          unzip -q openssl.zip -d openssl-android

          echo "OpenSSL extracted."

      # ============================================================
      # 9. VERIFICAR SOLO LOS FUENTES DE WOWEE QUE NUESTRO CMAKE USA
      # ============================================================
      - name: Verify WoWee sources
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "WOWEE SOURCES"
          echo "=============================================="

          test -d wowee

          REQUIRED_FILES=(
            "wowee/include/core/application.hpp"
            "wowee/include/network/world_socket.hpp"
            "wowee/include/auth/auth_handler.hpp"

            "wowee/src/auth/auth_handler.cpp"
            "wowee/src/auth/auth_opcodes.cpp"
            "wowee/src/auth/auth_packets.cpp"
            "wowee/src/auth/big_num.cpp"
            "wowee/src/auth/crypto.cpp"
            "wowee/src/auth/srp.cpp"
            "wowee/src/auth/vanilla_crypt.cpp"

            "wowee/src/network/packet.cpp"
            "wowee/src/network/socket.cpp"
            "wowee/src/network/tcp_socket.cpp"
            "wowee/src/network/world_socket.cpp"

            "wowee/src/game/opcodes.cpp"
            "wowee/src/game/opcode_table.cpp"
            "wowee/src/game/game_handler_packets.cpp"

            "wowee/src/core/window.cpp"
            "wowee/src/core/application.cpp"
            "wowee/src/core/app_clock.cpp"
            "wowee/src/core/input.cpp"
            "wowee/src/core/logger.cpp"

            "wowee/src/rendering/renderer.cpp"
            "wowee/src/rendering/render_graph.cpp"
            "wowee/src/rendering/vk_context.cpp"
            "wowee/src/rendering/vk_pipeline.cpp"
            "wowee/src/rendering/vk_buffer.cpp"
            "wowee/src/rendering/vk_shader.cpp"
            "wowee/src/rendering/vk_texture.cpp"
            "wowee/src/rendering/vk_utils.cpp"

            "wowee/extern/imgui/imgui.cpp"
            "wowee/extern/imgui/imgui_draw.cpp"
            "wowee/extern/imgui/imgui_tables.cpp"
            "wowee/extern/imgui/imgui_widgets.cpp"
            "wowee/extern/imgui/backends/imgui_impl_sdl3.cpp"
            "wowee/extern/imgui/backends/imgui_impl_vulkan.cpp"

            "wowee/extern/vk-bootstrap/src/VkBootstrap.cpp"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo
              echo "ERROR: falta el archivo:"
              echo "$FILE"
              exit 1
            fi
          done

          echo
          echo "Todos los fuentes seleccionados por nuestro CMake existen."
          echo "No se utiliza wowee/CMakeLists.txt."

      # ============================================================
      # 10. COMPROBAR CMAKE DEL CLIENTE
      # ============================================================
      - name: Verify Android CMake
        shell: bash
        run: |
          set -e

          CMAKE_FILE="app/src/main/CMakeLists.txt"

          if [ ! -f "$CMAKE_FILE" ]; then
            echo "ERROR: no existe $CMAKE_FILE"
            exit 1
          fi

          echo "=============================================="
          echo "ANDROID CMAKE"
          echo "=============================================="

          grep -q 'wowee/src/auth/auth_handler.cpp' "$CMAKE_FILE"
          grep -q 'wowee/src/network/world_socket.cpp' "$CMAKE_FILE"
          grep -q 'wowee/src/core/application.cpp' "$CMAKE_FILE"
          grep -q 'wowee/src/rendering/renderer.cpp' "$CMAKE_FILE"

          echo "CMake del cliente encontrado y contiene WoWee."

      # ============================================================
      # 11. NO MODIFICAR WOW_INTEGRATION.CPP
      # ============================================================
      - name: Validate WoW integration
        shell: bash
        run: |
          set -e

          FILE="app/src/main/wow_integration.cpp"

          test -f "$FILE"

          echo "Validando $FILE"

          if grep -q 'g_WoWwowee' "$FILE"; then
            echo "ERROR: g_WoWwowee encontrado."
            exit 1
          fi

          if grep -q 'wowee::core::wowee::core' "$FILE"; then
            echo "ERROR: namespace wowee::core duplicado."
            exit 1
          fi

          if grep -q 'wowee::network::wowee::network' "$FILE"; then
            echo "ERROR: namespace wowee::network duplicado."
            exit 1
          fi

          echo "wow_integration.cpp OK."

      # ============================================================
      # 12. GRADLE
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ============================================================
      # 13. LIMPIEZA
      # ============================================================
      - name: Clean native build
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          rm -rf app/.cxx
          rm -rf app/build

          ./gradlew clean --no-daemon

      # ============================================================
      # 14. MOSTRAR CONFIGURACION DE GRADLE/CMAKE
      # ============================================================
      - name: Show Android build configuration
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "BUILD CONFIGURATION"
          echo "=============================================="

          echo
          echo "app/build.gradle:"
          sed -n '1,320p' app/build.gradle

          echo
          echo "app/src/main/CMakeLists.txt:"
          sed -n '1,360p' app/src/main/CMakeLists.txt

      # ============================================================
      # 15. COMPILAR
      # ============================================================
      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "BUILD WOW MOBILE"
          echo "=============================================="

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # ============================================================
      # 16. BUSCAR APK
      # ============================================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "APK OUTPUT"
          echo "=============================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: no se genero ningun APK."
            exit 1
          fi

          echo
          echo "APK generado:"
          echo "$APK"

      # ============================================================
      # 17. SUBIR APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wow-mobile-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
