name: Build WoW Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_PLATFORM: android-35
      ANDROID_BUILD_TOOLS: 35.0.0
      ANDROID_CMAKE_VERSION: 3.31.6
      ANDROID_NDK_VERSION: 28.2.13676358
      JAVA_VERSION: 17

    steps:

      # ============================================================
      # 1. REPOSITORIO PRINCIPAL
      # ============================================================
      - name: Checkout wow-mobile-client
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # 2. WOWEE - REPOSITORIO INDEPENDIENTE
      # ============================================================
      - name: Checkout WoWee
        uses: actions/checkout@v4
        with:
          repository: Kelsidavis/WoWee
          path: wowee
          submodules: recursive
          fetch-depth: 0

      - name: Verify repositories
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "REPOSITORIES"
          echo "=============================================="

          echo "Main:"
          pwd
          test -d app

          echo
          echo "WoWee:"
          test -d wowee
          test -d wowee/include
          test -d wowee/src

          echo
          echo "WoWee files:"
          find wowee -maxdepth 2 -type f | head -80

      # ============================================================
      # 3. JAVA
      # ============================================================
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" \
              -type f \
              -name sdkmanager \
              | sort \
              | tail -1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager no encontrado"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmake;${ANDROID_CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      # ============================================================
      # 5. VERIFICAR TOOLCHAIN
      # ============================================================
      - name: Verify Android toolchain
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "${ANDROID_HOME}/platforms/${ANDROID_PLATFORM}"
          test -d "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}"
          test -d "${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}"
          test -d "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"

          "${ANDROID_HOME}/platform-tools/adb" version || true

          "${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}/bin/cmake" \
            --version

          "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/ndk-build" \
            --version || true

      # ============================================================
      # 6. SDL3
      # ============================================================
      - name: Checkout SDL3
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          path: sdl3
          fetch-depth: 1

      # ============================================================
      # 7. GLM
      # ============================================================
      - name: Checkout GLM
        uses: actions/checkout@v4
        with:
          repository: g-truc/glm
          path: glm-src
          fetch-depth: 1

      # ============================================================
      # 8. OPENSSL LOCAL
      # ============================================================
      - name: Extract OpenSSL
        shell: bash
        run: |
          set -e

          test -f openssl.zip

          rm -rf openssl-android
          mkdir -p openssl-android

          unzip -q openssl.zip -d openssl-android

          echo "OpenSSL:"
          find openssl-android -maxdepth 3 -type f | head -80

      # ============================================================
      # 9. VERIFICAR WOWEE
      # ============================================================
      - name: Inspect WoWee
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "WOWEE"
          echo "=============================================="

          test -d wowee
          test -f wowee/CMakeLists.txt || {
            echo "ERROR: WoWee no contiene CMakeLists.txt"
            exit 1
          }

          echo "CMake:"
          sed -n '1,240p' wowee/CMakeLists.txt

          echo
          echo "Headers:"
          find wowee/include -type f | head -100

      # ============================================================
      # 10. CONFIGURAR GRADLE
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ============================================================
      # 11. VALIDAR INTEGRACION C++
      # ============================================================
      - name: Validate WoW integration source
        shell: bash
        run: |
          set -e

          FILE="app/src/main/wow_integration.cpp"

          test -f "$FILE"

          echo "Checking $FILE"

          if grep -q 'g_WoWwowee' "$FILE"; then
            echo "ERROR: g_WoWwowee detectado"
            exit 1
          fi

          if grep -q 'wowee::core::wowee::core' "$FILE"; then
            echo "ERROR: namespace duplicado"
            exit 1
          fi

          if grep -q 'wowee::network::wowee::network' "$FILE"; then
            echo "ERROR: namespace duplicado"
            exit 1
          fi

          if grep -q '\\\\n' "$FILE"; then
            echo "ERROR: literal \\\\n encontrado en C++"
            exit 1
          fi

          echo "wow_integration.cpp OK"

      # ============================================================
      # 12. LIMPIEZA
      # ============================================================
      - name: Clean native build
        shell: bash
        run: |
          set -e

          rm -rf app/.cxx
          rm -rf app/build

          chmod +x gradlew

          ./gradlew clean --no-daemon

      # ============================================================
      # 13. MOSTRAR CMAKE DEL PROYECTO
      # ============================================================
      - name: Inspect Android CMake
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID CMAKE"
          echo "=============================================="

          find app/src/main -maxdepth 2 \
            \( -name "CMakeLists.txt" -o -name "*.cmake" \) \
            -print

          if [ -f app/src/main/CMakeLists.txt ]; then
            sed -n '1,320p' app/src/main/CMakeLists.txt
          fi

      # ============================================================
      # 14. BUILD
      # ============================================================
      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "BUILD WOW MOBILE"
          echo "=============================================="

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # ============================================================
      # 15. BUSCAR APK
      # ============================================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "APK"
          echo "=============================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print -quit)"

      # ============================================================
      # 16. SUBIR APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wow-mobile-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
