name: Build WoW Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Nuestro proyecto
      # ============================================================

      - name: Checkout WoW Mobile
        uses: actions/checkout@v4


      # ============================================================
      # 2. WoWee + TODOS sus submódulos
      # ============================================================

      - name: Checkout WoWee
        uses: actions/checkout@v4
        with:
          repository: Kelsidavis/WoWee
          path: wowee
          submodules: recursive
          fetch-depth: 0


      # ============================================================
      # 3. Java 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 4. Configurar Gradle (Solución al error del gradlew)
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5' # <--- Cambia esto por la versión de Gradle que requiera tu proyecto (ej: 8.5, 8.7, etc.)


      # ============================================================
      # 5. Localizar Android SDK
      # ============================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -d "$ANDROID_HOME/cmdline-tools/16.0/bin" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              | head -1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager no encontrado"
            find "$ANDROID_HOME" -maxdepth 5 \
              -type f \
              -name sdkmanager \
              -print || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          echo "sdkmanager encontrado:"
          "$SDKMANAGER" --version


      # ============================================================
      # 6. Aceptar licencias
      # ============================================================

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true


      # ============================================================
      # 7. Instalar herramientas Android
      # ============================================================

      - name: Install Android toolchain
        shell: bash
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.31.6" \
            "ndk;28.2.13676358"


      # ============================================================
      # 8. Verificar toolchain
      # ============================================================

      - name: Verify Android toolchain
        shell: bash
        run: |
          echo "=========================================="
          echo "ANDROID_HOME"
          echo "$ANDROID_HOME"
          echo "=========================================="

          echo "NDK:"
          ls -la "$ANDROID_HOME/ndk"

          echo "CMake:"
          ls -la "$ANDROID_HOME/cmake"

          echo "Build Tools:"
          ls -la "$ANDROID_HOME/build-tools"

          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          test -d "$ANDROID_HOME/cmake/3.31.6"


      # ============================================================
      # 9. Preparar WoWee
      # ============================================================

      - name: Prepare WoWee
        working-directory: wowee
        shell: bash
        run: |
          git submodule update --init --recursive

          echo "WoWee commit:"
          git rev-parse HEAD

          echo "Submodules:"
          git submodule status --recursive


      # ============================================================
      # 10. Comprobar WoWee
      # ============================================================

      - name: Check WoWee
        shell: bash
        run: |
          test -f wowee/CMakeLists.txt
          test -d wowee/src

          echo "WoWee CMake:"
          ls -lh wowee/CMakeLists.txt

          echo "WoWee source directories:"
          find wowee/src -maxdepth 2 -type d | sort


      # ============================================================
      # 11. Limpiar (Usando 'gradle' global)
      # ============================================================

      - name: Clean
        shell: bash
        run: |
          gradle clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 12. Compilar (Usando 'gradle' global)
      # ============================================================

      - name: Build Debug APK
        shell: bash
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info


      # ============================================================
      # 13. Buscar APK
      # ============================================================

      - name: Locate APK
        shell: bash
        run: |
          echo "APK generado:"
          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # ============================================================
      # 14. Descargar APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wowmobile-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
