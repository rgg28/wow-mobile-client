name: Compilar WoW Android

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:

  build:

    name: Build WoW Android

    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT + GIT LFS
      # ============================================================

      - name: Descargar repositorio con Git LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. DOTNET 8
      # ============================================================

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " ANDROID SDK"
          echo "=========================================="

          SDKMANAGER=""

          for CANDIDATE in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"
          do
            if [ -f "$CANDIDATE" ]; then
              SDKMANAGER="$CANDIDATE"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" \
              -type f \
              -name sdkmanager \
              2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: No se encontró sdkmanager."
            exit 1
          fi

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo
          echo "Android SDK OK."

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" version

      # ============================================================
      # 5. RECUPERAR GODOT DESDE GIT LFS
      # ============================================================

      - name: Descargar objetos Git LFS
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " GIT LFS"
          echo "=========================================="

          git lfs version

          echo
          echo "Archivos LFS:"
          git lfs ls-files

          echo
          echo "Descargando objetos LFS..."

          git lfs pull

          echo
          echo "Git LFS OK."

      # ============================================================
      # 6. VERIFICAR GODOT
      # ============================================================

      - name: Verificar Godot Mono
        shell: bash
        run: |
          set -e

          GODOT="./Godot_v4.2.1-stable_mono_linux.x86_64"

          echo "=========================================="
          echo " GODOT MONO"
          echo "=========================================="

          test -f "$GODOT"

          echo
          echo "Tipo:"
          file "$GODOT"

          echo
          echo "Tamaño:"
          stat -c "%s bytes" "$GODOT"

          if head -c 200 "$GODOT" | grep -q \
            "git-lfs.github.com/spec"; then

            echo "ERROR: Godot sigue siendo un pointer LFS."

            cat "$GODOT"

            exit 1
          fi

          MAGIC="$(xxd -l 4 -p "$GODOT")"

          if [ "$MAGIC" != "7f454c46" ]; then

            echo "ERROR: Godot no es un ELF Linux."

            exit 1

          fi

          chmod +x "$GODOT"

          echo
          echo "Godot:"
          "$GODOT" --version

      # ============================================================
      # 7. VERIFICAR ARCHIVOS GODOT
      # ============================================================

      - name: Verificar archivos Godot
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " ARCHIVOS GODOT"
          echo "=========================================="

          test -f \
            "./Godot_v4.2.1-stable_mono_export_templates.tpz"

          test -d "./GodotSharp"

          echo "Godot:"
          ls -lh \
            "./Godot_v4.2.1-stable_mono_linux.x86_64"

          echo
          echo "Templates:"
          ls -lh \
            "./Godot_v4.2.1-stable_mono_export_templates.tpz"

          echo
          echo "GodotSharp:"
          ls -ld "./GodotSharp"

      # ============================================================
      # 8. INSTALAR TEMPLATES MONO
      # ============================================================

      - name: Instalar templates Mono Android
        shell: bash
        run: |
          set -e

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.2.1.stable.mono"

          echo "=========================================="
          echo " GODOT EXPORT TEMPLATES"
          echo "=========================================="

          rm -rf "$TEMPLATE_DIR"

          mkdir -p "$TEMPLATE_DIR"

          unzip -q \
            "./Godot_v4.2.1-stable_mono_export_templates.tpz" \
            -d "$TEMPLATE_DIR"

          if [ -d "$TEMPLATE_DIR/templates" ]; then

            cp -a \
              "$TEMPLATE_DIR/templates/." \
              "$TEMPLATE_DIR/"

            rm -rf "$TEMPLATE_DIR/templates"

          fi

          echo
          echo "Templates:"

          find "$TEMPLATE_DIR" \
            -maxdepth 2 \
            -type f \
            -print

          test -f \
            "$TEMPLATE_DIR/android_debug.apk"

          test -f \
            "$TEMPLATE_DIR/android_release.apk"

          echo
          echo "Templates Android Mono OK."

      # ============================================================
      # 9. RESTORE C#
      # ============================================================

      - name: Restaurar proyecto C#
        shell: bash
        run: |
          set -e

          dotnet restore \
            "WoW Android Client.csproj"

      # ============================================================
      # 10. BUILD DEBUG
      # ============================================================

      - name: Compilar C# Debug
        shell: bash
        run: |
          set -e

          dotnet build \
            "WoW Android Client.csproj" \
            -c Debug \
            --no-restore

          test -f \
            ".godot/mono/temp/bin/Debug/WoW Android Client.dll"

          echo "Build Debug OK."

      # ============================================================
      # 11. BUILD RELEASE
      # ============================================================

      - name: Compilar C# Release
        shell: bash
        run: |
          set -e

          dotnet build \
            "WoW Android Client.csproj" \
            -c Release \
            --no-restore

          test -f \
            ".godot/mono/temp/bin/Release/WoW Android Client.dll"

          echo "Build Release OK."

      # ============================================================
      # 12. VALIDAR C# CON GODOT
      # ============================================================

      - name: Validar solución C# con Godot
        shell: bash
        run: |
          set -e

          GODOT="./Godot_v4.2.1-stable_mono_linux.x86_64"

          "$GODOT" \
            --headless \
            --path "." \
            --build-solutions \
            --quit

      # ============================================================
      # 13. PREPARAR CARPETA BUILD
      # ============================================================

      - name: Preparar carpeta build
        shell: bash
        run: |
          set -e

          rm -rf build

          mkdir -p build

          mkdir -p .keys

      # ============================================================
      # 14. CREAR DEBUG KEYSTORE
      # ============================================================

      - name: Crear debug.keystore
        shell: bash
        run: |
          set -e

          DEBUG_KEYSTORE="$GITHUB_WORKSPACE/.keys/debug.keystore"

          keytool \
            -genkeypair \
            -v \
            -keystore "$DEBUG_KEYSTORE" \
            -alias "androiddebugkey" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 9999 \
            -storepass "android" \
            -keypass "android" \
            -dname "CN=Android Debug,O=Android,C=US"

          test -f "$DEBUG_KEYSTORE"

          echo "Debug keystore creado."

      # ============================================================
      # 15. CREAR / RECUPERAR RELEASE KEYSTORE
      # ============================================================

      - name: Preparar signingKey.jks
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -e

          RELEASE_KEYSTORE="$GITHUB_WORKSPACE/.keys/signingKey.jks"

          echo "=========================================="
          echo " RELEASE KEYSTORE"
          echo "=========================================="

          if [ -n "$SIGNING_KEY" ]; then

            echo "SIGNING_KEY encontrado."

            echo "$SIGNING_KEY" | base64 --decode > "$RELEASE_KEYSTORE"

            test -s "$RELEASE_KEYSTORE"

            echo "Keystore Release recuperado."

          else

            echo "SIGNING_KEY todavía no existe."

            echo "Generando signingKey.jks inicial..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$RELEASE_KEYSTORE" \
              -alias "$SIGNING_KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$SIGNING_STORE_PASSWORD" \
              -keypass "$SIGNING_KEY_PASSWORD" \
              -dname "CN=WoW Android,OU=Mobile,O=WoW,L=Argentina,ST=Tucuman,C=AR"

            test -f "$RELEASE_KEYSTORE"

            echo
            echo "=========================================="
            echo " KEYSTORE INICIAL GENERADO"
            echo "=========================================="

            echo
            echo "IMPORTANTE:"
            echo "Este archivo debe guardarse como"
            echo "GitHub Secret SIGNING_KEY."
            echo
            echo "Se subirá como artifact temporal."
            echo "=========================================="

          fi

      # ============================================================
      # 16. CONFIGURAR VARIABLES PARA GODOT
      # ============================================================

      - name: Configurar keystores de Godot
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        shell: bash
        run: |
          set -e

          DEBUG_KEYSTORE="$GITHUB_WORKSPACE/.keys/debug.keystore"
          RELEASE_KEYSTORE="$GITHUB_WORKSPACE/.keys/signingKey.jks"

          echo \
            "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$DEBUG_KEYSTORE" \
            >> "$GITHUB_ENV"

          echo \
            "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" \
            >> "$GITHUB_ENV"

          echo \
            "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" \
            >> "$GITHUB_ENV"

          echo \
            "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RELEASE_KEYSTORE" \
            >> "$GITHUB_ENV"

          echo \
            "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$SIGNING_KEY_ALIAS" \
            >> "$GITHUB_ENV"

          echo \
            "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$SIGNING_STORE_PASSWORD" \
            >> "$GITHUB_ENV"

          echo "Configuración de firma preparada."

      # ============================================================
      # 17. EXPORT DEBUG
      # ============================================================

      - name: Exportar APK Debug
        shell: bash
        run: |
          set -e

          GODOT="./Godot_v4.2.1-stable_mono_linux.x86_64"

          echo "=========================================="
          echo " EXPORT DEBUG APK"
          echo "=========================================="

          "$GODOT" \
            --headless \
            --path "." \
            --export-debug \
            "Android" \
            "build/WoW-debug.apk"

          test -f "build/WoW-debug.apk"

          echo
          echo "Debug APK:"
          ls -lh "build/WoW-debug.apk"

      # ============================================================
      # 18. EXPORT RELEASE
      # ============================================================

      - name: Exportar APK Release
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        shell: bash
        run: |
          set -e

          GODOT="./Godot_v4.2.1-stable_mono_linux.x86_64"

          echo "=========================================="
          echo " EXPORT RELEASE APK"
          echo "=========================================="

          "$GODOT" \
            --headless \
            --path "." \
            --export-release \
            "Android" \
            "build/WoW-release.apk"

          test -f "build/WoW-release.apk"

          echo
          echo "Release APK:"
          ls -lh "build/WoW-release.apk"

      # ============================================================
      # 19. ZIPALIGN DEBUG
      # ============================================================

      - name: Alinear APK Debug
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/build-tools/34.0.0/zipalign" \
            -f \
            4 \
            "build/WoW-debug.apk" \
            "build/WoW-debug-aligned.apk"

      # ============================================================
      # 20. FIRMAR DEBUG
      # ============================================================

      - name: Firmar APK Debug
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            sign \
            --ks ".keys/debug.keystore" \
            --ks-key-alias "androiddebugkey" \
            --ks-pass "pass:android" \
            --key-pass "pass:android" \
            --out "build/WoW-debug-signed.apk" \
            "build/WoW-debug-aligned.apk"

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            verify \
            --verbose \
            "build/WoW-debug-signed.apk"

          rm -f "build/WoW-debug-aligned.apk"

          echo "Debug APK firmada."

      # ============================================================
      # 21. ZIPALIGN RELEASE
      # ============================================================

      - name: Alinear APK Release
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/build-tools/34.0.0/zipalign" \
            -f \
            4 \
            "build/WoW-release.apk" \
            "build/WoW-release-aligned.apk"

      # ============================================================
      # 22. FIRMAR RELEASE
      # ============================================================

      - name: Firmar APK Release
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            sign \
            --ks ".keys/signingKey.jks" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
            --key-pass "pass:$SIGNING_KEY_PASSWORD" \
            --out "build/WoW-release-signed.apk" \
            "build/WoW-release-aligned.apk"

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            verify \
            --verbose \
            "build/WoW-release-signed.apk"

          rm -f "build/WoW-release-aligned.apk"

          echo "Release APK firmada."

      # ============================================================
      # 23. COMPROBACION FINAL
      # ============================================================

      - name: Comprobación final
        shell: bash
        run: |
          set -e

          echo
          echo "=========================================="
          echo " APK FINALES"
          echo "=========================================="

          test -f "build/WoW-debug-signed.apk"
          test -f "build/WoW-release-signed.apk"

          ls -lh \
            "build/WoW-debug-signed.apk" \
            "build/WoW-release-signed.apk"

          echo
          echo "=========================================="
          echo " BUILD COMPLETADO"
          echo "=========================================="

      # ============================================================
      # 24. SUBIR DEBUG
      # ============================================================

      - name: Artifact APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Android-Debug
          path: build/WoW-debug-signed.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 25. SUBIR RELEASE
      # ============================================================

      - name: Artifact APK Release
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Android-Release
          path: build/WoW-release-signed.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 26. SI ES LA PRIMERA EJECUCION:
      #     SUBIR JKS PARA CONVERTIRLO EN SECRET
      # ============================================================

      - name: Subir signingKey inicial
        if: ${{ secrets.SIGNING_KEY == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: WoW-SigningKey-INITIAL
          path: .keys/signingKey.jks
          if-no-files-found: error
          retention-days: 1
