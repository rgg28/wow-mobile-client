name: Android Full Native APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Android SDK e instalar NDK
        run: |
          set -uo pipefail
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | sudo "$SDKMANAGER" --licenses || echo "⚠️ Alerta en licencias."
          
          # Instalamos la plataforma 30 que requiere tu motor para no tirar el error de falta de plataforma
          sudo "$SDKMANAGER" "ndk;25.2.9519653" "platforms;android-30" "platforms;android-33" "build-tools;30.0.3" "build-tools;33.0.2"

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Instalar dependencias del sistema y cargo-apk
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev clang lld file
          
          # Instalamos la herramienta nativa para empaquetar APKs desde Rust sin usar Gradle
          cargo install cargo-apk

      - name: Extraer y acomodar fuentes de Benilla
        run: |
          set -euo pipefail

          if [ -f benilla.zip ]; then
            mkdir -p /tmp/benilla-source
            python3 -c "import zipfile; zipfile.ZipFile('benilla.zip').extractall('/tmp/benilla-source')"

            ROOT_TOML=$(find /tmp/benilla-source -name Cargo.toml -type f -print -quit)
            if [ -z "$ROOT_TOML" ]; then
              echo "::error::No se encontró Cargo.toml en el ZIP"
              exit 1
            fi
            SOURCE_DIR=$(dirname "$ROOT_TOML")

            if [ -d "$SOURCE_DIR/crates" ] && [ -d "crates" ]; then rm -rf crates; fi
            cp -r "$SOURCE_DIR"/* .
            echo "✅ Fuentes reacomodadas con éxito en la raíz."
          else
            echo "::error::El archivo benilla.zip no fue detectado."
            exit 1
          fi

          if [ -d "crates/benilla-app/src/textInput" ]; then
            mv crates/benilla-app/src/textInput crates/benilla-app/src/textinput
          fi

      - name: Configurar metadatos de Android en Cargo.toml
        run: |
          set -euo pipefail
          # Inyectamos los metadatos necesarios sincronizando con el SDK objetivo (API 30)
          echo "" >> Cargo.toml
          echo "[package.metadata.android]" >> Cargo.toml
          echo 'package = "com.wow.mobile"' >> Cargo.toml
          echo 'label = "WoW Mobile"' >> Cargo.toml
          echo 'assets = "assets"' >> Cargo.toml
          echo 'min_sdk_version = 21' >> Cargo.toml
          echo 'target_sdk_version = 30' >> Cargo.toml

      - name: Compilar y Empaquetar APK de forma Nativa
        run: |
          set -euo pipefail
          # Compilación directa a APK usando el compilador nativo de Rust para Android
          cargo apk build --release --target aarch64-linux-android

      - name: Subir APK Final para Jugar
        uses: actions/upload-artifact@v4
        with:
          name: wow-mobile-launcher-native
          path: target/aarch64-linux-android/release/apk/*.apk
