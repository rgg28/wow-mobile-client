name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK e instalar NDK
        run: |
          set -uo pipefail
          
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          
          yes | sudo $SDKMANAGER --licenses || echo "⚠️ Alerta en licencias."
          sudo $SDKMANAGER "ndk;25.2.9519653"

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Instalar dependencias del sistema
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            clang \
            lld \
            file

      - name: Extraer y acomodar fuentes de Benilla
        run: |
          set -euo pipefail

          if [ -f benilla.zip ]; then
            python3 -c "
import zipfile, os, shutil

with zipfile.ZipFile('benilla.zip', 'r') as zip_ref:
    zip_ref.extractall('/tmp/benilla-source')

source_dir = None
for root, dirs, files in os.walk('/tmp/benilla-source'):
    if 'Cargo.toml' in files:
        source_dir = root
        break

if not source_dir:
    print('::error::No se encontró Cargo.toml en el ZIP')
    exit(1)

for item in os.listdir(source_dir):
    s = os.path.join(source_dir, item)
    d = os.path.join('.', item)
    if os.path.isdir(s):
        if os.path.exists(d):
            shutil.rmtree(d)
        shutil.move(s, d)
    else:
        shutil.move(s, d)

print('✅ Fuentes reacomodadas con éxito en la raíz.')
"
          else
            echo "::error::El archivo benilla.zip no fue detectado en la raíz del repositorio."
            exit 1
          fi

          echo "=== 📁 Validando y forzando rutas de archivos ==="
          if [ -d "crates/benilla-app/src/textInput" ]; then
            mv crates/benilla-app/src/textInput crates/benilla-app/src/textinput
          fi

          test -f Cargo.toml
          test -d crates

      - name: Configurar Linkers de Android para Cargo
        run: |
          mkdir -p .cargo
          
          NDK_TOOLCHAIN="/usr/local/lib/android/sdk/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin"
          
          cat << EOF > .cargo/config.toml
          [target.aarch64-linux-android]
          linker = "$NDK_TOOLCHAIN/aarch64-linux-android31-clang"

          [target.armv7-linux-androideabi]
          linker = "$NDK_TOOLCHAIN/armv7-linux-androideabi31-clang"

          [target.x86_64-linux-android]
          linker = "$NDK_TOOLCHAIN/x86_64-linux-android31-clang"

          [target.i686-linux-android]
          linker = "$NDK_TOOLCHAIN/i686-linux-android31-clang"
          EOF

      - name: Compilar proyecto (Rust / Cargo)
        run: |
          cargo build --release --target aarch64-linux-android

      - name: Subir artefactos compilados
        uses: actions/upload-artifact@v4
        with:
          name: android-build-artifacts
          path: target/aarch64-linux-android/release/
