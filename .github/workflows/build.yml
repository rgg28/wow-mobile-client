name: Compilar WoW Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: Build WoW Android
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Descargar repositorio con Git LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      # ============================================================
      # 2. JAVA
      # ============================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. .NET 8
      # ============================================================

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " ANDROID SDK"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=""

          for CANDIDATE in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"
          do
            if [ -f "$CANDIDATE" ]; then
              SDKMANAGER="$CANDIDATE"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: No se encontró sdkmanager."
            find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "sdkmanager encontrado:"
          echo "$SDKMANAGER"

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

          echo
          echo "Aceptando licencias..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo
          echo "Instalando componentes Android..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo
          echo "=========================================="
          echo " ANDROID SDK OK"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" version

      # ============================================================
      # 5. GODOT + LFS
      # ============================================================

      - name: Recuperar binarios Git LFS
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " GIT LFS"
          echo "=========================================="

          git lfs version

          echo
          echo "Archivos LFS:"
          git lfs ls-files

          echo
          echo "Forzando descarga del objeto LFS..."

          git lfs pull

          echo
          echo "Git LFS terminado."

      - name: Verificar Godot Mono
        shell: bash
        run: |
          set -e

          GODOT="./Godot_v4.2.1-stable_mono_linux.x86_64"

          echo "=========================================="
          echo " GODOT MONO"
          echo "=========================================="

          if [ ! -f "$GODOT" ]; then
            echo "ERROR: No existe:"
            echo "$GODOT"
            exit 1
          fi

          echo
          echo "Archivo:"
          ls -lh "$GODOT"

          echo
          echo "Tipo:"
          file "$GODOT"

          echo
          echo "Tamaño:"
          stat -c "%s bytes" "$GODOT"

          echo
          echo "Comprobando pointer LFS..."

          if head -c 200 "$GODOT" | grep -q "git-lfs.github.com/spec"; then
            echo "ERROR: Godot sigue siendo un POINTER LFS."
            echo
            cat "$GODOT"
            exit 1
          fi

          echo "OK: Godot no es un pointer LFS."

          echo
          echo "Comprobando ELF..."

          MAGIC="$(xxd -l 4 -p "$GODOT")"

          if [ "$MAGIC" != "7f454c46" ]; then
            echo "ERROR: Godot no es un ejecutable ELF Linux."
            echo "Magic detectado: $MAGIC"
            exit 1
          fi

          echo "OK: ELF Linux."

          chmod +x "$GODOT"

          echo
          echo "Versión de Godot:"

          "$GODOT" --version

      # ============================================================
      # 6. GODOT TEMPLATES
      # ============================================================

      - name: Verificar archivos Godot del repositorio
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " ARCHIVOS GODOT"
          echo "=========================================="

          test -f "./Godot_v4.2.1-stable_mono_linux.x86_64"
          test -f "./Godot_v4.2.1-stable_mono_export_templates.tpz"
          test -d "./GodotSharp"

          echo "Godot encontrado."
          echo "Templates TPZ encontrados."
          echo "GodotSharp encontrado."

      - name: Instalar templates Mono Android
        shell: bash
        run: |
          set -e

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.2.1.stable.mono"

          echo "=========================================="
          echo " GODOT EXPORT TEMPLATES"
          echo "=========================================="

          rm -rf "$TEMPLATE_DIR"
          mkdir -p "$TEMPLATE_DIR"

          echo "Extrayendo templates..."

          unzip -q \
            "./Godot_v4.2.1-stable_mono_export_templates.tpz" \
            -d "$TEMPLATE_DIR"

          echo
          echo "Contenido inicial:"

          find "$TEMPLATE_DIR" -maxdepth 3 -type f -print

          if [ -d "$TEMPLATE_DIR/templates" ]; then

            echo
            echo "Moviendo templates..."

            cp -a \
              "$TEMPLATE_DIR/templates/." \
              "$TEMPLATE_DIR/"

            rm -rf "$TEMPLATE_DIR/templates"

          fi

          echo
          echo "Templates finales:"

          find "$TEMPLATE_DIR" -maxdepth 2 -type f -print

          echo
          echo "Verificando Android Debug..."

          test -f "$TEMPLATE_DIR/android_debug.apk"

          echo "Android Debug OK."

          echo
          echo "Verificando Android Release..."

          test -f "$TEMPLATE_DIR/android_release.apk"

          echo "Android Release OK."

          echo
          echo "=========================================="
          echo " TEMPLATES ANDROID MONO OK"
          echo "=========================================="

          ls -lh "$TEMPLATE_DIR/android_debug.apk"
          ls -lh "$TEMPLATE_DIR/android_release.apk"

      # ============================================================
      # 7. INFORMACIÓN DEL PROYECTO
      # ============================================================

      - name: Verificar proyecto Godot
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " PROYECTO GODOT"
          echo "=========================================="

          test -f "./project.godot"
          test -f "./WoW Android Client.csproj"

          echo
          echo "project.godot:"
          sed -n '1,120p' "./project.godot"

          echo
          echo "C# project:"
          sed -n '1,160p' "./WoW Android Client.csproj"

      # ============================================================
      # 8. RESTORE
      # ============================================================

      - name: Restaurar proyecto C#
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " DOTNET RESTORE"
          echo "=========================================="

          dotnet restore "WoW Android Client.csproj"

      # ============================================================
      # 9. BUILD DEBUG
      # ============================================================

      - name: Compilar C# Debug
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " BUILD DEBUG"
          echo "=========================================="

          dotnet build \
            "WoW Android Client.csproj" \
            -c Debug \
            --no-restore

          echo
          echo "DLL Debug:"

          find ".godot/mono/temp/bin/Debug" \
            -type f \
            -name "*.dll" \
            -print

          test -f ".godot/mono/temp/bin/Debug/WoW Android Client.dll"

      # ============================================================
      # 10. BUILD RELEASE
      # ============================================================

      - name: Compilar C# Release
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " BUILD RELEASE"
          echo "=========================================="

          dotnet build \
            "WoW Android Client.csproj" \
            -c Release \
            --no-restore

          echo
          echo "DLL Release:"

          find ".godot/mono/temp/bin/Release" \
            -type f \
            -name "*.dll" \
            -print

          test -f ".godot/mono/temp/bin/Release/WoW Android Client.dll"

      # ============================================================
      # 11. GODOT BUILD SOLUTION
      # ============================================================

      - name: Validar solución C# con Godot
        shell: bash
        run: |
          set -e

          GODOT="./Godot_v4.2.1-stable_mono_linux.x86_64"

          echo "=========================================="
          echo " GODOT C# VALIDATION"
          echo "=========================================="

          "$GODOT" \
            --headless \
            --path "." \
            --build-solutions \
            --quit

      # ============================================================
      # 12. VALIDAR PROYECTO
      # ============================================================

      - name: Validar proyecto Godot
        shell: bash
        run: |
          set -e

          GODOT="./Godot_v4.2.1-stable_mono_linux.x86_64"

          echo "=========================================="
          echo " GODOT PROJECT VALIDATION"
          echo "=========================================="

          "$GODOT" \
            --headless \
            --path "." \
            --editor \
            --quit \
            --verbose

      # ============================================================
      # 13. CREAR KEYSTORE TEMPORAL
      # ============================================================

      - name: Crear keystore temporal
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " KEYSTORE"
          echo "=========================================="

          mkdir -p .keys

          keytool \
            -genkeypair \
            -v \
            -keystore ".keys/signingKey.jks" \
            -alias "android" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "androidpassword" \
            -keypass "androidpassword" \
            -dname "CN=WoW Android, OU=Mobile, O=WoW, L=Argentina, ST=Tucuman, C=AR"

          test -f ".keys/signingKey.jks"

          echo
          echo "Keystore creado correctamente."

      # ============================================================
      # 14. CREAR BUILD
      # ============================================================

      - name: Crear carpeta build
        shell: bash
        run: |
          set -e

          rm -rf build
          mkdir -p build

      # ============================================================
      # 15. EXPORT DEBUG
      # ============================================================

      - name: Exportar APK Debug
        shell: bash
        run: |
          set -e

          GODOT="./Godot_v4.2.1-stable_mono_linux.x86_64"

          echo "=========================================="
          echo " EXPORT DEBUG APK"
          echo "=========================================="

          "$GODOT" \
            --headless \
            --path "." \
            --export-debug "Android" \
            "build/WoW-debug.apk"

          test -f "build/WoW-debug.apk"

          echo
          echo "APK Debug creada:"
          ls -lh "build/WoW-debug.apk"

      # ============================================================
      # 16. EXPORT RELEASE
      # ============================================================

      - name: Exportar APK Release
        shell: bash
        run: |
          set -e

          GODOT="./Godot_v4.2.1-stable_mono_linux.x86_64"

          echo "=========================================="
          echo " EXPORT RELEASE APK"
          echo "=========================================="

          "$GODOT" \
            --headless \
            --path "." \
            --export-release "Android" \
            "build/WoW-release.apk"

          test -f "build/WoW-release.apk"

          echo
          echo "APK Release creada:"
          ls -lh "build/WoW-release.apk"

      # ============================================================
      # 17. FIRMAR DEBUG
      # ============================================================

      - name: Firmar APK Debug
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " FIRMAR DEBUG"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/34.0.0/zipalign" \
            -f \
            4 \
            "build/WoW-debug.apk" \
            "build/WoW-debug-aligned.apk"

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks ".keys/signingKey.jks" \
            --ks-key-alias "android" \
            --ks-pass "pass:androidpassword" \
            --key-pass "pass:androidpassword" \
            --out "build/WoW-debug-signed.apk" \
            "build/WoW-debug-aligned.apk"

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify \
            --verbose \
            "build/WoW-debug-signed.apk"

          rm -f "build/WoW-debug-aligned.apk"

          echo
          echo "APK Debug firmada:"
          ls -lh "build/WoW-debug-signed.apk"

      # ============================================================
      # 18. FIRMAR RELEASE
      # ============================================================

      - name: Firmar APK Release
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " FIRMAR RELEASE"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/34.0.0/zipalign" \
            -f \
            4 \
            "build/WoW-release.apk" \
            "build/WoW-release-aligned.apk"

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks ".keys/signingKey.jks" \
            --ks-key-alias "android" \
            --ks-pass "pass:androidpassword" \
            --key-pass "pass:androidpassword" \
            --out "build/WoW-release-signed.apk" \
            "build/WoW-release-aligned.apk"

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify \
            --verbose \
            "build/WoW-release-signed.apk"

          rm -f "build/WoW-release-aligned.apk"

          echo
          echo "APK Release firmada:"
          ls -lh "build/WoW-release-signed.apk"

      # ============================================================
      # 19. COMPROBACIÓN FINAL
      # ============================================================

      - name: Comprobación final
        shell: bash
        run: |
          set -e

          echo
          echo "=========================================="
          echo " BUILD FINAL"
          echo "=========================================="

          test -f "build/WoW-debug.apk"
          test -f "build/WoW-debug-signed.apk"
          test -f "build/WoW-release.apk"
          test -f "build/WoW-release-signed.apk"

          echo
          echo "Archivos generados:"
          ls -lh build/

          echo
          echo "=========================================="
          echo " APK DEBUG:"
          echo " build/WoW-debug-signed.apk"
          echo
          echo " APK RELEASE:"
          echo " build/WoW-release-signed.apk"
          echo "=========================================="

      # ============================================================
      # 20. ARTIFACT DEBUG
      # ============================================================

      - name: Subir APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Android-Debug
          path: build/WoW-debug-signed.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 21. ARTIFACT RELEASE
      # ============================================================

      - name: Subir APK Release
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Android-Release
          path: build/WoW-release-signed.apk
          if-no-files-found: error
          retention-days: 30
