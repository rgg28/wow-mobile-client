name: Compilar WoW

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Descargar repositorio
      # ============================================================
      - name: Descargar código fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. .NET 8
      # ============================================================
      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # ============================================================
      # 4. Preparar Android SDK
      # ============================================================
      - name: Configurar Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: No se encontró sdkmanager."
            exit 1
          fi

          echo "sdkmanager encontrado:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "Android SDK preparado."

      # ============================================================
      # 5. Verificar Godot incluido en el repositorio
      # ============================================================
      - name: Preparar Godot incluido en el repositorio
        shell: bash
        run: |
          set -e

          echo "===== GODOT ====="

          test -f "./Godot_v4.2.1-stable_mono_linux.x86_64"

          test -f "./Godot_v4.2.1-stable_mono_export_templates.tpz"

          test -d "./GodotSharp"

          chmod +x "./Godot_v4.2.1-stable_mono_linux.x86_64"

          echo "Ejecutable:"
          ls -lh "./Godot_v4.2.1-stable_mono_linux.x86_64"

          echo
          echo "Templates:"
          ls -lh "./Godot_v4.2.1-stable_mono_export_templates.tpz"

          echo
          echo "GodotSharp:"
          ls -ld "./GodotSharp"

          echo
          echo "Versión de Godot:"

          ./Godot_v4.2.1-stable_mono_linux.x86_64 \
            --version

      # ============================================================
      # 6. Instalar templates desde el TPZ del repositorio
      # ============================================================
      - name: Instalar templates Mono
        shell: bash
        run: |
          set -e

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.2.1.stable.mono"

          rm -rf "$TEMPLATE_DIR"

          mkdir -p "$TEMPLATE_DIR"

          echo "Extrayendo templates..."

          unzip -q \
            "./Godot_v4.2.1-stable_mono_export_templates.tpz" \
            -d "$TEMPLATE_DIR"

          echo
          echo "Contenido inicial:"
          find "$TEMPLATE_DIR" -maxdepth 3 -type f -print

          # El paquete .tpz normalmente contiene una carpeta
          # llamada templates.
          if [ -d "$TEMPLATE_DIR/templates" ]; then
            cp -r \
              "$TEMPLATE_DIR/templates/"* \
              "$TEMPLATE_DIR/"
          fi

          echo
          echo "Templates finales:"
          find "$TEMPLATE_DIR" -maxdepth 2 -type f -print

          echo
          echo "Buscando Android Debug..."

          DEBUG_TEMPLATE=$(find "$TEMPLATE_DIR" \
            -type f \
            -name "android_debug.apk" \
            | head -n 1)

          if [ -z "$DEBUG_TEMPLATE" ]; then
            echo "ERROR: No se encontró android_debug.apk"
            exit 1
          fi

          echo "Debug:"
          echo "$DEBUG_TEMPLATE"

          echo
          echo "Buscando Android Release..."

          RELEASE_TEMPLATE=$(find "$TEMPLATE_DIR" \
            -type f \
            -name "android_release.apk" \
            | head -n 1)

          if [ -z "$RELEASE_TEMPLATE" ]; then
            echo "ERROR: No se encontró android_release.apk"
            exit 1
          fi

          echo "Release:"
          echo "$RELEASE_TEMPLATE"

          # Si quedaron dentro de una subcarpeta, copiarlos
          # a la ubicación exacta que Godot espera.
          cp "$DEBUG_TEMPLATE" \
            "$TEMPLATE_DIR/android_debug.apk"

          cp "$RELEASE_TEMPLATE" \
            "$TEMPLATE_DIR/android_release.apk"

          echo
          echo "Templates Android Mono preparados."

          ls -lh "$TEMPLATE_DIR/android_debug.apk"
          ls -lh "$TEMPLATE_DIR/android_release.apk"

      # ============================================================
      # 7. Verificar proyecto
      # ============================================================
      - name: Verificar proyecto
        shell: bash
        run: |
          set -e

          test -f "project.godot"
          test -f "export_presets.cfg"
          test -f "WoW Android Client.csproj"

          echo "project.godot OK"
          echo "export_presets.cfg OK"
          echo "csproj OK"

          echo
          echo "Archivos C#:"

          find . -maxdepth 2 \
            -type f \
            -name "*.cs" \
            -print

      # ============================================================
      # 8. Restaurar NuGet
      # ============================================================
      - name: Restaurar proyecto .NET
        shell: bash
        run: |
          set -e

          dotnet restore \
            "WoW Android Client.csproj"

      # ============================================================
      # 9. Compilar Debug
      # ============================================================
      - name: Compilar C# Debug
        shell: bash
        run: |
          set -e

          dotnet build \
            "WoW Android Client.csproj" \
            -c Debug \
            --no-restore

      # ============================================================
      # 10. Compilar Release
      # ============================================================
      - name: Compilar C# Release
        shell: bash
        run: |
          set -e

          dotnet build \
            "WoW Android Client.csproj" \
            -c Release \
            --no-restore

      # ============================================================
      # 11. Verificar assemblies
      # ============================================================
      - name: Verificar assemblies Debug y Release
        shell: bash
        run: |
          set -e

          DEBUG_DLL=".godot/mono/temp/bin/Debug/WoW Android Client.dll"
          RELEASE_DLL=".godot/mono/temp/bin/Release/WoW Android Client.dll"

          echo "===== DEBUG ====="

          test -f "$DEBUG_DLL"

          ls -lh "$DEBUG_DLL"

          echo
          echo "===== RELEASE ====="

          test -f "$RELEASE_DLL"

          ls -lh "$RELEASE_DLL"

          echo
          echo "Ambos assemblies existen."

      # ============================================================
      # 12. Generar solución C# de Godot
      # ============================================================
      - name: Generar solución Godot
        shell: bash
        run: |
          set -e

          ./Godot_v4.2.1-stable_mono_linux.x86_64 \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --build-solutions \
            --quit

      # ============================================================
      # 13. Validar proyecto
      # ============================================================
      - name: Validar proyecto Godot
        shell: bash
        run: |
          set -e

          ./Godot_v4.2.1-stable_mono_linux.x86_64 \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --editor \
            --quit

      # ============================================================
      # 14. Verificar preset Android
      # ============================================================
      - name: Verificar preset Android
        shell: bash
        run: |
          set -e

          echo "===== PRESETS ====="

          grep -n '^\[preset\.' \
            export_presets.cfg || true

          echo
          echo "===== ANDROID ====="

          grep -n 'platform="Android"' \
            export_presets.cfg || true

          echo
          echo "===== PACKAGE ====="

          grep -n 'package/name' \
            export_presets.cfg || true

      # ============================================================
      # 15. Crear keystore temporal
      # ============================================================
      - name: Crear keystore
        shell: bash
        run: |
          set -e

          mkdir -p ".keys"

          keytool \
            -genkeypair \
            -v \
            -keystore ".keys/signingKey.jks" \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass androidpassword \
            -keypass androidpassword \
            -dname "CN=WoW Android,O=WoW,C=AR"

          test -f ".keys/signingKey.jks"

          echo "Keystore creado."

      # ============================================================
      # 16. Exportar DEBUG
      # ============================================================
      - name: Exportar APK Debug
        shell: bash
        run: |
          set -e

          mkdir -p build

          rm -f \
            build/WoW-debug.apk \
            build/WoW-debug-aligned.apk \
            build/WoW-debug-signed.apk

          echo "Exportando DEBUG..."

          ./Godot_v4.2.1-stable_mono_linux.x86_64 \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-debug \
            "Android" \
            "$GITHUB_WORKSPACE/build/WoW-debug.apk"

          test -f "build/WoW-debug.apk"

          ls -lh "build/WoW-debug.apk"

      # ============================================================
      # 17. Exportar RELEASE
      # ============================================================
      - name: Exportar APK Release
        shell: bash
        run: |
          set -e

          mkdir -p build

          rm -f \
            build/WoW-release.apk \
            build/WoW-release-aligned.apk \
            build/WoW-release-signed.apk

          echo "Exportando RELEASE..."

          ./Godot_v4.2.1-stable_mono_linux.x86_64 \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-release \
            "Android" \
            "$GITHUB_WORKSPACE/build/WoW-release.apk"

          test -f "build/WoW-release.apk"

          ls -lh "build/WoW-release.apk"

      # ============================================================
      # 18. Firmar DEBUG
      # ============================================================
      - name: Firmar APK Debug
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/zipalign" \
            -f \
            4 \
            build/WoW-debug.apk \
            build/WoW-debug-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks ".keys/signingKey.jks" \
            --ks-pass pass:androidpassword \
            --key-pass pass:androidpassword \
            --ks-key-alias android \
            --out build/WoW-debug-signed.apk \
            build/WoW-debug-aligned.apk

          test -f "build/WoW-debug-signed.apk"

      # ============================================================
      # 19. Firmar RELEASE
      # ============================================================
      - name: Firmar APK Release
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/zipalign" \
            -f \
            4 \
            build/WoW-release.apk \
            build/WoW-release-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks ".keys/signingKey.jks" \
            --ks-pass pass:androidpassword \
            --key-pass pass:androidpassword \
            --ks-key-alias android \
            --out build/WoW-release-signed.apk \
            build/WoW-release-aligned.apk

          test -f "build/WoW-release-signed.apk"

      # ============================================================
      # 20. Verificar firmas
      # ============================================================
      - name: Verificar firmas APK
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          echo "===== DEBUG ====="

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            build/WoW-debug-signed.apk

          echo
          echo "===== RELEASE ====="

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            build/WoW-release-signed.apk

      # ============================================================
      # 21. Mostrar resultados
      # ============================================================
      - name: Mostrar APKs finales
        shell: bash
        run: |
          set -e

          echo
          echo "=========================================="
          echo " APK DEBUG"
          echo "=========================================="

          ls -lh build/WoW-debug-signed.apk

          echo
          echo "=========================================="
          echo " APK RELEASE"
          echo "=========================================="

          ls -lh build/WoW-release-signed.apk

      # ============================================================
      # 22. Artifact DEBUG
      # ============================================================
      - name: Subir APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Android-Debug
          path: build/WoW-debug-signed.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 23. Artifact RELEASE
      # ============================================================
      - name: Subir APK Release
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Android-Release
          path: build/WoW-release-signed.apk
          if-no-files-found: error
          retention-days: 14
