name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK e instalar NDK
        run: |
          set -uo pipefail
          
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          
          yes | sudo $SDKMANAGER --licenses || echo "⚠️ Alerta en licencias."
          sudo $SDKMANAGER "ndk;25.2.9519653"

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Instalar dependencias del sistema
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            clang \
            lld \
            file

      - name: Extraer y acomodar fuentes de Benilla
        run: |
          set -euo pipefail

          if [ -f benilla.zip ]; then
            # 1. Crear carpeta temporal y extraer de forma nativa
            mkdir -p /tmp/benilla-source
            python3 -c "import zipfile; zipfile.ZipFile('benilla.zip').extractall('/tmp/benilla-source')"

            # 2. Localizar dónde quedó el Cargo.toml principal
            ROOT_TOML=$(find /tmp/benilla-source -name Cargo.toml -type f -print -quit)
            if [ -z "$ROOT_TOML" ]; then
              echo "::error::No se encontró Cargo.toml en el ZIP"
              exit 1
            fi
            SOURCE_DIR=$(dirname "$ROOT_TOML")

            # 3. Mover de forma segura usando comandos Bash nativos limpios
            # Borramos directorios conflictivos si ya existieran antes de mover
            if [ -d "$SOURCE_DIR/crates" ] && [ -d "crates" ]; then rm -rf crates; fi
            
            # Copiar todo el contenido interno a la raíz del espacio de trabajo
            cp -r "$SOURCE_DIR"/* .
            echo "✅ Fuentes reacomodadas con éxito en la raíz."
          else
            echo "::error::El archivo benilla.zip no fue detectado en la raíz del repositorio."
            exit 1
          fi

          echo "=== 📁 Validando y forzando rutas de archivos ==="
          # Normalizar textInput a minúsculas de forma nativa si llegase a existir con variaciones
          if [ -d "crates/benilla-app/src/textInput" ]; then
            mv crates/benilla-app/src/textInput crates/benilla-app/src/textinput
          fi

          # Validaciones estructurales para Cargo
          test -f Cargo.toml
          test -d crates

      - name: Configurar Linkers de Android para Cargo
        run: |
          mkdir -p .cargo
          
          NDK_TOOLCHAIN="/usr/local/lib/android/sdk/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin"
          
          cat << EOF > .cargo/config.toml
          [target.aarch64-linux-android]
          linker = "$NDK_TOOLCHAIN/aarch64-linux-android31-clang"

          [target.armv7-linux-androideabi]
          linker = "$NDK_TOOLCHAIN/armv7-linux-androideabi31-clang"

          [target.x86_64-linux-android]
          linker = "$NDK_TOOLCHAIN/x86_64-linux-android31-clang"

          [target.i686-linux-android]
          linker = "$NDK_TOOLCHAIN/i686-linux-android31-clang"
          EOF

      - name: Compilar proyecto (Rust / Cargo)
        run: |
          cargo build --release --target aarch64-linux-android

      - name: Subir artefactos compilados
        uses: actions/upload-artifact@v4
        with:
          name: android-build-artifacts
          path: target/aarch64-linux-android/release/
