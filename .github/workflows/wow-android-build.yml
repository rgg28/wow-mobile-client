name: Build WoW 3.3.5a Android Client (Auto-Signed)

on:
  workflow_dispatch: # 👈 Activación manual desde la pestaña 'Actions'

jobs:
  build-release-apk:
    name: Compilar APK con Firma Automática
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Componentes del SDK y NDK de Android
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Inicializar Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.4

      - name: Forzar Reescritura del Manifiesto Limpio (Inyección Directa Masiva) 💡
        run: |
          # 1. Borramos cualquier rastro del archivo viejo corrupto para limpiar el repositorio
          rm -f app/src/main/AndroidManifest.xml
          mkdir -p app/src/main
          
          # 2. Generamos el archivo completamente nuevo desde Linux con variables protegidas
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="WoW Mobile"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name="com.wow.client.MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Generar Llave de Firma Automáticamente (.keystore)
        run: |
          keytool -genkey -v \
            -keystore app/wow-auto-key.keystore \
            -alias wowalias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "WowPassword123" \
            -keypass "WowPassword123" \
            -dname "CN=WoWAndroid, OU=Dev, O=WoWClient, L=World, S=Azeroth, C=US"

      - name: Configurar Variables de Firma en Gradle
        run: |
          mkdir -p ~/.gradle
          echo "WOW_STORE_PASSWORD=WowPassword123" >> ~/.gradle/gradle.properties
          echo "WOW_KEY_PASSWORD=WowPassword123" >> ~/.gradle/gradle.properties
          echo "WOW_KEY_ALIAS=wowalias" >> ~/.gradle/gradle.properties

      - name: Dar Permisos de Ejecución a Gradle
        run: chmod +x ./gradlew

      - name: Compilar APK Firmada (Java + C++)
        run: ./gradlew assembleRelease --no-build-cache

      - name: Entregar APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Client-3.3.5a-AutoSigned
          path: app/build/outputs/apk/release/*.apk
